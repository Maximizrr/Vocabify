<style>
/* Layout: sticky top bar with nav, single centered column (max 1080px), cards only for working areas; fixed version label bottom-left; pet stage overlays the start page. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f6; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8;
  --brand:#0071e3; --brand-soft:#e8f1fd; --check:#2fa84f; --logo:#1d1d1f;
  --en:#e5352b; --la:#2fa84f; --fr:#f08a00;
  --en-soft:#fff0ef; --la-soft:#eaf7ee; --fr-soft:#fff4e5;
  --coin:#e8a50c; --coin-soft:#fff6e0; --good:#248a3d; --bad:#d70015; --warn:#b25000;
  --wood:#a86b3c; --wood-2:#c98a52; --metal:#e0b63c;
  --shadow:0 2px 6px rgba(0,0,0,.04),0 18px 40px -14px rgba(0,0,0,.16);
  --card-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 18px -6px rgba(0,0,0,.06);
  --lift-shadow:0 2px 4px rgba(0,0,0,.04),0 18px 40px -16px rgba(0,0,0,.2);
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --r-lg:24px; --r-md:12px;
  --acc:var(--brand); --acc-soft:var(--brand-soft); --on-acc:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --brand:#2997ff; --brand-soft:#0d2a4a; --check:#32d74b; --logo:#f5f5f7;
  --en:#ff453a; --la:#32d74b; --fr:#ff9f0a;
  --en-soft:#3a1513; --la-soft:#10301a; --fr-soft:#3a2508;
  --coin:#f7c234; --coin-soft:#33280c; --good:#32d74b; --bad:#ff453a; --warn:#ff9f0a;
  --wood:#8a5630; --wood-2:#a96e3f; --metal:#d9ad35;
  --shadow:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.8);
  --card-shadow:0 0 0 1px rgba(255,255,255,.04);
  --lift-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 40px -16px rgba(0,0,0,.9);
  --on-acc:#ffffff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
  --brand:#2997ff; --brand-soft:#0d2a4a; --check:#32d74b; --logo:#f5f5f7;
  --en:#ff453a; --la:#32d74b; --fr:#ff9f0a;
  --en-soft:#3a1513; --la-soft:#10301a; --fr-soft:#3a2508;
  --coin:#f7c234; --coin-soft:#33280c; --good:#32d74b; --bad:#ff453a; --warn:#ff9f0a;
  --wood:#8a5630; --wood-2:#a96e3f; --metal:#d9ad35;
  --shadow:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.8);
  --card-shadow:0 0 0 1px rgba(255,255,255,.04);
  --lift-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 40px -16px rgba(0,0,0,.9);
  --on-acc:#ffffff;
  color-scheme:dark;
}
body[data-lang="en"]{--acc:var(--en);--acc-soft:var(--en-soft)}
body[data-lang="la"]{--acc:var(--la);--acc-soft:var(--la-soft)}
body[data-lang="fr"]{--acc:var(--fr);--acc-soft:var(--fr-soft)}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;font-weight:700;color:var(--muted)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.55em 1.05em;border-radius:12px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:.35em .75em;font-size:.88rem;border-radius:10px}
.btn.big{padding:.8em 1.4em;font-size:1.05rem;border-radius:14px}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field label{font-weight:700;font-size:.88rem}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em .8em;min-width:0}
.input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea.input{resize:vertical;min-height:7rem;line-height:1.5}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* app shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.45rem;font-family:var(--f-display);font-weight:700;font-size:1.35rem;color:var(--brand);letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:38px;height:32px}
.nav{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;order:3;width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:.45em .85em;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:.85em;right:.85em;bottom:2px;height:3px;border-radius:3px;background:var(--acc)}
.badge{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .3em;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;margin-left:.3em;vertical-align:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.coin-pill{display:inline-flex;align-items:center;gap:.4em;background:var(--coin-soft);color:var(--ink);font-weight:700;padding:.3em .8em .3em .4em;border-radius:99px;font-variant-numeric:tabular-nums}
.user-chip{font-weight:700;font-size:.9rem;color:var(--muted)}
@media (min-width:820px){.nav{order:0;width:auto}}

main{max-width:1080px;margin:0 auto;padding-block:1.6rem 5rem;padding-inline:16px;display:flex;flex-direction:column;gap:1.4rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.version{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:.15em .6em;border-radius:99px;z-index:40;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:.6em .9em;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:.8rem;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:2rem;padding-inline:16px}
.login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.4rem}
.logo-big{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.logo-big svg{width:150px;height:125px}
.logo-big .word{font-family:var(--f-display);font-weight:700;font-size:2.6rem;color:var(--ink);letter-spacing:-.02em;line-height:1}
.logo-big .tag{color:var(--muted);font-size:.95rem}
.logo-check{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .9s .25s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.login form{display:flex;flex-direction:column;gap:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
.note{background:var(--surface-2);border-radius:12px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted)}

/* home */
.hello{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.15rem;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--check);border-radius:99px;transition:width .5s}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

.path{position:relative;padding:3.2rem .5rem 2.6rem;overflow-x:auto}
.path-inner{position:relative;min-width:520px;height:18px;margin:0 30px}
.track{position:absolute;inset:4px 0;border-radius:99px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 12px,transparent 12px 18px);border:1px dashed var(--line)}
.track-fill{position:absolute;left:0;top:4px;bottom:4px;border-radius:99px;background:var(--check);transition:width .6s}
.marker{position:absolute;top:-34px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:.78rem;padding:.12em .55em;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:left .6s}
.marker::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.milestone{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25rem}
.chest{width:62px;height:54px;border:0;background:none;padding:0;cursor:default;position:relative}
.chest svg{width:100%;height:100%;overflow:visible}
.chest .lid{transform-origin:6px 18px;transition:transform .5s}
.chest.locked svg{filter:grayscale(1);opacity:.55}
.chest.ready{cursor:pointer;animation:wiggle 1.6s ease-in-out infinite}
.chest.ready::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--coin) 45%,transparent),transparent 70%);z-index:-1}
.chest.open .lid{transform:rotate(-28deg)}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}85%{transform:rotate(7deg)}95%{transform:rotate(-3deg)}}
.ms-label{position:absolute;top:100%;margin-top:.15rem;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;text-align:center}
.ms-label b{color:var(--coin)}

/* learn config */
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.32em .85em;font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.lang-dot{width:.65em;height:.65em;border-radius:50%;display:inline-block;flex:none}
.lang-dot.en{background:var(--en)}.lang-dot.la{background:var(--la)}.lang-dot.fr{background:var(--fr)}
.lang-tag{display:inline-flex;align-items:center;gap:.35em;font-size:.75rem;font-weight:700;padding:.2em .6em;border-radius:6px}
.lang-tag.en{background:var(--en-soft);color:var(--en)}.lang-tag.la{background:var(--la-soft);color:var(--la)}.lang-tag.fr{background:var(--fr-soft);color:var(--fr)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:var(--surface);padding:.5em .9em;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.8rem .9rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.2rem}
.mode b{font-family:var(--f-display);font-size:1.05rem}
.mode span{font-size:.85rem;color:var(--muted)}
.mode em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mode[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.cfg{display:flex;flex-direction:column;gap:1.2rem}
.cfg-group{display:flex;flex-direction:column;gap:.5rem}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:1rem}
.quiz-word{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3rem);line-height:1.1;overflow-wrap:anywhere;padding:.6rem 0}
.quiz form{display:flex;gap:.6rem;flex-wrap:wrap}
.quiz form .input{flex:1 1 220px;font-size:1.15rem;padding:.75em 1em}
.fb{border-radius:14px;padding:.85rem 1rem;font-weight:700;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.fb.right{background:var(--la-soft);color:var(--good)}
.fb.wrong{background:var(--en-soft);color:var(--bad)}
.fb .sol{color:var(--ink);font-weight:700}
.coin-pop{display:inline-flex;align-items:center;gap:.3em;color:var(--coin);animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.quiz.shake .input{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.rate{display:inline-block;min-width:3.2em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* sections grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
.sec-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.sec-card:hover{border-color:var(--ink)}
.sec-card h3{overflow-wrap:anywhere}
.sec-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem;align-items:end}
.add-row.four{grid-template-columns:1fr 1fr auto auto}
@media (max-width:600px){.add-row,.add-row.four{grid-template-columns:1fr}}
.panel{border:1px dashed var(--line);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.scan-thumb{max-height:220px;max-width:100%;width:auto;height:auto;align-self:flex-start;object-fit:contain;border-radius:10px;border:1px solid var(--line)}
.invite{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.invite .who{flex:1;min-width:200px}
.inline-confirm{display:inline-flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.9rem}

/* shop */
.shop-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.shop-head .coin-pill{margin-left:auto;font-size:1.15rem;padding:.4em 1em .4em .5em}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.pet-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.pet-card .ava{width:76px;height:76px;border-radius:22px;background:var(--surface-2);display:grid;place-items:center;font-size:44px;line-height:1}
.pet-card p{font-size:.88rem;color:var(--muted);flex:1}
.pet-card .price{display:flex;align-items:center;gap:.35em;font-weight:700;font-variant-numeric:tabular-nums}
.pet-card.owned{border-color:var(--check)}
.owned-list{display:flex;gap:.6rem;flex-wrap:wrap}
.own{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.5rem .8rem .5rem .5rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;font-weight:700}
.own .e{font-size:28px;width:40px;height:40px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px}
.own[aria-pressed="true"]{border-color:var(--check);box-shadow:0 0 0 3px color-mix(in srgb,var(--check) 25%,transparent)}

/* wiki */
.art-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem}
.art-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:1.1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.art-card:hover{border-color:var(--ink)}
.art-card h3{font-size:1.2rem;overflow-wrap:anywhere}
.art-card .ex{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art-meta{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-weight:700;align-items:center}
.status{font-size:.72rem;font-weight:700;padding:.2em .55em;border-radius:6px}
.status.pending{background:var(--fr-soft);color:var(--warn)}
.status.approved{background:var(--la-soft);color:var(--good)}
.status.rejected{background:var(--en-soft);color:var(--bad)}
.article{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:1rem;width:100%}
.article h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.article .body{font-size:1.05rem;line-height:1.7;display:flex;flex-direction:column;gap:.9rem;overflow-wrap:anywhere}
.article .body h2{font-size:1.4rem;margin-top:.6rem}
.article .body ul{margin:0;padding-left:1.3rem}
.article .body figure{margin:0}
.article .body figure img{border-radius:12px;border:1px solid var(--line)}
.article .sources{border-top:1px solid var(--line);padding-top:1rem;font-size:.88rem;color:var(--muted)}
.article .sources ol{margin:.4rem 0 0;padding-left:1.3rem;overflow-wrap:anywhere}
.font-sans{font-family:var(--f-body)}
.font-serif{font-family:"Merriweather",Georgia,serif}
.font-serif .body{font-size:1rem}
.font-hand{font-family:"Caveat","Comic Sans MS",cursive}
.font-hand .body{font-size:1.45rem;line-height:1.45}
.font-round{font-family:var(--f-display)}
.like{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.45em 1em;font-weight:700;cursor:pointer;display:inline-flex;gap:.45em;align-items:center}
.like[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--en-soft)}
.like svg{width:1.1em;height:1.1em}
.thumbs{display:flex;gap:.6rem;flex-wrap:wrap}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;padding:.35rem;display:flex;flex-direction:column;gap:.3rem;align-items:center;background:var(--surface)}
.thumb img{width:110px;height:80px;object-fit:cover;border-radius:6px}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:var(--surface);border-radius:22px;padding:1.6rem;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:.9rem;align-items:center;box-shadow:var(--shadow)}
.modal .big-chest{width:130px;height:112px}
.modal .big-chest .lid{transform-origin:6px 18px;animation:lidOpen .7s .35s forwards}
@keyframes lidOpen{to{transform:rotate(-32deg)}}
.reward{font-family:var(--f-display);font-weight:700;font-size:2.4rem;color:var(--coin);display:flex;align-items:center;gap:.3em;opacity:0;animation:pop .5s .9s forwards}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem;z-index:90;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:12px;font-weight:700;box-shadow:var(--shadow);animation:pop .3s}

/* pets */
#petStage{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.pet{position:absolute;left:0;top:0;width:60px;height:60px;pointer-events:auto;cursor:pointer;will-change:transform}
.pet-flip{width:100%;height:100%;transition:transform .2s}
.pet-body{width:100%;height:100%;font-size:52px;line-height:60px;text-align:center;user-select:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.pet.walking .pet-body{animation:bob .45s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.pet-body.roll{animation:roll .9s ease-in-out}
@keyframes roll{to{transform:rotate(-360deg)}}
.pet-body.bounce{animation:bounce .5s ease-out 2}
@keyframes bounce{40%{transform:translateY(-18px) scaleY(1.05)}}
.pet-body.munch{animation:munch .3s ease-in-out 6}
@keyframes munch{50%{transform:scaleY(.9) translateY(3px)}}
.pet-body.raise{animation:raise .9s ease-in-out}
@keyframes raise{30%,70%{transform:rotate(14deg) translateY(-6px)}}
.pet-body.sleep{animation:sleep 2.6s ease-in-out}
@keyframes sleep{20%,80%{transform:rotate(-10deg) scale(.95)}}
.shell{width:52px;height:30px;margin:22px auto 0;border-radius:52px 52px 10px 10px;background:radial-gradient(circle at 30% 30%,#9ccf6b,#4f8a2b);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);position:relative}
.shell::before{content:"";position:absolute;inset:6px 10px 8px;border-radius:30px 30px 4px 4px;background:repeating-conic-gradient(from 20deg,rgba(0,0,0,.14) 0 12deg,transparent 12deg 45deg)}
.fx{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
.say{background:var(--surface);color:var(--ink);font-weight:700;font-family:var(--f-display);font-size:1.05rem;padding:.15em .65em;border-radius:12px;border:2px solid var(--ink);white-space:nowrap;animation:say 1.6s forwards}
@keyframes say{0%{transform:translateY(8px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.bubble{width:12px;height:12px;border-radius:50%;border:2px solid #6fb7ea;background:rgba(160,215,250,.35);animation:rise 2.2s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-140px) scale(1.3);opacity:0}}
.drop{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#4aa3df;animation:spray 1.1s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes spray{0%{transform:translate(0,0);opacity:1}50%{transform:translate(calc(var(--dx)*.6),var(--up))}100%{transform:translate(var(--dx),40px);opacity:0}}
.emo{font-size:30px;line-height:1;animation:emo 2s forwards}
@keyframes emo{0%{transform:scale(.3);opacity:0}15%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:0;transform:scale(.6)}}
.yarn{font-size:26px;animation:yarn 1.8s ease-out forwards}
@keyframes yarn{0%{transform:translateX(0) rotate(0)}60%{transform:translateX(var(--dx)) rotate(540deg)}100%{transform:translateX(var(--dx)) rotate(560deg);opacity:0}}
.zzz{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:1.2rem;animation:zzz 2.4s forwards}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(24px,-50px)}}
.prop{position:absolute;pointer-events:none}
.branch-v{width:16px;border-radius:8px;background:linear-gradient(90deg,var(--wood),var(--wood-2) 50%,var(--wood))}
.branch-h{height:14px;border-radius:8px;background:linear-gradient(180deg,var(--wood-2),var(--wood))}
.leaf{position:absolute;width:22px;height:12px;border-radius:12px 0;background:var(--la)}
.spinner{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.splash{min-height:100vh;display:grid;place-items:center}
/* scanner */
.scan-table td{padding:.35rem .4rem}
.scan-table .input{padding:.4em .6em;border-radius:9px}
.scan-table tr.off .input{opacity:.45;text-decoration:line-through}
.scan-table .input.unsure{border-color:var(--fr);background:var(--fr-soft)}
details.paste summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.paste summary:hover{color:var(--ink)}
pre.raw{white-space:pre-wrap;font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem;max-height:220px;overflow:auto;margin:.6rem 0 0}
/* greeting */
.hello h1{font-size:clamp(1.8rem,5vw,2.5rem)}
.hello .sub{color:var(--muted);font-size:1.05rem;margin-top:.35rem;max-width:60ch}
.streak{display:inline-flex;align-items:center;gap:.4em;font-weight:700;padding:.35em .85em;border-radius:99px;background:var(--fr-soft);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.streak svg{width:1.05em;height:1.05em}
/* feedback */
.fb-list{display:flex;flex-direction:column;gap:.7rem}
.fb-item{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.55rem;background:var(--surface);min-width:0}
.fb-item.is-new{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fb-meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.88rem}
.fb-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.fb-reply{background:var(--surface-2);border-radius:10px;padding:.55rem .75rem;font-size:.92rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.fb-reward{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:.7rem}
.fb-confirm{border-top:1px dashed var(--line);padding-top:.7rem}
.reward-pill{display:inline-flex;align-items:center;gap:.35em;font-weight:700;background:var(--coin-soft);padding:.2em .7em .2em .3em;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-tag{font-size:.72rem;font-weight:700;padding:.2em .55em;border-radius:6px;background:var(--surface-2)}
.cat-tag.idee{background:var(--brand-soft);color:var(--brand)}.cat-tag.fehler{background:var(--en-soft);color:var(--bad)}.cat-tag.lob{background:var(--la-soft);color:var(--good)}
.cat-dot{width:.6em;height:.6em;border-radius:50%;display:inline-block;background:var(--muted)}
.cat-dot.idee{background:var(--brand)}.cat-dot.fehler{background:var(--bad)}.cat-dot.lob{background:var(--good)}
/* settings */
.theme-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;max-width:520px}
.theme-opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.6rem;display:flex;flex-direction:column;gap:.5rem;align-items:center;cursor:pointer}
.theme-opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.swatch{width:100%;height:58px;border-radius:9px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 12px}
.swatch i{display:block;height:6px;border-radius:3px;width:70%;opacity:.85}
.changelog{display:flex;flex-direction:column;gap:.8rem}
.changelog ul{margin:.25rem 0 0;padding-left:1.2rem;color:var(--muted)}
/* learning mode */
.learnbar .topbar-in{flex-wrap:nowrap}
.learnbar .brand{cursor:default}
.mode-tag{font-size:.72rem;font-weight:700;padding:.25em .6em;border-radius:6px;background:var(--acc-soft);color:var(--ink)}
.learn-progress{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.learn-progress span{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.learn-progress .bar{margin:0;height:8px}
.learn-progress .bar i{background:var(--acc)}
.learn-main{max-width:760px}
@media (max-width:560px){.learnbar .brand span.word{display:none}.learnbar .coin-pill{display:none}}
.summary{display:flex;flex-direction:column;gap:1.2rem;align-items:center;text-align:center}
.summary .score{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;font-variant-numeric:tabular-nums}
.summary .stats{width:100%}
.wrong-list{width:100%;text-align:left}
/* sending */
.send-box{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:700px){.send-box{grid-template-columns:1fr}}
.send-box .panel{margin:0}
.user-pick{display:flex;flex-wrap:wrap;gap:.4rem}
.sent-row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:.6rem 0;border-bottom:1px solid var(--line)}
.sent-row:last-child{border-bottom:0}
/* admin activity */
.online{display:inline-flex;align-items:center;gap:.35em;font-weight:700;white-space:nowrap}
.online i{width:.6em;height:.6em;border-radius:50%;background:var(--line);display:inline-block}
.online.now i{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.online.now{color:var(--good)}
.spark{display:block}
.spark rect{fill:var(--brand)}
.spark rect.today{fill:var(--check)}
.spark rect.zero{fill:var(--line)}
.user-link{background:none;border:0;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.user-link:hover{text-decoration-color:var(--ink)}
tr.sel td{background:var(--brand-soft)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:520px;max-width:760px;width:100%;height:auto}
.chart-wrap text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart-wrap .v{fill:var(--ink);font-weight:700}
.chart-wrap .grid{stroke:var(--line);stroke-width:1}
.chart-wrap .b-ok{fill:var(--check)}
.chart-wrap .b-all{fill:var(--surface-2)}
/* shop layout */
.shop-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.2rem;align-items:start}
.shop-main{display:flex;flex-direction:column;gap:1.2rem;min-width:0}
.shop-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:.4rem;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.9rem .7rem}
.shop-side .eyebrow{padding:0 .5rem .2rem}
.shop-cat{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:.6rem .6rem;border-radius:12px;cursor:pointer;text-align:left}
.shop-cat:hover{background:var(--surface-2)}
.shop-cat[aria-current="true"]{background:var(--coin-soft);box-shadow:inset 3px 0 0 var(--coin)}
.shop-cat .ic{font-size:1.2rem;width:1.6rem;text-align:center}
.shop-cat .t{flex:1}
.shop-cat .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side-note{font-size:.78rem;color:var(--muted);padding:.4rem .5rem 0}
@media (max-width:720px){
  .shop-layout{grid-template-columns:1fr}
  .shop-side{position:static;flex-direction:row;flex-wrap:wrap;padding:.4rem;border-radius:14px}
  .shop-side .eyebrow,.side-note{display:none}
  .shop-cat{width:auto;flex:1;justify-content:center}
  .shop-cat[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--coin)}
}
.legend-card{position:relative;overflow:hidden;display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.2rem;align-items:center;padding:1.3rem;border-radius:22px;color:#fff8e1;
  background:radial-gradient(circle at 18% 40%,rgba(255,214,90,.35),transparent 55%),linear-gradient(135deg,#3a2600,#6b4500 55%,#2b1c00);border:2px solid #e6b422;box-shadow:0 10px 30px rgba(160,110,0,.35)}
.legend-card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,180,.18) 50%,transparent 65%);transform:translateX(-100%);animation:legShine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes legShine{60%,100%{transform:translateX(100%)}}
.legend-card.owned{border-color:var(--check)}
.legend-ava{display:grid;place-items:center;height:170px;border-radius:18px;background:radial-gradient(circle at 50% 60%,rgba(255,215,80,.4),transparent 70%)}
.legend-ava .dragon{width:200px;height:auto;filter:drop-shadow(0 0 10px rgba(255,200,40,.6))}
.legend-info{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.legend-info h3{font-size:1.35rem;color:#ffe27a;margin:0}
.legend-info p{font-size:.92rem;opacity:.9;margin:0}
.legend-info ul{margin:0;padding-left:1.1rem;font-size:.88rem;display:flex;flex-direction:column;gap:.2rem}
.legend-info .price{display:flex;align-items:center;gap:.35em;font-weight:700;font-size:1.25rem;color:#ffe27a}
.legend-info .ok{color:#8ff0b1}
.legend-tag{align-self:flex-start;font-size:.72rem;font-weight:700;padding:.25em .7em;border-radius:99px;color:#3a2600;background:linear-gradient(90deg,#fff1a8,#ffcf3a,#fff1a8);background-size:200% 100%;animation:tagShine 2.5s linear infinite}
@keyframes tagShine{to{background-position:-200% 0}}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#e6a512);border-color:#b07800;color:#3a2600}
.legend-card .btn:not(.primary):not(.gold){background:rgba(255,255,255,.12);border-color:rgba(255,230,150,.5);color:#fff8e1}
@media (max-width:640px){.legend-card{grid-template-columns:1fr}.legend-ava{height:130px}.legend-ava .dragon{width:160px}}
.own .e .dragon{width:38px;height:auto}
.own.legend{border-color:#e6b422}

/* Aurelius */
.pet.dragon-pet{width:126px;height:100px}
.dragon-pet .pet-body{position:relative;font-size:0;line-height:0;filter:drop-shadow(0 0 var(--glow,4px) rgba(255,196,30,var(--glowA,.4))) drop-shadow(0 4px 3px rgba(0,0,0,.18));transition:filter .6s}
.dragon-pet .dragon{width:126px;height:100px;overflow:visible;position:relative}
.dragon-pet .aura{position:absolute;left:50%;top:55%;width:190px;height:150px;margin:-75px 0 0 -95px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,215,70,.42),rgba(255,190,30,.12) 60%,transparent);opacity:0;pointer-events:none}
.dragon-pet.aura-on .aura{opacity:1;animation:aura 2.4s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.12);opacity:.7}}
.dragon-pet.flash .pet-body{filter:brightness(1.18) drop-shadow(0 0 16px rgba(255,215,60,.95))}
.dragon-pet.rush .pet-body{animation:rushGlow 1s ease-in-out infinite}
@keyframes rushGlow{50%{filter:brightness(1.3) drop-shadow(0 0 16px rgba(255,210,50,.95))}}
.dragon .dg-wing{transform-box:view-box;transform-origin:60px 48px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.dragon .dg-wb{transform:rotate(-10deg)}
.dragon .dg-wf{animation:wingIdle 2.6s ease-in-out infinite}
@keyframes wingIdle{50%{transform:rotate(-9deg)}}
.dragon.spread .dg-wf{animation:none;transform:rotate(14deg) scale(1.22)}
.dragon.spread .dg-wb{transform:rotate(-28deg) scale(1.18)}
.dragon .dg-leg{transform-box:fill-box;transform-origin:50% 0}
.striding .dg-l1,.striding .dg-l4{animation:stride .55s ease-in-out infinite}
.striding .dg-l2,.striding .dg-l3{animation:stride .55s ease-in-out infinite reverse}
@keyframes stride{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
.striding .dragon{animation:dstep .55s ease-in-out infinite}
@keyframes dstep{50%{transform:translateY(-2px)}}
.dragon .dg-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(.9,1) rotate(-4deg)}to{transform:scale(1.08,1.15) rotate(5deg)}}
.dragon .dg-shine{animation:dshine 3.2s ease-in-out infinite}
@keyframes dshine{0%{transform:translateX(-20px) skewX(-20deg)}55%,100%{transform:translateX(140px) skewX(-20deg)}}
.dragon .dg-glint{animation:glint 2.4s ease-in-out infinite}
@keyframes glint{50%{opacity:.5}}
.dragon .dg-head{transform-box:view-box;transform-origin:86px 38px}
.dragon.roar .dg-head{animation:roarHead .85s ease-in-out}
@keyframes roarHead{20%{transform:rotate(-14deg) scale(1.08)}40%{transform:rotate(-10deg) translateX(1px)}55%{transform:rotate(-15deg)}100%{transform:none}}
.pet-body.land{animation:land .45s ease-out}
@keyframes land{30%{transform:scaleY(.86) translateY(5px)}}
.gtrail{color:#ffd84f;font-size:12px;text-shadow:0 0 6px #ffcc33;animation:gtrail 1.2s ease-out forwards}
@keyframes gtrail{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px) scale(.4) rotate(90deg)}}
.gdust{width:4px;height:4px;border-radius:50%;background:#ffe27a;box-shadow:0 0 6px #ffc400;animation:gdust 1.3s ease-in forwards}
@keyframes gdust{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),40px) scale(.4)}}
.gspark{width:5px;height:5px;border-radius:50%;background:#fff6c2;box-shadow:0 0 8px 2px #ffcc33;animation:gspark 1.4s ease-in forwards}
@keyframes gspark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),70px) scale(.3)}}
.gcoin{font-size:16px;animation:gcoin 1.3s cubic-bezier(.3,.7,.6,1) forwards}
@keyframes gcoin{0%{transform:translate(0,0) scale(.6)}40%{transform:translate(calc(var(--dx)*.6),var(--up)) scale(1) rotateY(360deg)}100%{transform:translate(var(--dx),30px) rotateY(720deg);opacity:0}}
.gconf{position:fixed;top:-20px;border-radius:2px;pointer-events:none;z-index:96;animation:gconf 2.6s cubic-bezier(.25,.4,.6,1) forwards;box-shadow:0 0 4px rgba(255,200,40,.6)}
@keyframes gconf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--fall)) rotate(var(--r))}}
#petStage .gconf{position:absolute}

/* Goldrausch */
.rush-badge{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.82rem;padding:.3em .8em;border-radius:99px;background:var(--coin-soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.rush-badge::before{content:"🐉"}
.rush-badge.on{background:linear-gradient(90deg,#ffe27a,#f3b81f,#ffe27a);background-size:200% 100%;color:#3a2600;animation:tagShine 1.2s linear infinite;box-shadow:0 0 12px rgba(255,200,40,.7)}
.coin-pop.rush{font-weight:700;text-shadow:0 0 8px rgba(255,200,40,.6)}
@media (max-width:560px){.learnbar .rush-badge:not(.on){display:none}}

/* Lernserie */
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.stats.four{grid-template-columns:1fr 1fr}.stats.four .stat:last-child{grid-column:auto}}
.streak-stat .v{display:flex;align-items:center;gap:.25em}
.streak-stat .v svg{width:.95em;height:.95em}
.streak-stat.lit{background:linear-gradient(160deg,var(--fr-soft),var(--surface) 70%)}

@keyframes flameLive{50%{transform:scale(1.12) rotate(-4deg)}}
.streak-stat.risk .v svg{filter:grayscale(.6);opacity:.7}
.streak-stat.risk .l:last-child{color:var(--warn)}
.streak-stat.out .v svg{filter:grayscale(1);opacity:.4}
.streak-pop{position:fixed;left:50%;top:84px;z-index:95;display:flex;align-items:center;gap:.4em;padding:.55em 1.1em;border-radius:99px;background:var(--surface);border:2px solid var(--fr);font-weight:700;box-shadow:var(--shadow);transform:translateX(-50%);animation:spop 2.6s cubic-bezier(.3,1.5,.5,1) forwards;pointer-events:none}
.streak-pop svg{width:1.4em;height:1.4em}
.streak-pop b{font-family:var(--f-display);font-size:1.3rem}
@keyframes spop{0%{transform:translate(-50%,-30px) scale(.5);opacity:0}12%{transform:translate(-50%,0) scale(1);opacity:1}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}
.celebrate{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 45%,rgba(90,50,0,.45),rgba(8,10,18,.78) 75%);animation:celIn .3s ease-out;overflow:hidden;cursor:pointer}
.celebrate.big{background:radial-gradient(circle at 50% 40%,rgba(120,80,0,.55),rgba(10,8,0,.85))}
@keyframes celIn{from{opacity:0}}
.cel-card{position:relative;background:var(--surface);border-radius:26px;padding:1.6rem 1.6rem 1.3rem;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:.55rem;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:celCard .55s cubic-bezier(.3,1.5,.5,1);cursor:default}
.celebrate.big .cel-card{border:3px solid #e6b422;box-shadow:0 0 50px rgba(255,200,40,.55)}
@keyframes celCard{from{transform:scale(.6) translateY(30px);opacity:0}}
.cel-card h2{margin:0;font-size:1.5rem}
.cel-card .muted{margin:0}
.cel-burst{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-top:-.4rem}
.cel-burst .ring{position:absolute;inset:20px;border-radius:50%;border:4px solid var(--fr);opacity:0;animation:ring 1.3s .2s ease-out}
.cel-burst .ring.r2{animation-delay:.55s}
.celebrate.big .cel-burst .ring{border-color:#ffd84f;animation-iteration-count:infinite;animation-duration:1.8s}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.cel-burst .rays{position:absolute;inset:0;animation:rays 8s linear infinite}
.cel-burst .rays i{position:absolute;left:50%;top:50%;width:4px;height:22px;margin:-11px 0 0 -2px;border-radius:4px;background:var(--fr);transform:rotate(var(--a)) translateY(-64px) scaleY(0);animation:ray .7s .25s cubic-bezier(.3,1.6,.5,1) forwards}
.celebrate.big .cel-burst .rays i{background:#ffd84f;box-shadow:0 0 8px #ffcc33}
@keyframes ray{to{transform:rotate(var(--a)) translateY(-64px) scaleY(1)}}
@keyframes rays{to{transform:rotate(360deg)}}
.cel-flame{width:84px;height:105px;position:relative;z-index:1;transform-origin:50% 100%;animation:ignite .9s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 0 16px rgba(255,140,0,.55))}
.celebrate.first .cel-flame{animation:igniteSlow 1.6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes ignite{from{transform:scale(0)}}
@keyframes igniteSlow{0%{transform:scale(0)}35%{transform:scale(.18)}50%{transform:scale(.15)}100%{transform:scale(1)}}
.flame.gold{--f1:#e8a50c;--f2:#ffd23f;--f3:#fff6cf}
.cel-flame.gold{filter:drop-shadow(0 0 18px rgba(255,210,60,.9))}
.cel-num{position:absolute;z-index:2;bottom:22px;font-family:var(--f-display);font-weight:700;font-size:1.9rem;color:#fff;text-shadow:0 2px 0 rgba(120,50,0,.6),0 0 10px rgba(255,120,0,.7);font-variant-numeric:tabular-nums;animation:pop .5s .6s both}
.celebrate.big .cel-num{font-size:2.2rem}
.week-dots{display:flex;gap:.4rem;margin:.2rem 0}
.week-dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fr);color:#fff;font-weight:700;font-size:.9rem;transform:scale(0);animation:dot .4s calc(.5s + var(--i)*.12s) cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes dot{to{transform:scale(1)}}
.cel-reward{display:flex;align-items:center;gap:.3em;font-family:var(--f-display);font-weight:700;font-size:2.2rem;color:var(--coin);animation:pop .6s 1.4s both}
.cel-hint{font-size:.78rem;color:var(--muted);margin:0}
.fw{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;box-shadow:0 0 8px currentColor;animation:fw 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 40px)) scale(.3);opacity:0}}


/* ---------- Design 1.2.4: modern, futuristisch, minimalistisch ---------- */
html{-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.5;letter-spacing:-.011em;
  background:radial-gradient(1100px 520px at 50% -260px,color-mix(in srgb,var(--brand) 9%,transparent),transparent 70%) no-repeat,var(--bg)}
h1,h2,h3{font-weight:650;letter-spacing:-.028em}
h1{font-size:clamp(2rem,5vw,2.9rem);line-height:1.06;font-weight:700;letter-spacing:-.04em}
h2{font-size:1.3rem}
h3{font-size:1.06rem;letter-spacing:-.02em}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:-.005em}
.muted{color:var(--muted)}
:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 35%,transparent);border-radius:12px}

/* buttons: pills with a soft vertical sheen */
.btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:980px;font-weight:550;padding:.62em 1.2em;
  transition:transform .25s var(--ease),background .25s var(--ease),filter .25s var(--ease),box-shadow .25s var(--ease)}
.btn:hover{border-color:transparent;background:color-mix(in srgb,var(--ink) 10%,var(--surface))}
.btn:active{transform:scale(.97)}
.btn.primary,.btn.primary:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--on-acc);box-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 16px -6px color-mix(in srgb,var(--acc) 60%,transparent)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 24px -8px color-mix(in srgb,var(--acc) 70%,transparent)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.danger:hover{background:var(--en-soft)}
.btn.danger.solid,.btn.danger.solid:hover{background:var(--bad);color:#fff;box-shadow:none}
.btn.small{padding:.42em .95em;font-size:.88rem;border-radius:980px}
.btn.big{padding:.85em 1.6em;font-size:1.04rem;border-radius:980px}
.btn[disabled]{opacity:.4;transform:none}
.btn.gold,.btn.gold:hover{background:linear-gradient(180deg,#ffe58a,#e8a90f);color:#3a2600}

/* inputs: filled, focus lifts to white with a soft ring */
.field label{font-weight:550;font-size:.86rem;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid transparent;background:var(--surface-2);border-radius:var(--r-md);padding:.72em .95em;transition:background .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease)}
.input:hover{border-color:transparent;background:color-mix(in srgb,var(--ink) 6%,var(--surface-2))}
.input:focus{background:var(--surface);border-color:color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
.input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}

/* glass top bar */
.topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.topbar-in{padding:.6rem 20px}
.brand{font-weight:650;font-size:1.18rem;letter-spacing:-.03em;color:var(--ink)}
.brand svg{width:34px;height:28px}
.nav{gap:.15rem}
.nav button{font-weight:500;font-size:.93rem;border-radius:980px;padding:.42em .9em;color:var(--muted);transition:color .2s var(--ease),background .2s var(--ease)}
.nav button:hover{background:transparent;color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.nav button[aria-current="page"]::after{display:none}
.coin-pill{font-weight:600;background:var(--surface);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);transition:transform .3s var(--ease)}
.coin-pill.bump{animation:pillBump .5s var(--ease)}
@keyframes pillBump{35%{transform:scale(1.12)}}
.user-chip{font-weight:500}

/* ---------- storage: cloud db when available, else this browser ---------- */
const Store = {
  db: null, auth: null, cloud: false, chains: {}, err: null,
  async init() {
    try {
      if (!window.firebase) throw new Error("sdk");
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      if (window.VOCABIFY_EMULATOR) { this.db.useEmulator("127.0.0.1", 8080); this.auth.useEmulator("http://127.0.0.1:9099"); }
      await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      this.cloud = true;
    } catch (e) { this.cloud = false; this.err = e; }
  },
  ref(c, id) { return this.db.collection(c).doc(id); },
  _chain(key, fn) {
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(fn);
    this.chains[key] = p;
    return p;
  },
  async get(c, id) { const s = await this.ref(c, id).get(); return s.exists ? s.data() : null; },
  set(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).set(clone(data))); },
  update(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).update(clone(data))); },
  del(c, id) { return this._chain(c + "/" + id, () => this.ref(c, id).delete()); },
  async list(c, field, value) {
    let q = this.db.collection(c);
    if (field) q = q.where(field, "==", value);
    const snap = await q.limit(1000).get();
    return snap.docs.map(d => Object.assign(d.data(), { id: d.id }));
  },
  batch(ops) {
    const b = this.db.batch();
    for (const [type, c, id, data] of ops) {
      if (type === "set") b.set(this.ref(c, id), clone(data));
      else if (type === "update") b.update(this.ref(c, id), clone(data));
      else b.delete(this.ref(c, id));
    }
    return b.commit();
  }
};

function bumpHist(correct) {
  const d = todayKey();
  const h = Array.isArray(S.me.hist) ? S.me.hist : (S.me.hist = []);
  let e = h.find(x => x.d === d);
  if (!e) { e = { d, c: 0, a: 0 }; h.push(e); }
  e.a++; if (correct) e.c++;
  h.sort((x, y) => x.d < y.d ? -1 : 1);
  while (h.length > 60) h.shift();
  S.me.totalAnswered = (S.me.totalAnswered || 0) + 1;
  S.me.lastSeen = Date.now();
}
function histDays(acc, n) {
  const map = {}; (Array.isArray(acc.hist) ? acc.hist : []).forEach(e => { map[e.d] = e; });
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(); dt.setHours(12, 0, 0, 0); dt.setDate(dt.getDate() - i);
    const k = todayKey(dt); const e = map[k] || {};
    out.push({ d: k, date: dt, c: +e.c || 0, a: +e.a || 0 });
  }
  return out;
}
function lastSeenText(ts) {
  if (!ts) return { t: "noch nie", now: false };
  const diff = Date.now() - ts;
  if (diff < 3 * 60000) return { t: "online", now: true };
  if (diff < 60 * 60000) return { t: "vor " + Math.round(diff / 60000) + " Min.", now: false };
  const d = new Date(ts), today = todayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (todayKey(d) === today) return { t: "heute, " + time, now: false };
  if (todayKey(d) === todayKey(y)) return { t: "gestern, " + time, now: false };
  const days = Math.floor(diff / 86400000);
  return { t: days < 7 ? "vor " + days + " Tagen" : d.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" }), now: false };
}

function syncCoins() { document.querySelectorAll(".coin-pill .num").forEach(e => { e.textContent = coinsTotal(); }); }
function coinTarget() {
  const pills = [...document.querySelectorAll(".coin-pill")].filter(p => p.offsetParent !== null && p.getBoundingClientRect().top < 140);
  return pills[0] || null;
}
function flyCoins(from, n, done) {
  const pill = coinTarget();
  if (!from || !from.getBoundingClientRect || matchMedia("(prefers-reduced-motion: reduce)").matches || !Element.prototype.animate) { done && done(); return; }
  const a = from.getBoundingClientRect();
  const tc = pill && pill.querySelector(".coin");
  const b = tc ? tc.getBoundingClientRect() : { left: innerWidth - 44, top: 14, width: 22, height: 22 };
  const k = Math.max(1, Math.min(n, 7));
  let arrived = 0;
  for (let i = 0; i < k; i++) {
    const c = document.createElement("i"); c.className = "coin fly-coin"; document.body.append(c);
    const x0 = a.left + a.width / 2 - 11 + (k > 1 ? Math.random() * 24 - 12 : 0), y0 = a.top + a.height / 2 - 11;
    const x1 = b.left + b.width / 2 - 11, y1 = b.top + b.height / 2 - 11;
    const mx = x0 + (x1 - x0) * .35 + (Math.random() * 70 - 35), my = Math.max(30, y0 + (y1 - y0) * .55 - 30 - Math.random() * 30);
    const an = c.animate([
      { transform: `translate(${x0}px,${y0}px) scale(.3) rotateY(0deg)`, opacity: 0 },
      { transform: `translate(${x0}px,${y0 - 30}px) scale(1.2) rotateY(200deg)`, opacity: 1, offset: .2 },
      { transform: `translate(${mx}px,${my}px) scale(1) rotateY(560deg)`, opacity: 1, offset: .58 },
      { transform: `translate(${x1}px,${y1}px) scale(.75) rotateY(900deg)`, opacity: .95 }
    ], { duration: 950 + i * 50, delay: i * 85, easing: "cubic-bezier(.45,0,.2,1)", fill: "forwards" });
    an.onfinish = () => {
      c.remove();
      if (pill && pill.isConnected) { pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump"); }
      if (++arrived === k) done && done();
    };
  }
}

function authErrorText(e) {
  const c = e && e.code || "";
  if (c.includes("too-many-requests")) return "Zu viele Versuche. Warte ein paar Minuten und versuche es dann noch einmal.";
  if (c.includes("network")) return "Keine Internetverbindung. Prüfe dein WLAN oder deine mobilen Daten.";
  if (c.includes("wrong-password") || c.includes("invalid-credential") || c.includes("user-not-found") || c.includes("invalid-login")) return "Benutzername oder Passwort stimmt nicht.";
  return "Anmeldung gerade nicht möglich. Versuche es gleich noch einmal.";
}
async function doLogin(form) {
  const u = form.username.value.trim().toLowerCase();
  const p = form.password.value;
  S.loginErr = "";
  try {
    const login = u && validUsername(u) ? await Store.get(C.logins, u) : null;
    if (!login || !login.email) { S.loginErr = "Benutzername oder Passwort stimmt nicht."; render(); return; }
    const cred = await Store.auth.signInWithEmailAndPassword(login.email, p);
    const acc = await accountForUser(cred.user);
    if (!acc) { await Store.auth.signOut(); S.loginErr = "Dieses Konto wurde deaktiviert. Frag deinen Admin."; render(); return; }
    await enterApp(acc);
  } catch (e) { S.loginErr = authErrorText(e); render(); }
}
function validUsername(u) { return /^[a-z0-9._-]{3,24}$/.test(u); }
function newEmail(u) { return u + "." + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + "@" + EMAIL_DOMAIN; }
function accountDoc(username, role, userId) {
  return { username, role, uid: userId, coins: 0, pets: [], activePet: null, daily: freshDaily(), totalCorrect: 0, totalAnswered: 0,
    hist: [], settings: {}, lastSeen: 0, createdAt: Date.now() };
}
let secondaryAuth = null;
/* creates a login without signing the admin out (second Firebase instance) */
async function createAuthUser(email, password) {
  if (!secondaryAuth) {
    const app = firebase.apps.find(a => a.name === "secondary") || firebase.initializeApp(FIREBASE_CONFIG, "secondary");
    secondaryAuth = app.auth();
    if (window.VOCABIFY_EMULATOR) secondaryAuth.useEmulator("http://127.0.0.1:9099");
    await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);

  const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);

  const acc = accountDoc(username, role, newUid);
  await Store.batch([["set", C.roles, newUid, { username, role }], ["set", C.logins, username, { email }], ["set", C.acc, username, acc]]);

/* ---------- vocabulary helpers ---------- */
function allVocab(secIds) {
  const out = [];
  for (const s of S.sections) {
    if (secIds && secIds.length && !secIds.includes(s.id)) continue;
    for (const v of s.vocab || []) out.push({ s, v });
  }
  return out;
}
/* selected sections, or every section of the chosen language */
function effSecs(secs, lang) {
  if (secs && secs.length) return secs;
  if (!lang) return null;
  const ids = S.sections.filter(s => s.lang === lang).map(s => s.id);
  return ids.length ? ids : ["-"];
}
function usedLangs() { return Object.keys(LANGS).filter(l => S.sections.some(s => s.lang === l)); }
function langPicker(act, cur) {
  const langs = usedLangs();
  if (langs.length < 2 && !cur) return "";
  return `<div class="chips" role="group" aria-label="Sprache">
    <button class="chip" data-act="${act}" data-k="" aria-pressed="${!cur}">Alle Sprachen</button>
    ${langs.map(l => { const n = S.sections.filter(s => s.lang === l).length;
      return `<button class="chip" data-act="${act}" data-k="${l}" aria-pressed="${cur === l}"><span class="lang-dot ${l}"></span>${LANGS[l].name}<span class="muted num" style="font-weight:600">${n}</span></button>`; }).join("")}
  </div>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function poolFor(mode, secIds) {
  let items = allVocab(secIds);
  if (mode === "older") items = items.filter(x => (x.v.r || 0) + (x.v.w || 0) >= 3);
  if (mode === "errors") items = items.filter(x => (x.v.w || 0) > 0 && x.v.w / ((x.v.r || 0) + x.v.w) >= 0.3)
    .sort((a, b) => b.v.w / (b.v.r + b.v.w) - a.v.w / (a.v.r + a.v.w));
  if (mode === "newest") items = items.sort((a, b) => (b.v.added || 0) - (a.v.added || 0)).slice(0, 20);
  return items;
}
const MACRON = { "ā": "a", "ē": "e", "ī": "i", "ō": "o", "ū": "u", "ȳ": "y" };
function norm(s) {
  return String(s || "").toLowerCase().normalize("NFC").replace(/[āēīōūȳ]/g, m => MACRON[m])
    .replace(/\([^)]*\)|\[[^\]]*\]/g, " ")
    .replace(/[.!?¿¡"„“”'’`´…]/g, " ").replace(/\s+/g, " ").trim();
}
const ARTICLE_RE = /^(the|to|a|an|der|die|das|den|dem|ein|eine|einen|sich|le|la|les|l|un|une|des|se|s)\s+/;
function stripArt(s) { let p; do { p = s; s = s.replace(ARTICLE_RE, ""); } while (s !== p); return s; }
/* Grammatikangaben, die man beim Lernen nicht mittippen muss */
const GRAMMAR_RE = /(^|\s)(adv|adj|präp|konj|subj|subst|pron|interj|part|pl|sg|akk|abl|dat|gen|nom|vok|m|f|n|mask|fem|neutr|indekl|inf|perf|ppp|sb|sth|qc|qn|jdn|jdm|jds|etw|jmd)\.?(?=\s|$|,)/gi;
function variants(sol) {
  const raw = String(sol || "");
  /* (ein)schätzen -> "einschätzen" und "schätzen"; immō (vērō) -> "immo vero" und "immo" */
  const withParen = raw.replace(/\(([^)]*)\)/g, "$1");
  const noParen = raw.replace(/\([^)]*\)/g, " ");
  const out = new Set();
  for (const base of [noParen, withParen]) {
    for (const part of base.split(/[,;\/]|\s+oder\s+|\s+or\s+|\s+ou\s+/i).concat([base])) {
      const v = norm(part); if (!v) continue;
      out.add(v);
      const bare = norm(part.replace(GRAMMAR_RE, " "));
      if (bare && bare.length >= 2) out.add(bare);
    }
  }
  return [...out];
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function checkAnswer(given, sol) {
  const g = norm(given);
  if (!g) return { ok: false };
  const vs = variants(sol);
  for (const v of vs) if (g === v || stripArt(g) === stripArt(v)) return { ok: true };
  const plain = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
  for (const v of vs) if (plain(stripArt(g)) === plain(stripArt(v))) return { ok: true, typo: true };
  for (const v of vs) { const sv = stripArt(v); if (sv.length >= 6 && lev(stripArt(g), sv) <= 1) return { ok: true, typo: true }; }
  return { ok: false };
}

/* ---------- learning ---------- */
function newRound(extra) {
  return Object.assign({ mode: S.cfg.mode, dir: S.cfg.dir, secs: effSecs(S.cfg.secs, S.cfg.lang), size: S.cfg.size, n: 0, right: 0, cur: null, state: "ask", last: null,
    coin: false, typo: false, coinsEarned: 0, wrongs: [], finished: false, startedAt: Date.now(), queue: null, retry: false }, extra || {});
}
function repeatWrongs() {
  const prev = S.learn; if (!prev) return;
  const q = shuffle(prev.wrongs.filter(w => { const s = S.sections.find(x => x.id === w.sid); return s && s.vocab.some(v => v.id === w.vid); }).map(w => ({ sid: w.sid, vid: w.vid })));
  if (!q.length) { toast("Keine falschen Vokabeln zum Wiederholen."); return; }
  S.learn = newRound({ mode: prev.mode, dir: prev.dir, secs: prev.secs, size: q.length, queue: q, retry: true });
  window.scrollTo({ top: 0 });
  nextQuestion();
}
function startLearning() {
  const pool = poolFor(S.cfg.mode, effSecs(S.cfg.secs, S.cfg.lang));
  if (!pool.length) { toast("Für diesen Modus gibt es noch keine passenden Vokabeln."); return; }
  S.learn = newRound();
  window.scrollTo({ top: 0 });
  nextQuestion();
}
function nextQuestion() {
  const L = S.learn; if (!L || L.finished) return;
  clearTimeout(L.timer);
  if (L.size && L.n >= L.size) { finishLearning(); return; }
  if (L.queue) {
    let item = null;
    while (L.queue.length && !item) {
      const q = L.queue.shift(); const s = S.sections.find(x => x.id === q.sid); const v = s && s.vocab.find(x => x.id === q.vid);
      if (v) item = { s, v };
    }
    if (!item) { finishLearning(); return; }
    const dir = L.dir === "mix" ? (Math.random() < .5 ? "f2d" : "d2f") : L.dir;
    L.cur = { sid: item.s.id, vid: item.v.id, dir };
    L.state = "ask"; L.given = ""; L.coin = false; L.typo = false; L.last = item.v.id;
    render(); return;
  }
  const pool = poolFor(L.mode, L.secs);
  if (!pool.length) { finishLearning(); return; }
  let cands = pool.length > 1 ? pool.filter(x => x.v.id !== L.last) : pool;
  if (L.mode === "errors") cands = cands.slice(0, Math.max(5, Math.ceil(cands.length / 2)));
  const pick = cands[Math.floor(Math.random() * cands.length)];
  const dir = L.dir === "mix" ? (Math.random() < .5 ? "f2d" : "d2f") : L.dir;
  L.cur = { sid: pick.s.id, vid: pick.v.id, dir };
  L.state = "ask"; L.given = ""; L.coin = false; L.typo = false; L.last = pick.v.id;
  render();
}
function finishLearning() {
  const L = S.learn; if (!L) return;
  clearTimeout(L.timer);
  if (!L.n) { S.learn = null; render(); return; }
  L.finished = true; L.cur = null;
  flush(); render(); window.scrollTo({ top: 0 });
}
function leaveLearning() {
  const L = S.learn; if (L) clearTimeout(L.timer);
  S.learn = null; flush(); render(); window.scrollTo({ top: 0 });
}
function curItem() {
  const L = S.learn; if (!L || !L.cur) return null;
  const s = S.sections.find(x => x.id === L.cur.sid); if (!s) return null;
  const v = (s.vocab || []).find(x => x.id === L.cur.vid); if (!v) return null;
  return { s, v };
}
function registerCorrect(s, v) {
  ensureDay();
  const L = S.learn, d = S.me.daily;
  d.count++; S.me.totalCorrect = (S.me.totalCorrect || 0) + 1;
  const key = s.id + ":" + v.id;
  L.coin = false;
  L.coinAmt = 0;
  if (!d.coined.includes(key)) {
    const amt = rushActive() ? 2 : 1;
    d.coined.push(key); S.me.coins = (S.me.coins || 0) + amt; L.coin = true; L.coinAmt = amt; L.coinsEarned += amt;
  }
  bumpStreak();
  L.right++;
  L.wrongs = L.wrongs.filter(x => x.vid !== v.id || x.counted);
  Pets.onCorrect(L.right);
  if (d.count === getGoal()) setTimeout(() => toast("Tagesziel erreicht! " + getGoal() + " Vokabeln heute."), 600);
  const reached = MILESTONES.find(m => d.count === m);
  if (reached) setTimeout(() => toast("Truhe bei " + reached + " Vokabeln freigeschaltet! Öffne sie im Lernpfad."), 300);
  markDirty("me");
}
function submitAnswer(val) {
  const L = S.learn, it = curItem(); if (!L || !it) return;
  const { s, v } = it;
  const sol = L.cur.dir === "f2d" ? v.d : v.f;
  const res = checkAnswer(val, sol);
  L.given = val; L.n++; v.lastSeen = Date.now();
  bumpHist(res.ok);
  if (res.ok) {
    v.r = (v.r || 0) + 1; L.state = "right"; L.typo = !!res.typo;
    registerCorrect(s, v);
    clearTimeout(L.timer);
    if (!res.typo) L.timer = setTimeout(() => { if (S.learn === L && L.state === "right") nextQuestion(); }, 1100);
  } else {
    v.w = (v.w || 0) + 1; L.state = "wrong";
    if (!L.wrongs.some(x => x.vid === v.id)) L.wrongs.push({ sid: s.id, vid: v.id });
  }
  markDirty("sec:" + s.id);
  render();
  if (res.ok && L.coin) {
    const amt = L.coinAmt || 1, nums = [...document.querySelectorAll(".coin-pill .num")];
    nums.forEach(e => { e.textContent = coinsTotal() - amt; });
    flyCoins($(".coin-pop .coin"), amt, syncCoins);
  }
  if (!res.ok) { const q = $(".quiz"); if (q) { q.classList.add("shake"); setTimeout(() => q.classList.remove("shake"), 400); } }
}
function overrideCorrect() {
  const L = S.learn, it = curItem(); if (!L || !it || L.state !== "wrong") return;
  it.v.w = Math.max(0, (it.v.w || 1) - 1); it.v.r = (it.v.r || 0) + 1;
  L.state = "right"; L.typo = false;
  const he = (S.me.hist || []).find(x => x.d === todayKey()); if (he) he.c++;
  L.wrongs = L.wrongs.filter(x => x.vid !== it.v.id);
  registerCorrect(it.s, it.v);
  markDirty("sec:" + it.s.id);
  render();
  L.timer = setTimeout(() => { if (S.learn === L && L.state === "right") nextQuestion(); }, 900);
}
function openChest(m) {
  ensureDay();
  const d = S.me.daily;
  if (d.count < m || d.chests.some(c => c.t === m)) return;
  const r = Math.random();
  const amt = r < .5 ? 10 : r < .9 ? 20 : 50;
  d.chests.push({ t: m, amt });
  S.me.coins = (S.me.coins || 0) + amt;
  markDirty("me"); flush();
  render();
  openModal(`<div class="big-chest">${CHEST_SVG}</div>
    <h2>Truhe ${MILESTONES.indexOf(m) + 1} geöffnet</h2>
    <div class="reward">${COIN}+${amt}</div>
    <p class="muted">${amt === 50 ? "Jackpot! Das war die seltene 50er-Truhe." : "Weiter so, morgen wartet ein neuer Lernpfad."}</p>
    <button class="btn primary" data-act="collect">Einsammeln</button>`);
  document.querySelectorAll(".coin-pill .num").forEach(e => { e.textContent = coinsTotal() - amt; });
}

/* ---------- rendering ---------- */
function setLang() {
  let lang = "";
  if (S.view === "home" && S.learn) { const it = curItem(); if (it) lang = it.s.lang; }
  if (S.view === "home" && !S.learn && S.cfg.lang) lang = S.cfg.lang;
  if (S.view === "vocab" && !S.openSection && S.vocabTab === "stats" && S.statsLang) lang = S.statsLang;
  if (S.view === "vocab" && S.openSection) { const s = S.sections.find(x => x.id === S.openSection); if (s) lang = s.lang; }
  if (lang) document.body.dataset.lang = lang; else delete document.body.dataset.lang;
}
function render() {
  const app = $("#app");
  Intro.done();
  if (!S.me) {
    delete document.body.dataset.lang;
    app.innerHTML = loginView();
    Pets.setVisible(false);
    return;
  }
  setLang();
  const active = document.activeElement;
  const keepId = active && active.id;

  const goal = getGoal();
  const dateStr = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  const gr = greeting();
  return `<section class="hello">
      <div style="min-width:0"><p class="eyebrow">${esc(dateStr)}</p><h1>${esc(gr.title)}</h1><p class="sub">${esc(gr.sub)}</p></div>
      ${rushBadge()}
    </section>
    <section class="stats four">
      <div class="stat"><span class="l">Heute gelernt</span><span class="v">${c}</span><span class="l">richtige Vokabeln</span></div>
      <div class="stat"><span class="l">Tagesziel</span><span class="v">${Math.min(c, goal)}<span class="muted" style="font-size:1rem"> / ${goal}</span></span><div class="bar"><i style="width:${Math.min(100, c / goal * 100)}%"></i></div></div>
      ${streakStat()}
      <div class="stat"><span class="l">Münzen</span><span class="v" style="display:flex;align-items:center;gap:.3em">${COIN}${coinsTotal()}</span><span class="l">max. 1 Münze pro Vokabel und Tag</span></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Dein Lernpfad</h2><span class="muted" style="font-size:.88rem">Setzt sich um 00:00 Uhr zurück</span></div>
      ${pathView(c)}
    </section>
    <section class="card">${S.learn ? quizView() : configView()}</section>`;
}
function pathView(c) {
  const pct = v => Math.min(100, v) + "%";
  const chests = MILESTONES.map((m, i) => {
    const opened = S.me.daily.chests.find(x => x.t === m);
    const cls = opened ? "open" : c >= m ? "ready" : "locked";
    const label = opened ? `<b>+${opened.amt}</b> erhalten` : c >= m ? "Antippen!" : `${m} Vokabeln`;
    return `<div class="milestone" style="left:${pct(m)}">
      <button class="chest ${cls}" ${cls === "ready" ? `data-act="chest" data-m="${m}" aria-label="Truhe ${i + 1} öffnen"` : `aria-label="Truhe ${i + 1}: ${opened ? "geöffnet" : "gesperrt"}" tabindex="-1"`}>${CHEST_SVG}</button>
      <span class="ms-label">${label}</span></div>`;
  }).join("");
  return `<div class="path"><div class="path-inner">
    <div class="track"></div><div class="track-fill" style="width:${pct(c)}"></div>
    <span class="marker" style="left:${pct(c)}">${c}</span>
    ${chests}
  </div></div>
  <p class="muted" style="font-size:.85rem">Truhen enthalten 10 Münzen (50 %), 20 Münzen (40 %) oder 50 Münzen (10 %).</p>`;
}
function configView() {
  if (!S.sections.length) {
    return `<div class="empty"><strong>Noch keine Vokabeln</strong><p>Lege unter „Vokabeln“ deinen ersten Abschnitt an, tippe Wörter ein oder scanne ein Vokabelblatt.</p>
      <button class="btn primary" data-act="nav" data-v="vocab">Ersten Abschnitt anlegen</button></div>`;
  }
  if (S.cfg.lang && !S.sections.some(s => s.lang === S.cfg.lang)) S.cfg.lang = "";
  const shown = S.sections.filter(s => !S.cfg.lang || s.lang === S.cfg.lang);
  S.cfg.secs = S.cfg.secs.filter(id => shown.some(s => s.id === id));
  const scope = effSecs(S.cfg.secs, S.cfg.lang);
  const allOn = !S.cfg.secs.length;
  const lp = langPicker("cfgLang", S.cfg.lang);
  const chips = `<button class="chip" data-act="cfgSec" data-id="" aria-pressed="${allOn}">Alle Abschnitte${S.cfg.lang ? " (" + LANGS[S.cfg.lang].name + ")" : ""}</button>` +
    shown.map(s => `<button class="chip" data-act="cfgSec" data-id="${s.id}" aria-pressed="${S.cfg.secs.includes(s.id)}"><span class="lang-dot ${s.lang}"></span>${esc(s.name)}</button>`).join("");
  const dirs = [["f2d", "Fremdsprache → Deutsch"], ["d2f", "Deutsch → Fremdsprache"], ["mix", "Gemischt"]]
    .map(([k, l]) => `<button data-act="cfgDir" data-k="${k}" aria-pressed="${S.cfg.dir === k}">${l}</button>`).join("");
  const modes = Object.entries(MODES).map(([k, m]) => {
    const n = poolFor(k, scope).length;
    return `<button class="mode" data-act="cfgMode" data-k="${k}" aria-pressed="${S.cfg.mode === k}"><b>${m.name}</b><span>${m.desc}</span><em>${n} Vokabel${n === 1 ? "" : "n"}</em></button>`;
  }).join("");
  const n = poolFor(S.cfg.mode, scope).length;
  return `<div class="cfg">
    <div class="card-head" style="margin:0"><h2>Lernen</h2></div>
    ${lp ? `<div class="cfg-group"><span class="eyebrow">Sprache</span>${lp}</div>` : ""}
    <div class="cfg-group"><span class="eyebrow">Abschnitte</span><div class="chips">${chips}</div></div>
    <div class="cfg-group"><span class="eyebrow">Richtung</span><div class="seg">${dirs}</div></div>
    <div class="cfg-group"><span class="eyebrow">Lernmodus</span><div class="modes">${modes}</div></div>
    <div class="cfg-group"><span class="eyebrow">Rundenlänge</span><div class="seg">${[[10, "10 Fragen"], [20, "20 Fragen"], [30, "30 Fragen"], [0, "Endlos"]]
      .map(([k, l]) => `<button data-act="cfgSize" data-k="${k}" aria-pressed="${S.cfg.size === k}">${l}</button>`).join("")}</div></div>
    <div class="row"><button class="btn primary big" data-act="start" ${n ? "" : "disabled"}>Lernen starten →</button>
      <span class="muted">${n ? n + " Vokabeln im Pool" : "Keine passenden Vokabeln für diesen Modus"}</span></div>
  </div>`;
}
function quizView() {
  const L = S.learn, it = curItem();
  if (!it) return `<div class="empty"><strong>Diese Vokabel gibt es nicht mehr.</strong><button class="btn" data-act="next">Weiter</button></div>`;
  const { s, v } = it;
  const f2d = L.cur.dir === "f2d";
  const prompt = f2d ? v.f : v.d;
  const sol = f2d ? v.d : v.f;
  const target = f2d ? "Deutsche" : LANGS[s.lang].name.replace(/isch$/, "ische");
  let fb = "";
  if (L.state === "right") {
    fb = `<div class="fb right" role="status">Richtig!${L.typo ? ` <span>Fast perfekt, achte auf die Schreibweise: <span class="sol">${esc(sol)}</span></span>` : ""}
      ${L.coin ? `<span class="coin-pop${L.coinAmt > 1 ? " rush" : ""}">${COIN}+${L.coinAmt || 1}${L.coinAmt > 1 ? " Goldrausch!" : ""}</span>` : `<span class="muted" style="font-weight:600">Heute schon belohnt</span>`}
      ${L.typo ? `<span class="spacer"></span><button class="btn small" id="nextBtn" data-act="next">Weiter</button>` : ""}</div>`;
  } else if (L.state === "wrong") {
    fb = `<div class="fb wrong" role="status"><span>Leider falsch. Richtig ist: <span class="sol">${esc(sol)}</span></span><span class="spacer"></span>
      <button class="btn small" data-act="override">Ich hatte recht</button>
      <button class="btn small primary" id="nextBtn" data-act="next">Weiter</button></div>`;
  }
  return `<div class="quiz">
    <div class="row">
      <span class="lang-tag ${s.lang}">${LANGS[s.lang].name}</span>
      <span class="muted" style="font-weight:700;font-size:.9rem">${esc(s.name)} · ${L.retry ? "Fehler wiederholen" : MODES[L.mode].name}</span>
      <span class="spacer"></span>
      <span class="num muted" style="font-weight:700">${L.right} / ${L.n} richtig</span>
    </div>
    <div><p class="eyebrow">Übersetze ins ${esc(target)}</p><div class="quiz-word">${esc(prompt)}</div></div>
    <form data-form="answer" autocomplete="off">
      <input class="input" id="answer" name="a" placeholder="Deine Antwort" autocapitalize="none" spellcheck="false" ${L.state !== "ask" ? `value="${esc(L.given)}" readonly` : ""} aria-label="Antwort">
      ${L.state === "ask" ? `<button class="btn primary big" type="submit">Prüfen</button>` : ""}
    </form>
    ${fb}
    <p class="muted" style="font-size:.85rem">Bisher bei dieser Vokabel: <span class="ok">${v.r || 0} richtig</span> · <span class="no">${v.w || 0} falsch</span>. Mehrere Lösungen trennst du in der Liste mit Komma.</p>
  </div>`;
}

/* vocab */
function vocabView() {
  const tabs = [["sections", "Abschnitte"], ["stats", "Erfolge"], ["invites", "Einladungen" + (S.invites.length ? ` <span class="badge">${S.invites.length}</span>` : "")]]
    .map(([k, l]) => `<button role="tab" data-act="vtab" data-k="${k}" aria-selected="${S.vocabTab === k}">${l}</button>`).join("");
  let body = "";
  if (S.vocabTab === "stats") body = statsView();
  else if (S.vocabTab === "invites") body = invitesView();
  else body = S.openSection ? sectionDetail() : sectionsGrid();
  return `<h1>Vokabeln</h1><div class="tabs" role="tablist">${tabs}</div>${body}`;
}
function sectionsGrid() {
  if (S.secLang && !S.sections.some(s => s.lang === S.secLang)) S.secLang = "";
  const lpSec = langPicker("secLang", S.secLang);
  const cards = S.sections.filter(s => !S.secLang || s.lang === S.secLang).map(s => {
    const n = (s.vocab || []).length;
    const r = (s.vocab || []).reduce((a, v) => a + (v.r || 0), 0), w = (s.vocab || []).reduce((a, v) => a + (v.w || 0), 0);
    return `<button class="sec-card" data-act="openSec" data-id="${s.id}">
      <span class="lang-tag ${s.lang}">${LANGS[s.lang].name}</span>
      <h3>${esc(s.name)}</h3>
      <div class="meta"><span class="num">${n} Vokabel${n === 1 ? "" : "n"}</span><span class="num"><span class="ok">${r}</span> / <span class="no">${w}</span></span></div>
    </button>`;
  }).join("");
  return `<section class="card">
    <div class="card-head"><h2>Neuer Abschnitt</h2></div>
    <form data-form="newSec" class="add-row">
      <div class="field"><label for="ns-name">Name</label><input class="input" id="ns-name" name="name" placeholder="z. B. Unit 3 – At school" required maxlength="60"></div>
      <div class="field"><label for="ns-lang">Sprache</label><select class="input" id="ns-lang" name="lang">
        <option value="en">Englisch – Deutsch</option><option value="la">Latein – Deutsch</option><option value="fr">Französisch – Deutsch</option></select></div>
      <button class="btn primary" type="submit">Anlegen</button>
    </form>
  </section>
  <section class="card">
    <div class="card-head"><h2>Vokabeldatei importieren</h2><span class="muted" style="font-size:.88rem">Eine Datei, die dir jemand geschickt hat (.vocab.txt)</span></div>
    <div class="row"><label class="btn" for="imp-file">Datei auswählen</label><input type="file" id="imp-file" accept=".txt,.csv,text/plain" hidden>
      <span class="muted" style="font-size:.88rem">Die Vokabeln werden als neuer Abschnitt angelegt.</span></div>
  </section>
  ${lpSec ? `<div class="cfg-group"><span class="eyebrow">Sprache</span>${lpSec}</div>` : ""}
  ${S.sections.length ? `<div class="grid">${cards}</div>` : `<div class="empty"><strong>Noch keine Abschnitte</strong><p>Lege oben deinen ersten Abschnitt an, zum Beispiel eine Lektion aus deinem Schulbuch.</p></div>`}`;
}

      <td>${esc(v.f)}</td><td>${esc(v.d)}</td>
      <td class="n ok">${v.r || 0}</td><td class="n no">${v.w || 0}</td>
      <td class="n">${S.confirm === "v:" + v.id
        ? `<span class="inline-confirm">Löschen? <button class="btn small danger solid" data-act="delVocab" data-id="${v.id}">Ja</button><button class="btn small" data-act="cancelConfirm">Nein</button></span>`
        : `<button class="btn small ghost" data-act="askConfirm" data-k="v:${v.id}" aria-label="${esc(v.f)} löschen">Löschen</button>`}</td></tr>`).join("");
  return `<div class="row"><button class="btn small ghost" data-act="closeSec">← Alle Abschnitte</button></div>
  <section class="card">
    <div class="card-head" style="align-items:center">
      <div style="display:flex;flex-direction:column;gap:.35rem;min-width:0"><span class="lang-tag ${s.lang}">${L.name} – Deutsch</span><h2 style="overflow-wrap:anywhere">${esc(s.name)}</h2></div>

      <div class="field"><label for="av-f">${L.name}</label><input class="input" id="av-f" name="f" placeholder="${esc(L.sample)}" required autocapitalize="none"></div>
      <div class="field"><label for="av-d">Deutsch</label><input class="input" id="av-d" name="d" placeholder="das Haus" required></div>
      <button class="btn primary" type="submit">Hinzufügen</button>

    <div class="row" style="margin-top:.9rem"><button class="btn small" data-act="toggleScan">${S.scan ? "Foto-Scan schließen" : "Foto-Scan / Liste einfügen"}</button>
