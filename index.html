.ne-scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);pointer-events:none;animation:neScan 6s linear infinite}
@keyframes neScan{to{background-position:0 120px}}
.ne-logo{width:124px;height:124px;overflow:visible;filter:drop-shadow(0 0 6px #38e8ff) drop-shadow(0 0 18px #38e8ff);animation:neFlick 1.1s 1.25s steps(1) both}
.ne-logo .nb{fill:#38e8ff;fill-opacity:0;stroke:#38e8ff;stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:230;stroke-dashoffset:230;animation:ldDraw 1.2s .15s ease-in-out forwards,neFill .8s 2.1s forwards}
.ne-logo .nc{fill:none;stroke:#ff4fd8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;filter:drop-shadow(0 0 6px #ff4fd8);animation:ldDraw .5s 1.1s ease-out forwards}
.ne-logo .nd{opacity:0;animation:fadeIn .1s 1.6s forwards}
@keyframes neFill{to{fill-opacity:.14}}
@keyframes neFlick{0%{opacity:1}8%{opacity:.2}12%{opacity:1}30%{opacity:.4}34%{opacity:1}60%{opacity:.6}62%{opacity:1}}
.ne-word{color:#c8f7ff;text-shadow:0 0 6px #38e8ff,0 0 18px #38e8ff,0 0 40px #0ea5e9}
.ne-word span{opacity:0;animation:neLetter .45s calc(1.5s + var(--i)*.07s) steps(2) forwards}
@keyframes neLetter{0%{opacity:0}50%{opacity:.6}70%{opacity:.1}100%{opacity:1}}
.ne-tag{color:#ff9bea;text-shadow:0 0 10px #ff4fd8;animation-delay:2.3s}
@media (prefers-reduced-motion: reduce){.lr-rain,.au-sky,.ne-scan{display:none}}
/* ---------- Design 1.4 ---------- */
/* Kopfzeile: bewegtes Blau */
.topbar,.learnbar{background:linear-gradient(115deg,var(--hd1),var(--hd2) 30%,var(--hd3) 55%,var(--hd4) 80%,var(--hd1));background-size:300% 300%;animation:hdFlow 18s ease-in-out infinite alternate;border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 6px 24px -14px color-mix(in srgb,var(--hd2) 70%,transparent);color:#fff}
@keyframes hdFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.topbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 140% at 20% -40%,rgba(255,255,255,.28),transparent 60%),radial-gradient(50% 120% at 85% 140%,rgba(255,255,255,.16),transparent 60%);animation:hdShine 12s ease-in-out infinite alternate}
@keyframes hdShine{to{transform:translateX(4%)}}
.topbar-in{position:relative;z-index:1}
.topbar .brand,.learnbar .brand{color:#fff;gap:.55rem;font-weight:750;letter-spacing:-.025em}
.topbar .brand svg,.learnbar .brand svg{width:34px;height:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.topbar .nav button{color:rgba(255,255,255,.86);border-radius:10px;transition:background .2s var(--ease),color .2s var(--ease)}
.topbar .nav button:hover{background:rgba(255,255,255,.16);color:#fff}
.topbar .nav button[aria-current="page"]{background:rgba(255,255,255,.24);color:#fff;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.topbar .nav .badge{background:#fff;color:var(--hd2)}
.topbar .coin-pill,.learnbar .coin-pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff}
.topbar .user-chip{color:rgba(255,255,255,.9)}
.topbar .btn.ghost,.learnbar .btn{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.topbar .btn.ghost:hover,.learnbar .btn:hover{background:rgba(255,255,255,.22)}
.learnbar .mode-tag{background:rgba(255,255,255,.22);color:#fff}
.learnbar .learn-progress span{color:rgba(255,255,255,.92)}
.learnbar .learn-progress .bar{background:rgba(255,255,255,.28)}
.learnbar .learn-progress .bar i{background:#fff}
.topbar .status.pending{background:rgba(255,255,255,.25);color:#fff}
:root{--acc-soft:var(--brand-soft)}
/* Home */
.today{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.6rem;align-items:center}
.ring-wrap{position:relative;width:132px;height:132px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring-wrap .ring-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display)}
.ring-n b{font-size:2.1rem;line-height:1;letter-spacing:-.03em}
.ring-n span{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.today-main h2{font-size:1.35rem;margin:0 0 .25rem}
.today-main p{margin:0 0 .8rem;color:var(--muted)}
.today-main .bar{height:8px}
.today-side{display:flex;flex-direction:column;gap:.6rem;min-width:180px}
.mini{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.mini .flame{width:22px;height:26px}
.mini b{font-size:1.15rem;font-family:var(--f-display)}
.mini span{font-size:.8rem;color:var(--muted)}
.mini>div{display:flex;flex-direction:column;line-height:1.15}
@media (max-width:760px){.today{grid-template-columns:auto minmax(0,1fr)}.today-side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.today-side .mini{flex:1 1 140px}}
@media (max-width:420px){.today{grid-template-columns:1fr;justify-items:center;text-align:center}}
.cta-learn{display:flex;align-items:center;gap:1.1rem;width:100%;text-align:left;font:inherit;color:#fff;cursor:pointer;border:0;border-radius:22px;padding:1.4rem 1.6rem;background:linear-gradient(120deg,var(--hd2),var(--hd4));box-shadow:0 14px 34px -18px var(--hd2);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.cta-learn:hover{transform:translateY(-2px);box-shadow:0 18px 40px -18px var(--hd2)}
.cta-learn .ico-big{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.cta-learn .ico-big .ico{width:30px;height:30px;color:#fff}
.cta-learn b{display:block;font-size:1.3rem;font-family:var(--f-display);letter-spacing:-.02em}
.cta-learn span{opacity:.9}
.cta-learn .go{margin-left:auto;font-size:1.8rem;line-height:1;transition:transform .25s var(--ease)}
.cta-learn:hover .go{transform:translateX(4px)}
/* Lernen */
.steps{display:flex;flex-direction:column;gap:1rem;padding-bottom:5.5rem}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1rem;align-items:start}
.step-n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--acc);color:var(--on-acc);box-shadow:0 0 0 6px var(--acc-soft)}
.step h2{font-size:1.2rem;margin:.35rem 0 .2rem}
.step .step-sub{color:var(--muted);font-size:.9rem;margin:0 0 .9rem}
.step .cfg-group{margin-top:.9rem}
.sec-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem}
.sec-pick{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.75rem .9rem;cursor:pointer;position:relative;transition:border-color .2s,background .2s}
.sec-pick:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.sec-pick[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.sec-pick[aria-pressed="true"]::after{content:"✓";position:absolute;right:.7rem;top:.6rem;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:.72rem;font-weight:800}
.sec-pick b{font-size:.98rem;padding-right:1.6rem;overflow-wrap:anywhere}
.sec-pick span{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.sec-pick.all b{font-size:1rem}
.startbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:min(760px,calc(100% - 24px));display:flex;align-items:center;gap:1rem;padding:.7rem .7rem .7rem 1.2rem;border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--line);box-shadow:0 18px 44px -18px rgba(15,23,42,.35)}
.startbar .sum{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.startbar .sum b{font-size:1rem}
.startbar .sum span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.startbar .btn{margin-left:auto;flex:none}
body.has-pet .startbar{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* Shop: Gestaltung + Ladescreens */
.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.d-grid.two{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.d-card.wide{flex-wrap:wrap}
.d-card{display:flex;flex-direction:column;align-items:center;gap:.55rem;padding:1rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:center}
.d-card.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.d-card.wide,.d-card.glass-card{flex-direction:row;text-align:left;align-items:center}
.d-info{display:flex;flex-direction:column;gap:.15rem;flex:1;min-width:0}
.d-card .d-info .muted{font-size:.85rem}
.d-swatch{width:64px;height:64px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.d-swatch i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;border:3px solid var(--surface)}
.d-shape{display:flex;gap:5px;flex:none}
.d-shape i{display:block;width:24px;height:34px;background:var(--acc-soft);border:2px solid var(--acc)}
.d-shape.round i{border-radius:10px}
.d-shape.square i{border-radius:2px}
.d-glass{position:relative;width:110px;height:72px;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--hd1),var(--hd4))}
.d-glass>i{position:absolute;border-radius:50%;filter:blur(6px)}
.d-glass>i:nth-child(1){width:46px;height:46px;left:-6px;top:-8px;background:#fff6;animation:glassBlob 6s ease-in-out infinite alternate}
.d-glass>i:nth-child(2){width:54px;height:54px;right:-10px;bottom:-14px;background:#ffd6f5aa;animation:glassBlob 7s -2s ease-in-out infinite alternate-reverse}
.d-glass .pane{position:absolute;inset:14px 16px;border-radius:10px;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);display:flex;flex-direction:column;gap:5px;padding:8px}
.d-glass .pane b{height:5px;border-radius:3px;background:rgba(255,255,255,.75)}.d-glass .pane b+b{width:60%}
@keyframes glassBlob{to{transform:translate(18px,10px) scale(1.2)}}
.ld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem}
.ld-card{display:flex;flex-direction:column;gap:.7rem;padding:.8rem;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.ld-card.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ld-card .d-info .muted{font-size:.84rem}
.ld-thumb{position:relative;height:120px;border:0;border-radius:12px;cursor:pointer;display:grid;place-items:center;overflow:hidden;font:inherit}
.ld-thumb .th-logo svg{width:52px;height:52px;transition:transform .3s var(--ease)}
.ld-thumb:hover .th-logo svg{transform:scale(1.1)}
.ld-thumb .th-play{position:absolute;left:8px;bottom:8px;font-size:.75rem;font-weight:700;padding:.2em .6em;border-radius:99px;background:rgba(0,0,0,.45);color:#fff}
.th-classic{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.th-letters{background:var(--bg) repeating-linear-gradient(115deg,transparent 0 22px,color-mix(in srgb,var(--acc) 12%,transparent) 22px 24px);box-shadow:inset 0 0 0 1px var(--line)}
.th-book{background:linear-gradient(180deg,#fdf8ee,#eef3ff)}
.th-aurora{background:radial-gradient(80% 60% at 30% 30%,#22d3ee88,transparent),radial-gradient(70% 60% at 75% 55%,#a78bfa88,transparent),#070b1a}
.th-orbit{background:radial-gradient(circle at 50% 50%,transparent 26px,rgba(165,180,252,.35) 27px,transparent 28px),radial-gradient(circle at 50% 50%,transparent 44px,rgba(165,180,252,.25) 45px,transparent 46px),radial-gradient(80% 80% at 50% 45%,#141c3f,#060816)}
.th-neon{background:#05060b}
.th-neon .th-logo svg{filter:drop-shadow(0 0 6px #38e8ff) drop-shadow(0 0 14px #ff4fd8)}
/* Lernbereich */
.lb-langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.lb-lang{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:1.6rem;border-radius:22px;border:1px solid var(--line);background:var(--surface);font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.lb-lang:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 16px 36px -22px var(--hd2)}
.lb-lang .flag{font-size:2.6rem;line-height:1}
.lb-lang b{font-size:1.4rem;font-family:var(--f-display)}
.lb-lang span:last-child{color:var(--muted);font-size:.92rem}
.lb-switch{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.lb-hero{display:flex;align-items:center;gap:1.1rem;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);border-radius:22px;padding:1.3rem 1.4rem;background:linear-gradient(120deg,var(--acc-soft),var(--surface) 70%);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.lb-hero:hover{transform:translateY(-2px);box-shadow:0 16px 36px -24px var(--hd2)}
.lb-hero-ico{font-size:2.2rem;width:60px;height:60px;border-radius:18px;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px -8px rgba(0,0,0,.2)}
.lb-hero .lb-t b{font-size:1.2rem}
.lb-hero .btn{margin-left:auto;flex:none;pointer-events:none}
.lb-t{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.lb-t span{color:var(--muted);font-size:.88rem}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.lb-card,.lb-tricks{display:flex;align-items:center;gap:.85rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;background:var(--surface);transition:border-color .2s,transform .2s var(--ease)}
.lb-card:hover,.lb-tricks:hover{border-color:var(--acc);transform:translateY(-1px)}
.lb-ico{font-size:1.5rem;width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.lb-ico.big{width:64px;height:64px;font-size:2.1rem;border-radius:18px}
.lb-arrow{margin-left:auto;font-size:1.5rem;color:var(--muted)}
.lb-best{margin-left:auto;font-size:.8rem;font-weight:700;padding:.2em .6em;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.lb-best.full{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}
.lb-tricks{width:100%}
.lb-tricks>span:first-child{font-size:1.5rem}
.gram-head{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.gram-head h2{margin:.1rem 0}
.gram-body{line-height:1.6}
.gram-body h3{font-size:1.08rem;margin:1.3rem 0 .5rem}
.gram-body p{margin:.4rem 0}
.gram-body ul{margin:.4rem 0;padding-left:1.2rem}
.gram-body li{margin:.25rem 0}
.gram-body .table-wrap{margin:.6rem 0}
.gt td,.gt th{padding:.5rem .8rem;vertical-align:top}
.gt th{font-size:.8rem;color:var(--muted);font-weight:600}
.gx{list-style:none;padding:0!important;margin:.6rem 0!important;display:flex;flex-direction:column;gap:.4rem}
.gx li{display:flex;flex-wrap:wrap;gap:.2rem 1rem;padding:.55rem .85rem;border-left:3px solid var(--acc);background:var(--surface-2);border-radius:0 10px 10px 0;margin:0!important}
.gx .fx-a{font-weight:500}
.gx .fx-b{color:var(--muted);font-size:.9rem}
.gtip{margin:.8rem 0;padding:.8rem 1rem;border-radius:12px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.gq-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.9rem}
.gq{padding:.9rem 1rem;border:1px solid var(--line);border-radius:14px}
.gq.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.gq.no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.gq-q{display:flex;gap:.6rem;align-items:baseline;margin:0 0 .65rem;font-weight:600}
.gq-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem}
.gq-opts{display:flex;flex-wrap:wrap;gap:.45rem}
.gq-opt{font:inherit;font-size:.95rem;padding:.45em .9em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.gq-opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.gq-opt:disabled{cursor:default;opacity:.65}
.gq-opt.right{opacity:1;border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--good);font-weight:600}
.gq-opt.wrong{opacity:1;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--bad);text-decoration:line-through}
.gq-ex{margin:.6rem 0 0;font-size:.9rem;color:var(--muted)}
.bf-banner{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;font:inherit;border:0;border-radius:18px;padding:1rem 1.2rem;background:linear-gradient(120deg,#0b0b0f,#1c1c24 60%,#2a1f05);color:#fff;box-shadow:0 14px 34px -20px rgba(0,0,0,.6);position:relative;overflow:hidden}
.bf-banner.live{cursor:pointer}
.bf-banner.live::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,214,90,.18) 50%,transparent 65%);background-size:250% 100%;animation:bfShine 3.2s linear infinite;pointer-events:none}
@keyframes bfShine{from{background-position:120% 0}to{background-position:-120% 0}}
.bf-banner.soon{background:linear-gradient(120deg,#16161c,#2b2b36)}
.bf-tag{flex:none;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:.82rem;padding:.35em .7em;border-radius:8px;background:#ffd65a;color:#111}
.bf-txt{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.bf-txt b{font-size:1.15rem;font-family:var(--f-display)}
.bf-txt span{color:rgba(255,255,255,.75);font-size:.88rem}
.bf-go{margin-left:auto;font-weight:700;color:#ffd65a;flex:none}
.old-price{color:var(--muted);font-weight:500;margin-right:.3em;text-decoration-thickness:2px;text-decoration-color:#e11d48}
.bf-price{color:#e11d48;font-weight:800}
.legend-info .old-price{color:rgba(255,226,122,.65);text-decoration-color:#fff}
.legend-info .bf-price{color:#fff}
.linklike{font:inherit;background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion: reduce){.bf-banner.live::after{animation:none}}
.notify-rows{display:flex;flex-direction:column;gap:.8rem}
.notify-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:space-between;padding:.8rem 1rem;border:1px solid var(--line);border-radius:14px}
.notify-row>div:first-child{display:flex;flex-direction:column;gap:.2rem;flex:1 1 260px;min-width:0}
.notify-row .muted{font-size:.88rem}
.nb-big{font-size:clamp(2.6rem,8vw,4rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nb-big sup,.nb-tables sup,.sol-chip sup,.sol sup,.vt-wrong sup{font-size:.55em}
.nb-listen .ico{width:20px;height:20px;vertical-align:-4px;margin-right:.3rem}
.nb-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;align-items:start}
.nb-tables .table-wrap{max-height:520px;overflow:auto}
.nb-tables td.num{font-variant-numeric:tabular-nums;width:7rem}
.prep-btns{display:flex;gap:.8rem}
.prep-btns .btn{min-width:110px;font-size:1.3rem}
.vt-prep{font-size:clamp(1.4rem,4vw,2rem)}
.prep-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:.8rem;align-items:center;padding:.6rem .9rem}
.lb-hero.nb{background:linear-gradient(120deg,color-mix(in srgb,var(--c-teal,#14b8a6) 14%,var(--surface)),var(--surface) 70%)}
.vt-filter{display:flex;gap:.5rem;flex-wrap:wrap}
/* Admin */
.adm-block{border-top:1px solid var(--line);padding-top:1rem;margin-top:1rem}
.adm-block h3{margin:0 0 .5rem;font-size:1.02rem}
.sess-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.35rem .8rem}
.sess-list li{display:flex;gap:.6rem;align-items:baseline;font-size:.88rem;padding:.35rem .6rem;border-radius:8px;background:var(--surface-2)}
.sess-list li b{font-weight:600}
.sess-list li .muted{margin-left:auto;font-size:.78rem}
.adm-secs{display:flex;flex-direction:column;gap:.45rem}
.adm-sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.adm-sec summary{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .9rem;cursor:pointer;list-style:none}
.adm-sec summary::-webkit-details-marker{display:none}
.adm-sec summary .muted{font-size:.82rem;margin-left:auto}
.adm-sec[open] summary{background:var(--surface-2)}
.adm-sec .table-wrap{border:0;border-radius:0;max-height:320px;overflow:auto}
/* Form: eckig */
html[data-shape="square"] :is(.card,.btn,.input,select,textarea,.seg,.seg button,.tabs,.tabs button,.chip,.mode,.stat,.pet-card,.legend-card,.acc-card,.acc-ava,.shop-side,.shop-cat,.own,.fb,.toast,.table-wrap,.pick-list,.vt-list,.nav button,.coin-pill,.theme-opt,.sol-chip,.art-card,.empty,.ic-chip,.lang-tag,.status,.reward-pill,.d-card,.ld-card,.ld-thumb,.lb-card,.lb-hero,.lb-hero-ico,.lb-ico,.lb-lang,.lb-tricks,.gq,.gq-opt,.gtip,.sec-pick,.startbar,.cta-learn,.cta-learn .ico-big,.mini,.agb-scroll,.adm-sec,.sess-list li,.fb-item,.panel,.legend-ava,.pet-card .ava,.mode-tag,.d-glass,.d-glass .pane,.gx li,.modal .box,.dlg){border-radius:3px!important}
html[data-shape="square"] .step-n{border-radius:4px}
/* Liquid Glass */
html[data-glass="1"] body{background:var(--bg)}
html[data-glass="1"] body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:
  radial-gradient(40% 35% at 15% 20%,color-mix(in srgb,var(--hd1) 55%,transparent),transparent 70%),
  radial-gradient(35% 40% at 85% 25%,color-mix(in srgb,var(--hd4) 45%,transparent),transparent 70%),
  radial-gradient(45% 40% at 70% 85%,color-mix(in srgb,var(--hd3) 45%,transparent),transparent 70%),
  radial-gradient(35% 35% at 20% 80%,rgba(255,170,220,.35),transparent 70%);filter:blur(30px);animation:glassFlow 26s ease-in-out infinite alternate}
@keyframes glassFlow{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(4deg)}100%{transform:translate(-3%,2%) rotate(-3deg)}}
html[data-glass="1"] :is(.card,.stat,.shop-side,.pet-card,.legend-card,.acc-card,.mode,.empty,.d-card,.ld-card,.lb-card,.lb-tricks,.lb-lang,.sec-pick,.gq,.art-card,.fb-item,.mini,.table-wrap){
  background:color-mix(in srgb,var(--surface) 52%,transparent)!important;backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);
  border:1px solid color-mix(in srgb,#fff 55%,transparent)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.15),0 10px 30px -14px rgba(30,41,90,.25)!important}
html[data-glass="1"] :is(.seg,.tabs){background:color-mix(in srgb,var(--surface) 40%,transparent)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5)}
html[data-glass="1"] .btn:not(.primary){background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.55)}
html[data-glass="1"] .btn.primary{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -10px var(--acc)}
html[data-glass="1"] .input{background:color-mix(in srgb,var(--surface) 70%,transparent)}
html[data-glass="1"] .topbar,html[data-glass="1"] .learnbar{background:linear-gradient(115deg,color-mix(in srgb,var(--hd1) 70%,transparent),color-mix(in srgb,var(--hd2) 70%,transparent) 30%,color-mix(in srgb,var(--hd3) 70%,transparent) 55%,color-mix(in srgb,var(--hd4) 70%,transparent) 80%,color-mix(in srgb,var(--hd1) 70%,transparent));background-size:300% 300%;backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 -1px 0 rgba(255,255,255,.35)}
html[data-glass="1"][data-theme="dark"] :is(.card,.stat,.shop-side,.pet-card,.legend-card,.acc-card,.mode,.empty,.d-card,.ld-card,.lb-card,.lb-tricks,.lb-lang,.sec-pick,.gq,.art-card,.fb-item,.mini,.table-wrap){border-color:rgba(255,255,255,.14)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px -14px rgba(0,0,0,.5)!important}
@media (prefers-color-scheme:dark){html[data-glass="1"]:not([data-theme="light"]) :is(.card,.stat,.shop-side,.pet-card,.legend-card,.acc-card,.mode,.empty,.d-card,.ld-card,.lb-card,.lb-tricks,.lb-lang,.sec-pick,.gq,.art-card,.fb-item,.mini,.table-wrap){border-color:rgba(255,255,255,.14)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px -14px rgba(0,0,0,.5)!important}}
@media (prefers-reduced-motion: reduce){.topbar,.learnbar,.topbar::after,html[data-glass="1"] body::before{animation:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .logo-check{stroke-dashoffset:0}
}
/* ===== 2.1.0 Lernmodi, Freunde, Vokabel-Battle ===== */
.game-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:.7rem;margin-top:.2rem}
.game-tile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.85rem;align-items:start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:.95rem 1rem;cursor:pointer;overflow:hidden;isolation:isolate;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.game-tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,var(--g1),var(--g2));opacity:0;transition:opacity .25s}
.game-tile::after{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g2) 24%,transparent),transparent 70%);z-index:-1;opacity:0;transition:opacity .3s}
.game-tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--g2) 40%,var(--line));box-shadow:0 14px 30px -18px color-mix(in srgb,var(--g2) 70%,transparent)}
.game-tile:hover::after,.game-tile[aria-pressed="true"]::after{opacity:1}
.game-tile[aria-pressed="true"]{border-color:var(--g2);box-shadow:0 0 0 3px color-mix(in srgb,var(--g2) 22%,transparent),0 14px 30px -16px color-mix(in srgb,var(--g2) 70%,transparent)}
.game-tile[aria-pressed="true"]::before{opacity:.07}
.gt-art{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 18px -8px var(--g2),inset 0 1px 0 rgba(255,255,255,.35)}
.game-tile[aria-pressed="true"] .gt-art{animation:gtPop .5s var(--ease)}
@keyframes gtPop{40%{transform:scale(1.12) rotate(-6deg)}}
.g-ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gt-txt{display:flex;flex-direction:column;gap:.18rem;min-width:0}
.gt-txt b{font-family:var(--f-display);font-size:1rem;font-weight:700}
.gt-txt>span{color:var(--muted);font-size:.85rem;line-height:1.38}
.gt-tag{align-self:flex-start;margin-top:.35rem;font-style:normal;font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;background:color-mix(in srgb,var(--g2) 13%,transparent);color:color-mix(in srgb,var(--g2) 72%,var(--ink))}
.gt-badge{position:absolute;top:.6rem;right:.6rem;margin:0}
.startbar .sb-art{width:42px;height:42px;border-radius:13px}
.startbar .sb-art .g-ico{width:22px;height:22px}
@media (max-width:560px){.startbar .sb-art{display:none}}
.game-tag{display:inline-flex!important;align-items:center;gap:.35em;background:linear-gradient(135deg,var(--g1),var(--g2))!important;color:#fff!important}
.game-tag .g-ico{width:15px;height:15px}
@media (max-width:560px){.game-tag span{display:none}}
.hearts{display:inline-flex;gap:.08rem;font-size:1.15rem;line-height:1}
.hearts i{font-style:normal;color:color-mix(in srgb,var(--muted) 45%,transparent);transition:color .3s}
.hearts i.on{color:#ef4444;animation:pop .35s}
.game-card{position:relative;overflow:hidden}
.game-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.g-hint{color:var(--muted);font-size:.9rem;margin:.2rem 0 1rem}
.det-form.shake,.esc-q.shake,.esc-code.shake{animation:shake .35s}

/* Memory */
.mem-top{display:flex;gap:.7rem;align-items:stretch;margin-bottom:.6rem;flex-wrap:wrap}
.mem-clock{flex:1 1 220px;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:.6rem;background:var(--surface-2);border-radius:14px;padding:.6rem .9rem}
.mem-clock .ico{width:20px;height:20px}
.mem-clock b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:3.2ch}
.mem-bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--g2) 15%,transparent);overflow:hidden}
.mem-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .2s linear}
.mem-clock.hurry b{color:var(--bad);animation:pulseT 1s infinite}
.mem-clock.hurry .mem-bar i{background:var(--bad)}
@keyframes pulseT{50%{opacity:.5}}
.mem-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:14px;padding:.45rem 1rem;min-width:84px}
.mem-stat b{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.mem-stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.mem-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:.65rem;perspective:1200px}
.mem-card{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;height:clamp(92px,12vw,118px);border-radius:16px}
.mem-card:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.mem-card.miss{animation:shake .35s}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.mem-card.up .mc-in{transform:rotateY(180deg)}
.mem-card:not(.up):hover .mc-in{transform:translateY(-3px) rotateY(10deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.5rem;text-align:center}
.mc-back{background:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.4px) 0 0/12px 12px,linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:inset 0 0 0 5px rgba(255,255,255,.16),0 6px 16px -10px var(--g2)}
.mc-back span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);font-weight:800;font-size:1.35rem;font-family:var(--f-display)}
.mc-front{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--line);box-shadow:0 6px 16px -12px rgba(15,23,42,.35)}
.mc-front small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mc-front b{font-size:clamp(.8rem,1.8vw,1rem);line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.mc-front.en{background:var(--en-soft);border-color:color-mix(in srgb,var(--en) 35%,transparent)}
.mc-front.fr{background:var(--fr-soft);border-color:color-mix(in srgb,var(--fr) 35%,transparent)}
.mc-front.la{background:var(--la-soft);border-color:color-mix(in srgb,var(--la) 35%,transparent)}
.mem-card.done{cursor:default}
.mem-card.done .mc-front{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good);color:var(--good)}
.mem-card.done .mc-in{animation:memWin .5s ease}
@keyframes memWin{50%{transform:rotateY(180deg) scale(1.08)}}
@media (max-width:560px){.mem-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}.mem-card{height:84px}.mc-front small{display:none}.mem-stat{min-width:64px;padding:.4rem .6rem}}

/* Detektiv */
.det-file{position:relative;background:linear-gradient(180deg,#fdf6e3,#f6ead0);color:#3b2f1e;border-radius:16px;padding:1.2rem 1.3rem 1rem;box-shadow:inset 0 0 0 1px rgba(120,90,40,.18),0 10px 24px -18px rgba(80,50,10,.6);margin-bottom:1rem}
.det-file.solved{box-shadow:inset 0 0 0 2px rgba(23,128,61,.35)}
.det-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.det-stamp{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .6rem;border:2px solid currentColor;border-radius:6px;transform:rotate(-2deg);opacity:.75}
.det-pts{font-weight:700;font-size:.82rem;padding:.25rem .7rem;border-radius:99px;background:rgba(13,148,136,.15);color:#0f766e}
.det-q{font-family:var(--f-display);font-size:1.3rem;margin:.8rem 0 .7rem;color:inherit}
.det-clues{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.det-clue{display:flex;gap:.75rem;align-items:flex-start;background:rgba(255,255,255,.6);border-radius:12px;padding:.6rem .8rem;border:1px dashed rgba(120,90,40,.28)}
.det-clue.new{animation:clueIn .5s var(--ease)}
@keyframes clueIn{from{opacity:0;transform:translateY(-6px) rotate(-1deg)}}
.det-clue.locked{opacity:.5}
.dc-ico{font-size:1.25rem;line-height:1.4}
.det-clue small{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.65}
.det-clue p{margin:.1rem 0 0}
.det-letter{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .2em;border-radius:6px;background:#0f766e;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace}
.det-pattern{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.12rem;letter-spacing:.1em;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
:root[data-theme="dark"] .det-file{background:linear-gradient(180deg,#2a2417,#221d12);color:#f1e6cc;box-shadow:inset 0 0 0 1px rgba(241,230,204,.12)}
:root[data-theme="dark"] .det-clue{background:rgba(255,255,255,.05);border-color:rgba(241,230,204,.18)}
:root[data-theme="dark"] .det-pts{color:#5eead4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .det-file{background:linear-gradient(180deg,#2a2417,#221d12);color:#f1e6cc;box-shadow:inset 0 0 0 1px rgba(241,230,204,.12)}
  :root:not([data-theme="light"]) .det-clue{background:rgba(255,255,255,.05);border-color:rgba(241,230,204,.18)}:root:not([data-theme="light"]) .det-pts{color:#5eead4}}
.det-form{display:flex;gap:.6rem;flex-wrap:wrap}
.det-form .input{flex:1 1 220px;font-size:1.1rem}
.det-actions{margin-top:.7rem;gap:.5rem;align-items:center}
.det-tries{font-size:.85rem}
.det-verdict{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;border-radius:14px;padding:1rem 1.1rem;background:var(--la-soft)}
.det-verdict.failed{background:var(--en-soft)}
.det-verdict p{margin:0}
.dv-stamp{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;font-weight:800;letter-spacing:.1em;border:3px solid var(--good);color:var(--good);padding:.3rem .7rem;border-radius:8px;transform:rotate(-8deg);animation:stampIn .45s cubic-bezier(.3,1.6,.5,1)}
.det-verdict.failed .dv-stamp{border-color:var(--bad);color:var(--bad)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.dv-word{font-family:var(--f-display);font-size:1.6rem;font-weight:800;display:flex;align-items:center;gap:.4rem}

/* Lückentext */
.clz-paper{border-radius:16px;padding:1.2rem 1.4rem 1.4rem;background:repeating-linear-gradient(transparent 0 calc(2.3rem - 1px),color-mix(in srgb,var(--g2) 14%,transparent) calc(2.3rem - 1px) 2.3rem),var(--surface-2);background-position:0 .9rem}
.clz-paper h2{font-family:var(--f-display);margin:.3rem 0 .4rem}
.clz-text{font-size:1.08rem;line-height:2.3rem;margin:0}
.gap{display:inline-flex;align-items:center;gap:.35rem;vertical-align:baseline;min-width:5.5em;height:1.8rem;padding:0 .55rem;margin:0 .1rem;border-radius:8px;font:inherit;font-weight:700;border:2px dashed color-mix(in srgb,var(--g2) 55%,transparent);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1}
.gap.sel{border-style:solid;border-color:var(--g2);box-shadow:0 0 0 3px color-mix(in srgb,var(--g2) 20%,transparent)}
.gap.filled{border-style:solid;background:color-mix(in srgb,var(--g2) 12%,var(--surface));animation:pop .25s}
.gap-n{font-size:.7rem;font-weight:800;color:var(--g2)}
.gap.filled .gap-n{display:none}
.gap.ok{border:2px solid var(--good);background:var(--la-soft);color:var(--good);cursor:default}
.gap.bad{border:2px solid var(--bad);background:var(--en-soft);color:var(--bad);cursor:default;height:auto;min-height:1.8rem;flex-wrap:wrap}
.gap.bad s{opacity:.7;font-weight:500}
.clz-input{font:inherit;font-weight:700;height:1.9rem;padding:0 .45rem;border:2px dashed color-mix(in srgb,var(--g2) 55%,transparent);border-radius:8px;background:var(--surface);color:var(--ink);margin:0 .1rem;vertical-align:baseline;max-width:100%}
.clz-input:focus{outline:none;border-style:solid;border-color:var(--g2);box-shadow:0 0 0 3px color-mix(in srgb,var(--g2) 20%,transparent)}
.clz-bank{margin:1rem 0;display:flex;flex-direction:column;gap:.55rem}
.clz-words{display:flex;flex-wrap:wrap;gap:.5rem}
.clz-word{font:inherit;font-weight:700;border:0;border-radius:10px;padding:.5rem .95rem;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;cursor:pointer;box-shadow:0 6px 14px -8px var(--g2);transition:transform .15s,opacity .2s}
.clz-word:hover:not(:disabled){transform:translateY(-2px)}
.clz-word:disabled{opacity:.22;cursor:default;box-shadow:none}
.g-cloze .fb,.g-cloze .row.end{margin-top:1rem}

/* Escape Game */
.esc-scene{position:relative;border-radius:18px;padding:1.2rem 1.3rem 2.2rem;color:#f1f5ff;background:radial-gradient(120% 90% at 50% 0%,var(--r1,#3d4296) 0%,var(--r2,#1d2140) 55%,var(--r3,#12142a) 100%);overflow:hidden;margin-bottom:1.1rem;isolation:isolate}
.esc-scene::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.3px) 0 0/22px 22px;opacity:.4;pointer-events:none}
.esc-head{display:flex;align-items:center;gap:.8rem}
.esc-ico{font-size:1.9rem;width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.12);flex:none}
.esc-head small{opacity:.75;font-weight:600}
.esc-head h2{color:#fff;margin:0}
.esc-head .hearts{font-size:1.3rem}
.esc-head .hearts i{color:rgba(255,255,255,.22)}.esc-head .hearts i.on{color:#fb7185}
.esc-intro{opacity:.85;margin:.8rem 0 1rem}
.esc-door{display:flex;justify-content:center;padding:1.1rem 1rem 1.9rem;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12)}
.esc-door.open{animation:doorGlow 1.4s ease}
@keyframes doorGlow{30%{box-shadow:0 0 0 6px rgba(250,204,21,.4),0 0 60px rgba(250,204,21,.6)}}
.locks{display:flex;gap:clamp(1rem,6vw,2.4rem)}
.lock{position:relative;width:60px;height:76px}
.lock svg{width:100%;height:100%;overflow:visible}
.lock .shackle{stroke:#cbd5e1;transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:34px 28px;transform-box:view-box}
.lock .body{fill:#94a3b8;transition:fill .3s}
.lock.cur{animation:lockBob 1.6s ease-in-out infinite}
.lock.cur .body{fill:#facc15}
.lock.open .shackle{transform:translateY(-6px) rotate(28deg)}
.lock.open .body{fill:#22c55e}
.lk-d{position:absolute;left:0;right:0;top:42px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:#0b1220}
.lock.open .lk-d{animation:pop .4s}
.lk-s{position:absolute;left:0;right:0;bottom:-1.55rem;text-align:center;font-size:1.05rem;color:#fde68a}
@keyframes lockBob{50%{transform:translateY(-4px)}}
.esc-q{display:flex;flex-direction:column;gap:.85rem}
.esc-q .eyebrow{margin:0}
.esc-word{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.3rem);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;overflow-wrap:anywhere}
.esc-word.small{font-size:clamp(1.25rem,4vw,1.65rem)}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;font:inherit;font-weight:650;font-size:1.02rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.85rem 1rem;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--g2)}
.opt .k{flex:none;width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:8px;font-size:.8rem;font-weight:800;background:color-mix(in srgb,var(--g2) 14%,transparent);color:var(--g2)}
.opt.right{border-color:var(--good);background:var(--la-soft);color:var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--en-soft);color:var(--bad);animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@media (max-width:560px){.opt-grid{grid-template-columns:1fr}}
.slots{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;align-items:center}
.slot{width:2.3rem;height:2.7rem;border-radius:9px;border:2px dashed color-mix(in srgb,var(--g2) 50%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.slot.on{border-style:solid;background:color-mix(in srgb,var(--g2) 12%,var(--surface));animation:pop .25s}
.slot.sp{border:0;width:.8rem}
.slot-art{font-weight:700;color:var(--muted);margin-right:.3rem;font-size:1.1rem}
.tiles{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.tile{width:2.6rem;height:2.9rem;border:0;border-radius:10px;font:inherit;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:#fff;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 4px 0 color-mix(in srgb,var(--g2) 55%,#000),0 8px 14px -8px var(--g2);cursor:pointer;transition:transform .1s,box-shadow .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.tile:disabled{opacity:.15;box-shadow:none;cursor:default}
.esc-code{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center}
.esc-code p{margin:0;max-width:30rem}
.esc-order{font-size:1.5rem;letter-spacing:.15em;color:var(--g2);white-space:pre}
.esc-display{display:flex;gap:.5rem}
.esc-display span{width:3rem;height:3.4rem;border-radius:12px;background:#0f172a;color:#4ade80;display:grid;place-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.7rem;font-weight:800;box-shadow:inset 0 0 0 2px #334155}
.esc-code.done .esc-display span{color:#facc15;box-shadow:inset 0 0 0 2px #facc15}
.keypad{display:grid;grid-template-columns:repeat(3,4.2rem);gap:.5rem}
.keypad button{height:3.2rem;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:inherit;font-weight:800;font-size:1.25rem;cursor:pointer;color:var(--ink);transition:transform .1s}
.keypad button:active{transform:scale(.94)}
.esc-opened{font-weight:800;color:var(--good);font-size:1.15rem;animation:pop .4s}

/* Hör-Quiz */
.lsn-hero{display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap;margin:.4rem 0 1.3rem}
.lsn-btn{position:relative;width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 16px 34px -14px var(--g2);display:grid;place-items:center;flex:none;transition:transform .15s}
.lsn-btn .ico{width:46px;height:46px;stroke-width:1.8}
.lsn-btn:hover{transform:scale(1.04)}
.lsn-btn:active{transform:scale(.95)}
.lsn-btn .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--g2);opacity:0;pointer-events:none}
.lsn-btn.playing .ring{animation:lsnRing 1.5s ease-out}
.lsn-btn.playing .r2{animation-delay:.25s}.lsn-btn.playing .r3{animation-delay:.5s}
@keyframes lsnRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.75);opacity:0}}
.lsn-side{display:flex;flex-direction:column;gap:.55rem;align-items:flex-start;min-width:0;flex:1 1 240px}
.lsn-side h2{margin:0}
.g-listen .fb,.g-escape .fb{margin-top:.2rem}
.g-listen .opt-grid+.fb,.g-listen .det-form+.fb{margin-top:1rem}

/* Battle */
.avatar{--h:200;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 70% 46%));box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.avatar.big{width:76px;height:76px;font-size:2rem;box-shadow:0 0 0 4px var(--surface),0 0 0 7px hsl(var(--h) 70% 55% / .45)}
.vs-intro{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,6vw,3rem);padding:1.3rem 0 .8rem}
.vs-side{display:flex;flex-direction:column;align-items:center;gap:.45rem;font-weight:700;min-width:0}
.vs-side b{max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-mid{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.vs-word{font-family:var(--f-display);font-weight:900;font-size:2.5rem;font-style:italic;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:vsPulse 1.4s ease-in-out infinite;padding:0 .15em}
.vs-bolt{color:var(--g2)}
.vs-bolt .g-ico{width:30px;height:30px}
@keyframes vsPulse{50%{transform:scale(1.12)}}
.vs-intro.small{padding-top:.2rem}
.vs-intro.small .vs-word{font-size:1.7rem}
.vs-score{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.vs-info{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.vs-info p{margin:0}
.vs-info .btn{margin-top:.5rem}
.vs-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.8rem;margin-bottom:1.1rem;padding:.6rem .8rem;border-radius:16px;background:var(--surface-2)}
.vs-p{display:flex;align-items:center;gap:.6rem;min-width:0}
.vs-p.opp{justify-content:flex-end;text-align:right}
.vs-p div{display:flex;flex-direction:column;min-width:0}
.vs-p b{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-p .num{font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.vs-timer{position:relative;width:60px;height:60px;display:grid;place-items:center}
.vs-timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--line);stroke-width:4}
.tr-fg{fill:none;stroke:var(--g2);stroke-width:4;stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset .1s linear}
.vs-timer b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;position:relative}
.vs-timer.hurry .tr-fg{stroke:var(--bad)}
.vs-timer.hurry b{color:var(--bad);animation:pulseT .6s infinite}
.bt-q{display:flex;flex-direction:column;gap:.6rem}
.bt-after{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;font-weight:700;margin-top:.3rem}
.bt-after .ok,.bt-table .ok{color:var(--good);font-weight:800}
.bt-after .no,.bt-table .no{color:var(--bad);font-weight:800}
.bt-table{margin:1rem 0}
.bt-row,.fr-row{display:flex;align-items:center;gap:.8rem;padding:.75rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.card-head+.bt-row,.fr-group>.eyebrow+.fr-row{border-top:0}
.bt-info,.fr-info{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.bt-info b,.fr-info b{display:inline-flex;align-items:center;gap:.35rem}
.bt-info span,.fr-info span{color:var(--muted);font-size:.85rem;display:inline-flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.fr-info .flame{width:12px;height:15px}
.bt-status{font-weight:700;font-size:.88rem;padding:.3rem .8rem;border-radius:99px;background:var(--surface-2)}
.bt-status .num{margin-left:.3rem;font-variant-numeric:tabular-nums}
.bt-row.turn .bt-status{background:color-mix(in srgb,#f97316 15%,transparent);color:#c2410c}
.bt-row.win .bt-status{background:var(--la-soft);color:var(--good)}
.bt-row.lose .bt-status{background:var(--en-soft);color:var(--bad)}
.bt-row.tie .bt-status{background:var(--coin-soft);color:var(--warn)}
.bt-row.wait .bt-status,.bt-row.off .bt-status{color:var(--muted)}
:root[data-theme="dark"] .bt-row.turn .bt-status{color:#fdba74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bt-row.turn .bt-status{color:#fdba74}}
.fr-btns{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.fr-btns .g-ico,.bt-go .g-ico{width:16px;height:16px}
.fr-group{display:flex;flex-direction:column;margin-top:1.2rem}
.fr-group>.eyebrow{margin-bottom:.3rem}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.bt-turn{border:1.5px solid color-mix(in srgb,#f97316 45%,var(--line))!important;background:linear-gradient(135deg,color-mix(in srgb,#f43f5e 6%,var(--surface)),color-mix(in srgb,#f97316 9%,var(--surface)))!important}
.vs-picks{display:flex;flex-wrap:wrap;gap:.6rem}
.vs-pick{display:flex;align-items:center;gap:.55rem;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:.35rem 1rem .35rem .35rem;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.vs-pick:hover{transform:translateY(-1px)}
.vs-pick[aria-pressed="true"]{border-color:#f43f5e;box-shadow:0 0 0 3px rgba(244,63,94,.2)}
.bt-go{background:linear-gradient(135deg,#f43f5e,#f97316)!important;border-color:transparent!important;color:#fff!important}
.bt-go:disabled{opacity:.45}
.social-banner{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;font:inherit;color:#fff;border:0;border-radius:var(--r-lg);padding:1rem 1.2rem;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 14px 30px -16px var(--g2);transition:transform .2s}
.social-banner:hover{transform:translateY(-2px)}
.social-banner .gt-art{background:rgba(255,255,255,.2);box-shadow:none}
.social-banner b{display:block;font-size:1.02rem}
.social-banner span span{opacity:.92;font-size:.88rem}
.social-banner .go{margin-left:auto;font-size:1.3rem}
.rec-badge{display:inline-block;margin:.2rem auto .4rem;padding:.3rem .9rem;border-radius:99px;font-weight:800;background:linear-gradient(135deg,#facc15,#f59e0b);color:#3b2600;animation:pop .5s}
.game-sum .gt-art.big{width:72px;height:72px;border-radius:22px;margin:0 auto .6rem}
.game-sum .gt-art.big .g-ico{width:36px;height:36px}
html[data-shape="square"] :is(.game-tile,.gt-art,.mem-card,.mc-back,.mc-front,.opt,.tile,.clz-paper,.det-file,.esc-scene,.esc-door,.vs-bar,.social-banner,.mem-clock,.mem-stat,.keypad button,.esc-display span){border-radius:4px}
@media (max-width:560px){.game-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.game-tile{grid-template-columns:1fr;gap:.5rem;padding:.75rem}.gt-art{width:40px;height:40px;border-radius:12px}.gt-art .g-ico{width:21px;height:21px}.gt-txt>span{display:none}.gt-txt b{font-size:.92rem}.gt-tag{margin-top:.15rem}}
.bt-table td:nth-child(n+3){white-space:nowrap}
@media (hover:none){.game-tile:not([aria-pressed="true"]):hover{transform:none;border-color:var(--line);box-shadow:none}.game-tile:not([aria-pressed="true"]):hover::after{opacity:0}}
/* ===== 2.1.1 Nachholen: Lernstraße ===== */
.ny-hero{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.ny-hero .ring-wrap{flex:none}
.nh-main{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:.35rem}
.nh-main h2{margin:0}
.ny-legend{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin:.4rem 0 .2rem}
.ny-legend span{display:inline-flex;align-items:center;gap:.4rem}
.ny-legend .lg{width:14px;height:14px;border-radius:50%;display:inline-block}
.lg.v{background:linear-gradient(135deg,#3b82f6,#06b6d4)}.lg.g{background:linear-gradient(135deg,#f59e0b,#f97316)}.lg.c{background:linear-gradient(135deg,#a16207,#ca8a04)}
.ny-road{display:flex;flex-direction:column;gap:1.4rem;margin-top:.6rem}
.ny-unit{position:relative}
.ny-banner{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center;padding:1rem 1.2rem;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--u1),var(--u2));box-shadow:0 14px 30px -18px var(--u1),inset 0 -4px 0 rgba(0,0,0,.12)}
.ny-unit.locked .ny-banner{filter:saturate(.35) brightness(.95)}
.nb-txt small{opacity:.85;font-weight:700;font-size:.78rem;letter-spacing:.03em;text-transform:uppercase}
.nb-txt h2{color:#fff;margin:.1rem 0 .1rem;font-size:1.45rem}
.nb-txt p{margin:0;opacity:.92;font-size:.92rem}
.nb-side{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;justify-content:flex-end}
.nb-prog{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.nb-prog b{font-family:var(--f-display);font-size:1.3rem}
.nb-prog span{font-size:.72rem;opacity:.85}
.nb-skip{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.45)!important;color:#fff!important}
.nb-done{font-weight:800;background:rgba(255,255,255,.22);padding:.3rem .8rem;border-radius:99px}
.nb-bar{grid-column:1/-1;height:7px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.nb-bar i{display:block;height:100%;background:#fff;border-radius:inherit}
.ny-path{position:relative;margin-top:.6rem}
.ny-svg{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none;overflow:visible}
.np-base{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 18}
.np-done{fill:none;stroke:var(--u1);stroke-width:10;stroke-linecap:round;opacity:.55}
.ny-label{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.ny-label span{background:var(--bg);color:var(--muted);font-weight:700;font-size:.8rem;padding:.25rem .8rem;border-radius:99px;border:1px solid var(--line);max-width:90%;text-align:center}
.ny-node{position:absolute;transform:translateX(-50%);width:76px;height:76px;border:0;padding:0;background:none;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center}
.nn-in{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.9rem;transition:transform .15s;position:relative}
.nn-in .ico{width:32px;height:32px;stroke-width:2.1}
.nn-emo{font-size:1.85rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.ny-node.t-v .nn-in{background:linear-gradient(160deg,#60a5fa,#2563eb);box-shadow:0 7px 0 #1d4ed8}
.ny-node.t-g .nn-in{background:linear-gradient(160deg,#fbbf24,#f97316);box-shadow:0 7px 0 #c2410c}
.ny-node.s-done.t-v .nn-in{background:linear-gradient(160deg,#4ade80,#16a34a);box-shadow:0 7px 0 #15803d}
.ny-node.s-done.t-g .nn-in{background:linear-gradient(160deg,#facc15,#eab308);box-shadow:0 7px 0 #a16207}
.ny-node.s-lock .nn-in{background:var(--surface-2);color:var(--muted);box-shadow:0 7px 0 var(--line)}
.ny-node.s-lock .nn-emo{filter:grayscale(1);opacity:.5}
.ny-node:hover:not(.s-lock) .nn-in{transform:translateY(-2px)}
.ny-node:active .nn-in{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ny-node.s-cur .nn-in{animation:nyPulse 1.8s ease-in-out infinite}
.ny-node.s-cur .nn-in::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid color-mix(in srgb,var(--u1) 45%,transparent);animation:nyRing 1.8s ease-out infinite}
@keyframes nyPulse{50%{transform:translateY(-3px) scale(1.04)}}
@keyframes nyRing{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
.nn-start{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--u1);font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;padding:.35rem .8rem;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.nn-start::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
.ny-node.t-c{width:96px;height:90px}
.ny-node.t-c .nn-in{width:96px;height:86px;border-radius:24px;background:none;box-shadow:none}
.ny-node.t-c .nn-in svg{width:84px;height:70px}
.ny-node.t-c.s-lock .nn-in svg,.ny-node.t-c.s-open .nn-in svg{filter:grayscale(.85);opacity:.55}
.ny-node.t-c.s-ready .nn-in{animation:nyPulse 1.4s ease-in-out infinite}
.ny-node.t-c.s-done .nn-in svg .lid{transform:translateY(-6px) rotate(-12deg);transform-origin:8px 16px}
.nn-stars{display:flex;gap:1px;margin-top:4px;font-size:.95rem;line-height:1}
.nn-stars i{font-style:normal;color:var(--line)}.nn-stars i.on{color:#f59e0b;text-shadow:0 1px 0 #b45309}
.ny-cta .ico-big{background:linear-gradient(135deg,#0d9488,#22c55e)!important}
/* Modal */
.ny-mhead{display:flex;gap:1rem;align-items:center;text-align:left;margin-bottom:.8rem}
.ny-mhead .nn-in{flex:none;width:58px;height:58px;background:linear-gradient(135deg,var(--u1),var(--u2));font-size:1.5rem}
.ny-mhead h2{margin:.1rem 0}
.ny-wlist{display:flex;flex-wrap:wrap;gap:.35rem;text-align:left;max-height:180px;overflow:auto}
.ny-wlist span{background:var(--surface-2);border-radius:8px;padding:.25rem .55rem;font-size:.85rem;color:var(--muted)}
.ny-wlist b{color:var(--ink)}
.ny-mstars{display:flex;align-items:center;gap:.5rem;justify-content:center;color:var(--muted);margin:.6rem 0 0}
.ny-mstars .nn-stars{font-size:1.3rem}
/* Lektion */
.ny-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-top:1rem}
.ny-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.1rem .4rem;padding:.75rem .9rem;border-radius:14px;background:var(--fr-soft);border:1.5px solid color-mix(in srgb,var(--fr) 30%,transparent)}
.ny-card b{font-size:1.08rem}
.ny-card span{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.ny-task{display:flex;flex-direction:column;gap:.9rem;min-height:260px}
.ny-ask{font-weight:800;font-size:1.15rem;margin:0}
.ny-q{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;overflow-wrap:anywhere}
.lsn-btn.sm{width:64px;height:64px}.lsn-btn.sm .ico{width:28px;height:28px}
.ny-match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ny-match>div{display:flex;flex-direction:column;gap:.5rem}
.mt{font:inherit;font-weight:700;font-size:1rem;padding:.8rem .9rem;border-radius:14px;border:1.5px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;transition:transform .1s,background .2s,border-color .2s,opacity .3s;overflow-wrap:anywhere}
.mt.sel{border-color:var(--g2);background:color-mix(in srgb,var(--g2) 14%,var(--surface));color:var(--g2)}
.mt.ok{border-color:var(--good);background:var(--la-soft);color:var(--good);opacity:.45;cursor:default}
.ny-match.shake{animation:shake .35s}
.ny-acc{display:flex;flex-wrap:wrap;gap:.35rem}
.ny-acc button{min-width:2.4rem;height:2.4rem;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font:inherit;font-weight:700;font-size:1.05rem;color:var(--ink);cursor:pointer}
.ny-fb{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin-top:1.1rem;padding:1rem 1.1rem;border-radius:16px;animation:fbUp .3s var(--ease)}
.ny-fb>div{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.ny-fb.right{background:var(--la-soft);color:var(--good)}
.ny-fb.wrong{background:var(--en-soft);color:var(--bad)}

.ny-bigstars i:nth-child(2){font-size:3.9rem;margin-top:-.4rem}

/* ===== 2.1.2 Weihnachten ===== */
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.brand-logo{position:relative;display:inline-flex}
.ld-deco{position:absolute;pointer-events:none;z-index:2}
.ld-muetze{width:26px;left:-7px;top:-13px;transform:rotate(-14deg)}
.ld-geweih{width:36px;left:-4px;top:-17px}
.ld-haube{width:30px;left:-1px;top:-5px}
.ld-stech{width:20px;right:-8px;top:-8px}
.ld-bell{font-size:15px;right:-9px;top:-7px;animation:bellSwing 2.4s ease-in-out infinite;transform-origin:50% 0}
.ld-star{font-size:15px;left:5px;top:-15px;animation:starTw 1.8s ease-in-out infinite}
@keyframes bellSwing{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(18deg)}80%{transform:rotate(-14deg)}90%{transform:rotate(8deg)}}
@keyframes starTw{50%{transform:scale(1.25);filter:drop-shadow(0 0 4px #fde047)}}
.topbar{position:sticky}
.xmas-snowcap{position:absolute;left:0;right:0;bottom:-8px;height:12px;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 10px -2px,#fff 9px,transparent 9.5px) 0 0/26px 12px repeat-x;opacity:.95;filter:drop-shadow(0 2px 2px rgba(15,23,42,.12))}
.xmas-lights{position:absolute;left:0;right:0;bottom:-2px;height:22px;display:flex;justify-content:space-around;pointer-events:none;z-index:2;overflow:hidden}
.xmas-lights::before{content:"";position:absolute;left:0;right:0;top:2px;height:8px;border-bottom:1.5px solid #14532d;border-radius:0 0 50% 50%/0 0 100% 100%;opacity:.7}
.xmas-lights i{position:relative;top:7px;width:7px;height:11px;border-radius:50% 50% 45% 45%;background:var(--c);box-shadow:0 0 8px 2px var(--c);animation:bulb 1.6s ease-in-out infinite;animation-delay:var(--d)}
.xmas-lights i::before{content:"";position:absolute;left:1.5px;top:-3px;width:4px;height:4px;border-radius:1px;background:#3f3f46}
@keyframes bulb{50%{opacity:.35;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.xmas-lights i,.to-ball,.to-ic,.tl,.wreath .fl{animation:none!important}}
/* Startseite */
.xmas-home{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.4rem;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,#dc2626 7%,var(--surface)),color-mix(in srgb,#15803d 8%,var(--surface)))!important;border:1.5px solid color-mix(in srgb,#dc2626 25%,var(--line))!important;position:relative;overflow:hidden}
.xh-wreath .wreath{width:190px;height:auto;display:block}
.wreath .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
.wreath .glow{animation:glowP 1.8s ease-in-out infinite}
@keyframes flick{to{transform:scale(.9,1.08) skewX(4deg)}}
@keyframes glowP{50%{opacity:.6}}
.xh-main{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.xh-main h2{margin:0}
.xmas-cd{font-variant-numeric:tabular-nums}
.xmas-btn{background:linear-gradient(135deg,#dc2626,#b91c1c)!important;color:#fff!important;border-color:transparent!important}
.xh-tree{width:200px;text-align:center}
.xh-tree .eyebrow{margin:0 0 .3rem}
.xh-hint{font-size:.78rem;margin:.2rem 0 0}
.xtree{position:relative;width:180px;height:234px;margin:0 auto}
.xtree svg{width:100%;height:100%;display:block}
.to-ball{position:absolute;width:13px;height:13px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--b);box-shadow:inset -2px -2px 3px rgba(0,0,0,.25),inset 2px 2px 3px rgba(255,255,255,.55);animation:sway 3s ease-in-out infinite;animation-delay:var(--d);transform-origin:50% -6px}
.to-ic{position:absolute;font-size:15px;line-height:1;margin:-8px 0 0 -8px;animation:sway 3.4s ease-in-out infinite;animation-delay:var(--d);transform-origin:50% 0}
.to-top{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:26px;animation:starTw 2s ease-in-out infinite}
.to-floor{position:absolute;left:0;right:0;bottom:-2px;display:flex;justify-content:center;gap:2px;font-size:22px}
.tl{animation:bulb 1.6s ease-in-out infinite;animation-delay:var(--d)}
@media (max-width:760px){.xmas-home{grid-template-columns:1fr;justify-items:center;text-align:center}.xh-main .row{justify-content:center}}
/* Shop */
.xmas-cat{background:linear-gradient(135deg,color-mix(in srgb,#dc2626 12%,var(--surface)),color-mix(in srgb,#15803d 12%,var(--surface)))!important}
.xmas-strip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;width:100%;font:inherit;text-align:left;cursor:pointer;color:#fff;border:0;border-radius:14px;padding:.75rem 1rem;background:linear-gradient(135deg,#b91c1c,#15803d)}
.xmas-strip span{opacity:.9}
.xmas-soon{background:linear-gradient(135deg,#7f1d1d,#14532d)!important}
.xmas-shop-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.2rem 1.4rem;border-radius:20px;color:#fff;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.18) 0 2px,transparent 3px) 0 0/40px 40px,linear-gradient(135deg,#991b1b,#166534)}
.xmas-shop-head .eyebrow{color:rgba(255,255,255,.85)}
.xs-cd{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.4rem)}
.xs-side{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;max-width:340px;text-align:right}
.xs-side .muted{color:rgba(255,255,255,.85)}
.xs-side .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;padding:1rem;border-radius:18px;background:linear-gradient(160deg,#7f1d1d,#450a0a);box-shadow:inset 0 0 0 3px rgba(250,204,21,.35)}
.door{position:relative;aspect-ratio:4/3;border-radius:12px;border:2px dashed rgba(250,204,21,.55);background:linear-gradient(145deg,#b91c1c,#991b1b);color:#fde68a;font:inherit;cursor:default;display:grid;place-items:center;padding:.2rem;overflow:hidden}
.door.big{grid-column:span 2;aspect-ratio:auto;background:linear-gradient(145deg,#15803d,#14532d)}
.door-n{font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,3vw,1.6rem);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.door.ready{cursor:pointer;border-style:solid;border-color:#facc15;animation:doorGlow2 1.6s ease-in-out infinite}
.door.ready:hover{transform:translateY(-2px)}
@keyframes doorGlow2{50%{box-shadow:0 0 0 4px rgba(250,204,21,.35),0 0 22px rgba(250,204,21,.55)}}
.door:disabled:not(.open){opacity:.75}
.door.open{background:#fff7ed;border:2px solid #fde68a;color:#7c2d12}
.door-in{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.66rem;line-height:1.1;text-align:center}
.door-in small{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.xi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.xi-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .8rem;align-items:center;padding:.8rem .9rem;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.xi-card .row{grid-column:1/-1;justify-content:flex-end}
.xi-card.owned{border-color:color-mix(in srgb,#15803d 40%,var(--line))}
.xi-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,#dc2626 12%,var(--surface-2)),color-mix(in srgb,#15803d 14%,var(--surface-2)))}
.xo-ic{font-size:1.6rem;line-height:1}
.xo-ball{display:block;width:26px;height:26px;border-radius:50%;background:var(--b);box-shadow:inset -3px -3px 5px rgba(0,0,0,.25),inset 3px 3px 5px rgba(255,255,255,.55);position:relative}
.xo-ball::before{content:"";position:absolute;left:50%;top:-5px;width:8px;height:6px;margin-left:-4px;border-radius:2px;background:#a1a1aa}
.xo-sw{display:block;width:30px;height:30px;border-radius:50%}
.xo-logo{position:relative;display:inline-flex;transform:scale(1.15)}
.xo-logo svg:first-child{width:26px;height:26px}
.door .xo-ic{font-size:1.25rem}.door .xo-ball{width:18px;height:18px}.door .xo-sw{width:20px;height:20px}
.door-reveal{font-size:3rem;display:grid;place-items:center;margin:.4rem auto;animation:pop .5s}
.door-reveal .xo-ball{width:54px;height:54px}.door-reveal .xo-sw{width:58px;height:58px}.door-reveal .xo-ic{font-size:3.4rem}
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1rem 0}
.gift{min-height:120px;border-radius:16px;border:0;cursor:pointer;display:grid;place-items:center;background:none;font:inherit;padding:.5rem}
.gift .gbox{position:relative;width:76px;height:64px;border-radius:8px;background:hsl(var(--h) 75% 50%);box-shadow:0 6px 0 hsl(var(--h) 70% 35%);animation:wiggle 1.6s ease-in-out infinite}
.gift .gbox::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#facc15}
.gift .gbox::after{content:"";position:absolute;left:-6px;right:-6px;top:-12px;height:16px;border-radius:6px;background:hsl(var(--h) 75% 58%);box-shadow:inset 0 0 0 0 #000,0 0 0 0 #000;background-image:linear-gradient(90deg,transparent 41%,#facc15 41% 59%,transparent 59%)}
.gift.open{display:flex;flex-direction:column;gap:.4rem;align-items:center;background:color-mix(in srgb,#facc15 14%,var(--surface));border-radius:16px;animation:pop .45s;text-align:center}
.gift.open .xo-ic{font-size:2.4rem}.gift.open .xo-ball{width:40px;height:40px}.gift.open .xo-sw{width:42px;height:42px}
.gap-de{display:inline-block;font-size:.72rem;color:var(--muted);margin:0 .3rem 0 -.1rem;vertical-align:super}
@media (max-width:560px){.cal{padding:.6rem;gap:.35rem}.door{aspect-ratio:1}.xs-side{align-items:flex-start;text-align:left}}
html[data-shape="square"] :is(.cal,.door,.xi-card,.xi-ico,.xmas-shop-head,.xmas-strip){border-radius:4px}
.opt.picked{border-color:var(--g2);background:color-mix(in srgb,var(--g2) 12%,var(--surface))}
.bt-count{font-family:var(--f-display);font-weight:900;font-size:4.2rem;line-height:1;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:vsPulse 1s ease-in-out infinite;min-width:1.4em;text-align:center}
.bt-wait{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem}
.bt-after{min-height:1.6rem}
.bt-pop{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.bt-pop .gt-art.big{width:72px;height:72px;border-radius:22px}.bt-pop .gt-art.big .g-ico{width:36px;height:36px}
.vs-pick .online-dot{margin-left:-.2rem}
.sc-wrap{overflow-x:auto;margin:.2rem -.2rem 0;padding-bottom:.3rem}
.sec-chart{display:block;min-width:100%;font-family:var(--f-body)}
.sec-chart path,.sec-chart line,.sec-chart .sc-ylab,.sec-chart .sc-avgl{pointer-events:none}
.sc-grid{stroke:var(--line);stroke-width:1}
.sc-ylab,.sc-xsub{fill:var(--muted);font-size:11px}
.sc-xlab{fill:var(--ink);font-size:12.5px;font-weight:700}
.sc-avg{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5;opacity:.7}
.sc-avgl{fill:var(--muted);font-size:11px;font-weight:700}
.sc-line{fill:none;stroke:var(--brand);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.sc-pt{cursor:pointer;outline:none}
.sc-hit{fill:transparent}
.sc-dot{stroke:var(--surface);stroke-width:3;transition:r .15s}
.sc-pt:hover .sc-dot,.sc-pt:focus-visible .sc-dot,.sc-pt.on .sc-dot{r:10}
.sc-pt.on .sc-xlab{fill:var(--brand)}
.sc-val{fill:var(--ink);font-size:12px;font-weight:800}
.sc-row{cursor:pointer}.sc-row.on td{background:var(--brand-soft)}
.sc-bar{display:inline-block;vertical-align:middle;width:90px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-right:.5rem}
.sc-bar i{display:block;height:100%;border-radius:inherit}
.sc-note{font-size:.88rem;margin:.6rem 0 0}
.det-play{margin-left:.3rem;vertical-align:middle}.det-play .ico{width:16px;height:16px}

/* ---------- Black Friday: am Freitag nach dem 4. Donnerstag im November ist alles im Shop 50 % günstiger ---------- */
function blackFridayDate(year) {
  const d = new Date(year, 10, 1), firstThu = 1 + ((4 - d.getDay() + 7) % 7);
  return new Date(year, 10, firstThu + 21 + 1);
}
function bfPreview() { return isAdmin() && lsGet("vocabify:bfPreview") === "1"; }
function isBlackFriday() { return todayKey() === todayKey(blackFridayDate(new Date().getFullYear())) || bfPreview(); }
function bfDaysLeft() { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((blackFridayDate(t.getFullYear()) - t) / 86400000); }
function sale(p) { return isBlackFriday() && p > 0 ? Math.ceil(p / 2) : p; }
function priceHTML(base) { return isBlackFriday() && base > 0 ? `${COIN}<s class="old-price">${base}</s><span class="bf-price">${sale(base)}</span>` : `${COIN}${base}`; }
function bfBanner(where) {
  const n = bfDaysLeft();
  if (isBlackFriday()) {
    const end = new Date(); end.setHours(24, 0, 0, 0);
    const h = Math.floor((end - Date.now()) / 3600000), m = Math.floor((end - Date.now()) / 60000) % 60;
    return `<${where === "home" ? 'button data-act="nav" data-v="shop"' : "div"} class="bf-banner live"><span class="bf-tag">BLACK FRIDAY</span><span class="bf-txt"><b>Alles im Shop −50 %</b><span>Haustiere, Accessoires, Gestaltung und Ladescreens. Nur noch heute, ${h} Std. ${m} Min.</span></span>${where === "home" ? `<span class="bf-go">Zum Shop →</span>` : ""}</${where === "home" ? "button" : "div"}>`;
  }
  if (where === "shop" && n > 0 && n <= 7) {
    const d = blackFridayDate(new Date().getFullYear()).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    return `<div class="bf-banner soon"><span class="bf-tag">BLACK FRIDAY</span><span class="bf-txt"><b>${n === 1 ? "Morgen" : `In ${n} Tagen`}: alles im Shop −50 %</b><span>Am ${d}. Spar deine Münzen!</span></span></div>`;
  }
  return "";
}

/* ---------- storage: cloud db when available, else this browser ---------- */
const Store = {
  db: null, auth: null, cloud: false, chains: {}, err: null,
  async init() {
    try {
      if (!window.firebase) throw new Error("sdk");
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      if (window.VOCABIFY_EMULATOR) { this.db.useEmulator("127.0.0.1", 8080); this.auth.useEmulator("http://127.0.0.1:9099"); }
      await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      this.cloud = true;
    } catch (e) { this.cloud = false; this.err = e; }
  },
  ref(c, id) { return this.db.collection(c).doc(id); },
  _chain(key, fn) {
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(fn);
    this.chains[key] = p;
    return p;
  },
  async get(c, id) { const s = await this.ref(c, id).get(); return s.exists ? s.data() : null; },
  set(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).set(clone(data))); },
  update(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).update(clone(data))); },
  del(c, id) { return this._chain(c + "/" + id, () => this.ref(c, id).delete()); },
  async list(c, field, value) {
    let q = this.db.collection(c);
    if (field) q = q.where(field, "==", value);
    const snap = await q.limit(1000).get();
    return snap.docs.map(d => Object.assign(d.data(), { id: d.id }));
  },
  batch(ops) {
    const b = this.db.batch();
    for (const [type, c, id, data] of ops) {
      if (type === "set") b.set(this.ref(c, id), clone(data));
      else if (type === "update") b.update(this.ref(c, id), clone(data));
      else b.delete(this.ref(c, id));
    }
    return b.commit();
  }
};

function bumpHist(correct) {
  const d = todayKey();
  const h = Array.isArray(S.me.hist) ? S.me.hist : (S.me.hist = []);
  let e = h.find(x => x.d === d);
  if (!e) { e = { d, c: 0, a: 0 }; h.push(e); }

  h.sort((x, y) => x.d < y.d ? -1 : 1);

function histDays(acc, n) {
  const map = {}; (Array.isArray(acc.hist) ? acc.hist : []).forEach(e => { map[e.d] = e; });
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(); dt.setHours(12, 0, 0, 0); dt.setDate(dt.getDate() - i);
    const k = todayKey(dt); const e = map[k] || {};
    out.push({ d: k, date: dt, c: +e.c || 0, a: +e.a || 0 });
  }
  return out;
}
function lastSeenText(ts) {
  if (!ts) return { t: "noch nie", now: false };
  const diff = Date.now() - ts;
  if (diff < 3 * 60000) return { t: "online", now: true };
  if (diff < 60 * 60000) return { t: "vor " + Math.round(diff / 60000) + " Min.", now: false };
  const d = new Date(ts), today = todayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (todayKey(d) === today) return { t: "heute, " + time, now: false };
  if (todayKey(d) === todayKey(y)) return { t: "gestern, " + time, now: false };
  const days = Math.floor(diff / 86400000);
  return { t: days < 7 ? "vor " + days + " Tagen" : d.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" }), now: false };
}

function lbBack(label) { return `<div class="row"><button class="btn small ghost" data-act="lbOpen" data-k="home">← ${label || "Lernbereich"}</button></div>`; }
function lbTopicView(t) {
  const q = S.lb.quiz && S.lb.quiz.id === t.id ? S.lb.quiz : (S.lb.quiz = { id: t.id, ans: {}, order: t.quiz.map((_, i) => i) });
  const answered = Object.keys(q.ans).length, right = Object.entries(q.ans).filter(([i, a]) => t.quiz[i][2] === a).length;
  const items = q.order.map((qi, n) => {
    const [text, opts, correct, expl] = t.quiz[qi], a = q.ans[qi], done = a != null;
    return `<li class="gq${done ? (a === correct ? " ok" : " no") : ""}"><p class="gq-q"><span class="gq-n">${n + 1}</span>${esc(text)}</p>
      <div class="gq-opts">${opts.map((o, oi) => `<button class="gq-opt${done && oi === correct ? " right" : ""}${done && oi === a && a !== correct ? " wrong" : ""}" data-act="lbAnswer" data-q="${qi}" data-o="${oi}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
      ${done ? `<p class="gq-ex">${a === correct ? "✓ Richtig. " : "✗ Leider falsch. "}${esc(expl)}</p>` : ""}</li>`;
  }).join("");
  const finished = answered === t.quiz.length;
  return `${lbBack()}
    <article class="card gram"><div class="gram-head"><span class="lb-ico big" aria-hidden="true">${t.ico}</span><div><p class="eyebrow">${t.id.startsWith("en") ? "Englisch · Grammatik" : t.id.startsWith("pr") ? "Französisch · Pronomen" : "Französisch · Grammatik"}</p><h2>${t.title}</h2><p class="muted">${t.sub}</p></div></div>
      <div class="gram-body">${t.body}</div></article>
    <section class="card"><div class="card-head"><h2>Übung</h2><span class="muted" style="font-size:.88rem">${answered ? `${right} von ${answered} richtig` : `${t.quiz.length} Fragen`}</span>
      ${answered ? `<span class="spacer"></span><button class="btn small" data-act="lbReset">Neu mischen</button>` : ""}</div>
      <ol class="gq-list">${items}</ol>
      ${finished ? `<div class="fb ${right === t.quiz.length ? "right" : "wrong"}" role="status"><span>${right === t.quiz.length ? "Alles richtig, stark!" : `${right} von ${t.quiz.length} richtig. Lies dir die Erklärung oben noch einmal durch und versuch es erneut.`}</span><span class="spacer"></span><button class="btn small" data-act="lbReset">Nochmal</button></div>` : ""}
    </section>`;
}

function wikiView() {
  if (S.openArticle) return articleView();

    L.refilled = false;
