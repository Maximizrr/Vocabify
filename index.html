<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocabify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Merriweather:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with nav, single centered column (max 1080px), cards only for working areas; fixed version label bottom-left; pet stage overlays the start page. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#e4eaf1; --ink:#162030; --muted:#566377; --line:#d3dbe6;
  --brand:#284b7a; --brand-soft:#dfe7f3; --check:#2f9e5b;
  --en:#cf3d35; --la:#2c9455; --fr:#e3880b;
  --en-soft:#fbe4e2; --la-soft:#dff2e6; --fr-soft:#fcecd2;
  --coin:#d99a0b; --coin-soft:#fbf0d2; --good:#2c9455; --bad:#c9372f; --warn:#b97606;
  --wood:#a86b3c; --wood-2:#c98a52; --metal:#e0b63c;
  --shadow:0 1px 2px rgba(22,32,48,.06),0 6px 20px -8px rgba(22,32,48,.18);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --acc:var(--brand); --acc-soft:var(--brand-soft); --on-acc:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#18202b; --surface-2:#212b38; --ink:#e7edf5; --muted:#9aa7ba; --line:#2c3746;
  --brand:#8fb1e6; --brand-soft:#22324a; --check:#4cc27e;
  --en:#f06b60; --la:#4cc27e; --fr:#f4a93a;
  --en-soft:#3a2120; --la-soft:#1b3326; --fr-soft:#3a2c14;
  --coin:#f2bd3d; --coin-soft:#3a3016; --good:#4cc27e; --bad:#f06b60; --warn:#f4a93a;
  --wood:#8a5630; --wood-2:#a96e3f; --metal:#d9ad35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  --on-acc:#0f141b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#18202b; --surface-2:#212b38; --ink:#e7edf5; --muted:#9aa7ba; --line:#2c3746;
  --brand:#8fb1e6; --brand-soft:#22324a; --check:#4cc27e;
  --en:#f06b60; --la:#4cc27e; --fr:#f4a93a;
  --en-soft:#3a2120; --la-soft:#1b3326; --fr-soft:#3a2c14;
  --coin:#f2bd3d; --coin-soft:#3a3016; --good:#4cc27e; --bad:#f06b60; --warn:#f4a93a;
  --wood:#8a5630; --wood-2:#a96e3f; --metal:#d9ad35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  --on-acc:#0f141b;
  color-scheme:dark;
}
body[data-lang="en"]{--acc:var(--en);--acc-soft:var(--en-soft)}
body[data-lang="la"]{--acc:var(--la);--acc-soft:var(--la-soft)}
body[data-lang="fr"]{--acc:var(--fr);--acc-soft:var(--fr-soft)}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.55em 1.05em;border-radius:12px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:.35em .75em;font-size:.88rem;border-radius:10px}
.btn.big{padding:.8em 1.4em;font-size:1.05rem;border-radius:14px}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field label{font-weight:700;font-size:.88rem}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.6em .8em;min-width:0}
.input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea.input{resize:vertical;min-height:7rem;line-height:1.5}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* app shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.45rem;font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--brand);letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:38px;height:32px}
.nav{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;order:3;width:100%}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;padding:.45em .85em;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:.85em;right:.85em;bottom:2px;height:3px;border-radius:3px;background:var(--acc)}
.badge{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;padding:0 .3em;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;margin-left:.3em;vertical-align:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.coin-pill{display:inline-flex;align-items:center;gap:.4em;background:var(--coin-soft);color:var(--ink);font-weight:800;padding:.3em .8em .3em .4em;border-radius:99px;font-variant-numeric:tabular-nums}
.coin{width:1.25em;height:1.25em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,var(--coin) 60%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--coin) 70%,#7a5200);display:inline-block;flex:none}
.user-chip{font-weight:700;font-size:.9rem;color:var(--muted)}
@media (min-width:820px){.nav{order:0;width:auto}}

main{max-width:1080px;margin:0 auto;padding-block:1.6rem 5rem;padding-inline:16px;display:flex;flex-direction:column;gap:1.4rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.3rem;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.version{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:.15em .6em;border-radius:99px;z-index:40;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:.3rem;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:.6em .9em;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:.8rem;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:2rem;padding-inline:16px}
.login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.4rem}
.logo-big{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.logo-big svg{width:150px;height:125px}
.logo-big .word{font-family:var(--f-display);font-weight:800;font-size:2.6rem;color:var(--brand);letter-spacing:-.02em;line-height:1}
.logo-big .tag{color:var(--muted);font-size:.95rem}
.logo-check{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .9s .25s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.login form{display:flex;flex-direction:column;gap:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
.note{background:var(--surface-2);border-radius:12px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted)}

/* home */
.hello{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.15rem;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--check);border-radius:99px;transition:width .5s}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

.path{position:relative;padding:3.2rem .5rem 2.6rem;overflow-x:auto}
.path-inner{position:relative;min-width:520px;height:18px;margin:0 30px}
.track{position:absolute;inset:4px 0;border-radius:99px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 12px,transparent 12px 18px);border:1.5px dashed var(--line)}
.track-fill{position:absolute;left:0;top:4px;bottom:4px;border-radius:99px;background:var(--check);transition:width .6s}
.marker{position:absolute;top:-34px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:.78rem;padding:.12em .55em;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:left .6s}
.marker::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.milestone{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.25rem}
.chest{width:62px;height:54px;border:0;background:none;padding:0;cursor:default;position:relative}
.chest svg{width:100%;height:100%;overflow:visible}
.chest .lid{transform-origin:6px 18px;transition:transform .5s}
.chest.locked svg{filter:grayscale(1);opacity:.55}
.chest.ready{cursor:pointer;animation:wiggle 1.6s ease-in-out infinite}
.chest.ready::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--coin) 45%,transparent),transparent 70%);z-index:-1}
.chest.open .lid{transform:rotate(-28deg)}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}85%{transform:rotate(7deg)}95%{transform:rotate(-3deg)}}
.ms-label{position:absolute;top:100%;margin-top:.15rem;font-size:.78rem;font-weight:800;color:var(--muted);white-space:nowrap;text-align:center}
.ms-label b{color:var(--coin)}

/* learn config */
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.32em .85em;font-weight:700;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.lang-dot{width:.65em;height:.65em;border-radius:50%;display:inline-block;flex:none}
.lang-dot.en{background:var(--en)}.lang-dot.la{background:var(--la)}.lang-dot.fr{background:var(--fr)}
.lang-tag{display:inline-flex;align-items:center;gap:.35em;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2em .6em;border-radius:6px}
.lang-tag.en{background:var(--en-soft);color:var(--en)}.lang-tag.la{background:var(--la-soft);color:var(--la)}.lang-tag.fr{background:var(--fr-soft);color:var(--fr)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:var(--surface);padding:.5em .9em;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc-soft);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:.8rem .9rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.2rem}
.mode b{font-family:var(--f-display);font-size:1.05rem}
.mode span{font-size:.85rem;color:var(--muted)}
.mode em{font-style:normal;font-size:.8rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.mode[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.cfg{display:flex;flex-direction:column;gap:1.2rem}
.cfg-group{display:flex;flex-direction:column;gap:.5rem}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:1rem}
.quiz-word{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,6vw,3rem);line-height:1.1;overflow-wrap:anywhere;padding:.6rem 0}
.quiz form{display:flex;gap:.6rem;flex-wrap:wrap}
.quiz form .input{flex:1 1 220px;font-size:1.15rem;padding:.75em 1em}
.fb{border-radius:14px;padding:.85rem 1rem;font-weight:700;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.fb.right{background:var(--la-soft);color:var(--good)}
.fb.wrong{background:var(--en-soft);color:var(--bad)}
.fb .sol{color:var(--ink);font-weight:800}
.coin-pop{display:inline-flex;align-items:center;gap:.3em;color:var(--coin);animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.quiz.shake .input{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}
.rate{display:inline-block;min-width:3.2em;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* sections grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
.sec-card{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.sec-card:hover{border-color:var(--ink)}
.sec-card h3{overflow-wrap:anywhere}
.sec-card .meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem;align-items:end}
.add-row.four{grid-template-columns:1fr 1fr auto auto}
@media (max-width:600px){.add-row,.add-row.four{grid-template-columns:1fr}}
.panel{border:1.5px dashed var(--line);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.scan-thumb{max-height:220px;max-width:100%;width:auto;height:auto;align-self:flex-start;object-fit:contain;border-radius:10px;border:1px solid var(--line)}
.invite{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.invite .who{flex:1;min-width:200px}
.inline-confirm{display:inline-flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.9rem}

/* shop */
.shop-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.shop-head .coin-pill{margin-left:auto;font-size:1.15rem;padding:.4em 1em .4em .5em}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.pet-card{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.pet-card .ava{width:76px;height:76px;border-radius:22px;background:var(--surface-2);display:grid;place-items:center;font-size:44px;line-height:1}
.pet-card p{font-size:.88rem;color:var(--muted);flex:1}
.pet-card .price{display:flex;align-items:center;gap:.35em;font-weight:800;font-variant-numeric:tabular-nums}
.pet-card.owned{border-color:var(--check)}
.owned-list{display:flex;gap:.6rem;flex-wrap:wrap}
.own{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:.5rem .8rem .5rem .5rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;font-weight:700}
.own .e{font-size:28px;width:40px;height:40px;display:grid;place-items:center;background:var(--surface-2);border-radius:12px}
.own[aria-pressed="true"]{border-color:var(--check);box-shadow:0 0 0 3px color-mix(in srgb,var(--check) 25%,transparent)}

/* wiki */
.art-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem}
.art-card{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:1.1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.art-card:hover{border-color:var(--ink)}
.art-card h3{font-size:1.2rem;overflow-wrap:anywhere}
.art-card .ex{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art-meta{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-weight:700;align-items:center}
.status{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2em .55em;border-radius:6px}
.status.pending{background:var(--fr-soft);color:var(--warn)}
.status.approved{background:var(--la-soft);color:var(--good)}
.status.rejected{background:var(--en-soft);color:var(--bad)}
.article{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:1rem;width:100%}
.article h1{font-size:clamp(1.8rem,5vw,2.6rem)}
.article .body{font-size:1.05rem;line-height:1.7;display:flex;flex-direction:column;gap:.9rem;overflow-wrap:anywhere}
.article .body h2{font-size:1.4rem;margin-top:.6rem}
.article .body ul{margin:0;padding-left:1.3rem}
.article .body figure{margin:0}
.article .body figure img{border-radius:12px;border:1px solid var(--line)}
.article .sources{border-top:1px solid var(--line);padding-top:1rem;font-size:.88rem;color:var(--muted)}
.article .sources ol{margin:.4rem 0 0;padding-left:1.3rem;overflow-wrap:anywhere}
.font-sans{font-family:var(--f-body)}
.font-serif{font-family:"Merriweather",Georgia,serif}
.font-serif .body{font-size:1rem}
.font-hand{font-family:"Caveat","Comic Sans MS",cursive}
.font-hand .body{font-size:1.45rem;line-height:1.45}
.font-round{font-family:var(--f-display)}
.like{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:.45em 1em;font-weight:800;cursor:pointer;display:inline-flex;gap:.45em;align-items:center}
.like[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);background:var(--en-soft)}
.like svg{width:1.1em;height:1.1em}

/* ---------- storage: cloud db when available, else this browser ---------- */
const Store = {
  db: null, auth: null, cloud: false, chains: {}, err: null,
  async init() {
    try {
      if (!window.firebase) throw new Error("sdk");
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      if (window.VOCABIFY_EMULATOR) { this.db.useEmulator("127.0.0.1", 8080); this.auth.useEmulator("http://127.0.0.1:9099"); }
      await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      this.cloud = true;
    } catch (e) { this.cloud = false; this.err = e; }
  },
  ref(c, id) { return this.db.collection(c).doc(id); },
  _chain(key, fn) {
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(fn);
    this.chains[key] = p;
    return p;
  },
  async get(c, id) { const s = await this.ref(c, id).get(); return s.exists ? s.data() : null; },
  set(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).set(clone(data))); },
  update(c, id, data) { return this._chain(c + "/" + id, () => this.ref(c, id).update(clone(data))); },
  del(c, id) { return this._chain(c + "/" + id, () => this.ref(c, id).delete()); },
  async list(c, field, value) {
    let q = this.db.collection(c);
    if (field) q = q.where(field, "==", value);
    const snap = await q.limit(1000).get();
    return snap.docs.map(d => Object.assign(d.data(), { id: d.id }));
  },
  batch(ops) {
    const b = this.db.batch();
    for (const [type, c, id, data] of ops) {
      if (type === "set") b.set(this.ref(c, id), clone(data));
      else if (type === "update") b.update(this.ref(c, id), clone(data));
      else b.delete(this.ref(c, id));
    }
    return b.commit();
  }
};

/* activity: last online + learning history (last 60 days) */

function bumpHist(correct) {
  const d = todayKey();
  const h = Array.isArray(S.me.hist) ? S.me.hist : (S.me.hist = []);
  let e = h.find(x => x.d === d);
  if (!e) { e = { d, c: 0, a: 0 }; h.push(e); }
  e.a++; if (correct) e.c++;
  h.sort((x, y) => x.d < y.d ? -1 : 1);
  while (h.length > 60) h.shift();
  S.me.totalAnswered = (S.me.totalAnswered || 0) + 1;
  S.me.lastSeen = Date.now();
}
function histDays(acc, n) {
  const map = {}; (Array.isArray(acc.hist) ? acc.hist : []).forEach(e => { map[e.d] = e; });
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(); dt.setHours(12, 0, 0, 0); dt.setDate(dt.getDate() - i);
    const k = todayKey(dt); const e = map[k] || {};
    out.push({ d: k, date: dt, c: +e.c || 0, a: +e.a || 0 });
  }
  return out;
}
function lastSeenText(ts) {
  if (!ts) return { t: "noch nie", now: false };
  const diff = Date.now() - ts;
  if (diff < 3 * 60000) return { t: "online", now: true };
  if (diff < 60 * 60000) return { t: "vor " + Math.round(diff / 60000) + " Min.", now: false };
  const d = new Date(ts), today = todayKey(), y = new Date(); y.setDate(y.getDate() - 1);
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (todayKey(d) === today) return { t: "heute, " + time, now: false };
  if (todayKey(d) === todayKey(y)) return { t: "gestern, " + time, now: false };
  const days = Math.floor(diff / 86400000);
  return { t: days < 7 ? "vor " + days + " Tagen" : d.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" }), now: false };
}

function authErrorText(e) {

  if (c.includes("too-many-requests")) return "Zu viele Versuche. Warte ein paar Minuten und versuche es dann noch einmal.";
  if (c.includes("network")) return "Keine Internetverbindung. Prüfe dein WLAN oder deine mobilen Daten.";

  return "Anmeldung gerade nicht möglich. Versuche es gleich noch einmal.";
}
async function doLogin(form) {
  const u = form.username.value.trim().toLowerCase();
  const p = form.password.value;
  S.loginErr = "";
  try {
    const login = u && validUsername(u) ? await Store.get(C.logins, u) : null;
    if (!login || !login.email) { S.loginErr = "Benutzername oder Passwort stimmt nicht."; render(); return; }
    const cred = await Store.auth.signInWithEmailAndPassword(login.email, p);
    const acc = await accountForUser(cred.user);
    if (!acc) { await Store.auth.signOut(); S.loginErr = "Dieses Konto wurde deaktiviert. Frag deinen Admin."; render(); return; }
    await enterApp(acc);
  } catch (e) { S.loginErr = authErrorText(e); render(); }
}
function validUsername(u) { return /^[a-z0-9._-]{3,24}$/.test(u); }
function newEmail(u) { return u + "." + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + "@" + EMAIL_DOMAIN; }
function accountDoc(username, role, userId) {
  return { username, role, uid: userId, coins: 0, pets: [], activePet: null, daily: freshDaily(), totalCorrect: 0, totalAnswered: 0,
    hist: [], settings: {}, lastSeen: 0, createdAt: Date.now() };

let secondaryAuth = null;
/* creates a login without signing the admin out (second Firebase instance) */
async function createAuthUser(email, password) {
  if (!secondaryAuth) {
    const app = firebase.apps.find(a => a.name === "secondary") || firebase.initializeApp(FIREBASE_CONFIG, "secondary");
    secondaryAuth = app.auth();
    if (window.VOCABIFY_EMULATOR) secondaryAuth.useEmulator("http://127.0.0.1:9099");
    await secondaryAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  }
  const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
  const newUid = cred.user.uid;
  await secondaryAuth.signOut();
  return newUid;
}
async function makeAccount(username, password, role) {
  const email = newEmail(username);
  const newUid = await createAuthUser(email, password);
  const acc = accountDoc(username, role, newUid);
  await Store.batch([["set", C.roles, newUid, { username, role }], ["set", C.logins, username, { email }], ["set", C.acc, username, acc]]);
  return acc;
}
async function doSetup(form) {
  const u = form.username.value.trim().toLowerCase(), p = form.password.value;
  if (!validUsername(u)) { S.loginErr = "Benutzername: 3–24 Zeichen, nur a–z, 0–9, Punkt, Minus, Unterstrich."; render(); return; }
  if (p.length < 6) { S.loginErr = "Das Passwort braucht mindestens 6 Zeichen."; render(); return; }
  try {
    const email = newEmail(u);
    const cred = await Store.auth.createUserWithEmailAndPassword(email, p);
    const myUid = cred.user.uid;
    const acc = accountDoc(u, "admin", myUid);
    try {
      await Store.batch([["set", C.roles, myUid, { username: u, role: "admin" }], ["set", C.logins, u, { email }], ["set", C.acc, u, acc],
        ["set", C.meta, "config", { setupAt: Date.now(), admin: u }]]);
    } catch (e) {
      try { await cred.user.delete(); } catch {}
      S.loginErr = "Die App ist bereits eingerichtet. Melde dich mit deinem Konto an."; await showLogin(); return;
    }
    await enterApp(acc);
    seedStarterArticles(u);
    toast("Admin-Konto angelegt. Willkommen!");
  } catch (e) { S.loginErr = "Einrichtung fehlgeschlagen. Prüfe, ob in Firebase „E-Mail/Passwort“ aktiviert ist."; render(); }
}

function allVocab(secIds) {
  const out = [];

    if (secIds && secIds.length && !secIds.includes(s.id)) continue;
    for (const v of s.vocab || []) out.push({ s, v });

  return out;
}
/* selected sections, or every section of the chosen language */
function effSecs(secs, lang) {
  if (secs && secs.length) return secs;
  if (!lang) return null;
  const ids = S.sections.filter(s => s.lang === lang).map(s => s.id);
  return ids.length ? ids : ["-"];
}
function usedLangs() { return Object.keys(LANGS).filter(l => S.sections.some(s => s.lang === l)); }
function langPicker(act, cur) {
  const langs = usedLangs();
  if (langs.length < 2 && !cur) return "";
  return `<div class="chips" role="group" aria-label="Sprache">
    <button class="chip" data-act="${act}" data-k="" aria-pressed="${!cur}">Alle Sprachen</button>
    ${langs.map(l => { const n = S.sections.filter(s => s.lang === l).length;
      return `<button class="chip" data-act="${act}" data-k="${l}" aria-pressed="${cur === l}"><span class="lang-dot ${l}"></span>${LANGS[l].name}<span class="muted num" style="font-weight:600">${n}</span></button>`; }).join("")}
  </div>`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function poolFor(mode, secIds) {
  let items = allVocab(secIds);
  if (mode === "older") items = items.filter(x => (x.v.r || 0) + (x.v.w || 0) >= 3);
  if (mode === "errors") items = items.filter(x => (x.v.w || 0) > 0 && x.v.w / ((x.v.r || 0) + x.v.w) >= 0.3)
    .sort((a, b) => b.v.w / (b.v.r + b.v.w) - a.v.w / (a.v.r + a.v.w));
  if (mode === "newest") items = items.sort((a, b) => (b.v.added || 0) - (a.v.added || 0)).slice(0, 20);
  return items;
}
const MACRON = { "ā": "a", "ē": "e", "ī": "i", "ō": "o", "ū": "u", "ȳ": "y" };
function norm(s) {
  return String(s || "").toLowerCase().normalize("NFC").replace(/[āēīōūȳ]/g, m => MACRON[m])
    .replace(/\([^)]*\)|\[[^\]]*\]/g, " ")
    .replace(/[.!?¿¡"„“”'’`´…]/g, " ").replace(/\s+/g, " ").trim();
}
const ARTICLE_RE = /^(the|to|a|an|der|die|das|den|dem|ein|eine|einen|sich|le|la|les|l|un|une|des|se|s)\s+/;
function stripArt(s) { let p; do { p = s; s = s.replace(ARTICLE_RE, ""); } while (s !== p); return s; }
function variants(sol) {
  const base = String(sol || "").replace(/\([^)]*\)/g, " ");
  return base.split(/[,;\/]|\s+oder\s+|\s+or\s+|\s+ou\s+/i).map(norm).filter(Boolean).concat([norm(sol)]);
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function checkAnswer(given, sol) {
  const g = norm(given);
  if (!g) return { ok: false };
  const vs = variants(sol);
  for (const v of vs) if (g === v || stripArt(g) === stripArt(v)) return { ok: true };
  const plain = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
  for (const v of vs) if (plain(stripArt(g)) === plain(stripArt(v))) return { ok: true, typo: true };
  for (const v of vs) { const sv = stripArt(v); if (sv.length >= 6 && lev(stripArt(g), sv) <= 1) return { ok: true, typo: true }; }
  return { ok: false };
}

/* ---------- learning ---------- */
function newRound(extra) {
  return Object.assign({ mode: S.cfg.mode, dir: S.cfg.dir, secs: effSecs(S.cfg.secs, S.cfg.lang), size: S.cfg.size, n: 0, right: 0, cur: null, state: "ask", last: null,
    coin: false, typo: false, coinsEarned: 0, wrongs: [], finished: false, startedAt: Date.now(), queue: null, retry: false }, extra || {});
}
function repeatWrongs() {
  const prev = S.learn; if (!prev) return;
  const q = shuffle(prev.wrongs.filter(w => { const s = S.sections.find(x => x.id === w.sid); return s && s.vocab.some(v => v.id === w.vid); }).map(w => ({ sid: w.sid, vid: w.vid })));
  if (!q.length) { toast("Keine falschen Vokabeln zum Wiederholen."); return; }
  S.learn = newRound({ mode: prev.mode, dir: prev.dir, secs: prev.secs, size: q.length, queue: q, retry: true });
  window.scrollTo({ top: 0 });
  nextQuestion();
}
function startLearning() {
  const pool = poolFor(S.cfg.mode, effSecs(S.cfg.secs, S.cfg.lang));
  if (!pool.length) { toast("Für diesen Modus gibt es noch keine passenden Vokabeln."); return; }
  S.learn = newRound();
  window.scrollTo({ top: 0 });
  nextQuestion();
}
function nextQuestion() {
  const L = S.learn; if (!L || L.finished) return;
  clearTimeout(L.timer);
  if (L.size && L.n >= L.size) { finishLearning(); return; }
  if (L.queue) {
    let item = null;
    while (L.queue.length && !item) {
      const q = L.queue.shift(); const s = S.sections.find(x => x.id === q.sid); const v = s && s.vocab.find(x => x.id === q.vid);
      if (v) item = { s, v };
    }
    if (!item) { finishLearning(); return; }
    const dir = L.dir === "mix" ? (Math.random() < .5 ? "f2d" : "d2f") : L.dir;
    L.cur = { sid: item.s.id, vid: item.v.id, dir };
    L.state = "ask"; L.given = ""; L.coin = false; L.typo = false; L.last = item.v.id;
    render(); return;
  }
  const pool = poolFor(L.mode, L.secs);
  if (!pool.length) { finishLearning(); return; }
  let cands = pool.length > 1 ? pool.filter(x => x.v.id !== L.last) : pool;
  if (L.mode === "errors") cands = cands.slice(0, Math.max(5, Math.ceil(cands.length / 2)));
  const pick = cands[Math.floor(Math.random() * cands.length)];
  const dir = L.dir === "mix" ? (Math.random() < .5 ? "f2d" : "d2f") : L.dir;
  L.cur = { sid: pick.s.id, vid: pick.v.id, dir };
  L.state = "ask"; L.given = ""; L.coin = false; L.typo = false; L.last = pick.v.id;
  render();
}
function finishLearning() {
  const L = S.learn; if (!L) return;
  clearTimeout(L.timer);
  if (!L.n) { S.learn = null; render(); return; }
  L.finished = true; L.cur = null;
  flush(); render(); window.scrollTo({ top: 0 });
}
function leaveLearning() {
  const L = S.learn; if (L) clearTimeout(L.timer);
  S.learn = null; flush(); render(); window.scrollTo({ top: 0 });
}
function curItem() {
  const L = S.learn; if (!L || !L.cur) return null;
  const s = S.sections.find(x => x.id === L.cur.sid); if (!s) return null;
  const v = (s.vocab || []).find(x => x.id === L.cur.vid); if (!v) return null;
  return { s, v };
}
function registerCorrect(s, v) {
  ensureDay();
  const L = S.learn, d = S.me.daily;
  d.count++; S.me.totalCorrect = (S.me.totalCorrect || 0) + 1;
  const key = s.id + ":" + v.id;
  L.coin = false;
  if (!d.coined.includes(key)) { d.coined.push(key); S.me.coins = (S.me.coins || 0) + 1; L.coin = true; L.coinsEarned++; }
  L.right++;
  L.wrongs = L.wrongs.filter(x => x.vid !== v.id || x.counted);
  Pets.onCorrect(L.right);
  if (d.count === getGoal()) setTimeout(() => toast("Tagesziel erreicht! " + getGoal() + " Vokabeln heute."), 600);
  const reached = MILESTONES.find(m => d.count === m);
  if (reached) setTimeout(() => toast("Truhe bei " + reached + " Vokabeln freigeschaltet! Öffne sie im Lernpfad."), 300);
  markDirty("me");
}
function submitAnswer(val) {
  const L = S.learn, it = curItem(); if (!L || !it) return;
  const { s, v } = it;
  const sol = L.cur.dir === "f2d" ? v.d : v.f;
  const res = checkAnswer(val, sol);
  L.given = val; L.n++; v.lastSeen = Date.now();
  bumpHist(res.ok);
  if (res.ok) {
    v.r = (v.r || 0) + 1; L.state = "right"; L.typo = !!res.typo;
    registerCorrect(s, v);
    clearTimeout(L.timer);
    if (!res.typo) L.timer = setTimeout(() => { if (S.learn === L && L.state === "right") nextQuestion(); }, 1100);
  } else {
    v.w = (v.w || 0) + 1; L.state = "wrong";
    if (!L.wrongs.some(x => x.vid === v.id)) L.wrongs.push({ sid: s.id, vid: v.id });
  }
  markDirty("sec:" + s.id);
  render();
  if (!res.ok) { const q = $(".quiz"); if (q) { q.classList.add("shake"); setTimeout(() => q.classList.remove("shake"), 400); } }
}
function overrideCorrect() {
  const L = S.learn, it = curItem(); if (!L || !it || L.state !== "wrong") return;
  it.v.w = Math.max(0, (it.v.w || 1) - 1); it.v.r = (it.v.r || 0) + 1;
  L.state = "right"; L.typo = false;
  const he = (S.me.hist || []).find(x => x.d === todayKey()); if (he) he.c++;
  L.wrongs = L.wrongs.filter(x => x.vid !== it.v.id);
  registerCorrect(it.s, it.v);
  markDirty("sec:" + it.s.id);
  render();
  L.timer = setTimeout(() => { if (S.learn === L && L.state === "right") nextQuestion(); }, 900);
}
function openChest(m) {
  ensureDay();
  const d = S.me.daily;
  if (d.count < m || d.chests.some(c => c.t === m)) return;
  const r = Math.random();
  const amt = r < .5 ? 10 : r < .9 ? 20 : 50;
  d.chests.push({ t: m, amt });
  S.me.coins = (S.me.coins || 0) + amt;
  markDirty("me"); flush();
  render();
  openModal(`<div class="big-chest">${CHEST_SVG}</div>
    <h2>Truhe ${MILESTONES.indexOf(m) + 1} geöffnet</h2>
    <div class="reward">${COIN}+${amt}</div>
    <p class="muted">${amt === 50 ? "Jackpot! Das war die seltene 50er-Truhe." : "Weiter so, morgen wartet ein neuer Lernpfad."}</p>
    <button class="btn primary" data-act="closeModal">Einsammeln</button>`);
}

function greeting() {
  const name = displayName(), h = new Date().getHours();
  const c = S.me.daily.count, goal = getGoal(), streak = streakDays();
  const yest = histDays(S.me, 2)[0].c;
  const fresh = !(S.me.totalAnswered > 0) && !S.sections.length;
  const away = S.prevSeen && Date.now() - S.prevSeen > 3 * 86400000;
  let title;
  if (fresh) title = `Willkommen bei Vocabify, ${name}!`;
  else if (away) title = `Schön, dass du wieder da bist, ${name}!`;
  else if (h < 5) title = `Noch wach, ${name}?`;
  else if (h < 11) title = `Guten Morgen, ${name}!`;
  else if (h < 14) title = `Hallo ${name}!`;
  else if (h < 18) title = `Guten Tag, ${name}!`;
  else title = `Guten Abend, ${name}!`;
  let sub;
  const pet = S.me.activePet && PET_DEFS[S.me.activePet];
  if (fresh) sub = "Leg unter „Vokabeln“ deinen ersten Abschnitt an, tippe Wörter ein oder scanne ein Vokabelblatt. Dann kann es losgehen.";
  else if (c >= goal) sub = `Tagesziel geschafft: ${c} Vokabeln heute. Alles, was jetzt noch kommt, ist Bonus.`;
  else if (c > 0) sub = `Schon ${c} Vokabeln geschafft. Noch ${goal - c} bis zu deinem Tagesziel${goal - c <= 10 ? ", das schaffst du!" : "."}`;
  else if (streak >= 2) sub = `Du lernst seit ${streak} Tagen am Stück. Mit ein paar Vokabeln heute hältst du deine Serie am Leben.`;
  else if (yest > 0) sub = `Gestern hast du ${yest} Vokabeln geschafft. Heute warten ${goal} neue auf dich.`;
  else if (away) sub = `Deine Vokabeln haben auf dich gewartet${pet ? `, und ${pet.name === "Katze" || pet.name === "Schildkröte" ? "deine" : "dein"} ${pet.name} auch` : ""}. Starte mit einer kurzen Runde.`;
  else if (pet) sub = `${pet.name === "Katze" || pet.name === "Schildkröte" ? "Deine" : "Dein"} ${pet.name} ist bereit. Dein Ziel für heute: ${goal} Vokabeln.`;
  else sub = `Dein Ziel für heute: ${goal} Vokabeln. Eine kurze Runde reicht für den Anfang.`;
  return { title, sub, streak };
}

function pathView(c) {
  const pct = v => Math.min(100, v) + "%";
  const chests = MILESTONES.map((m, i) => {
    const opened = S.me.daily.chests.find(x => x.t === m);
    const cls = opened ? "open" : c >= m ? "ready" : "locked";
    const label = opened ? `<b>+${opened.amt}</b> erhalten` : c >= m ? "Antippen!" : `${m} Vokabeln`;
    return `<div class="milestone" style="left:${pct(m)}">
      <button class="chest ${cls}" ${cls === "ready" ? `data-act="chest" data-m="${m}" aria-label="Truhe ${i + 1} öffnen"` : `aria-label="Truhe ${i + 1}: ${opened ? "geöffnet" : "gesperrt"}" tabindex="-1"`}>${CHEST_SVG}</button>
      <span class="ms-label">${label}</span></div>`;
  }).join("");
  return `<div class="path"><div class="path-inner">
    <div class="track"></div><div class="track-fill" style="width:${pct(c)}"></div>

  </div></div>

}

function quizView() {
  const L = S.learn, it = curItem();
  if (!it) return `<div class="empty"><strong>Diese Vokabel gibt es nicht mehr.</strong><button class="btn" data-act="next">Weiter</button></div>`;
  const { s, v } = it;
  const f2d = L.cur.dir === "f2d";
  const prompt = f2d ? v.f : v.d;
  const sol = f2d ? v.d : v.f;
  const target = f2d ? "Deutsche" : LANGS[s.lang].name.replace(/isch$/, "ische");
  let fb = "";
  if (L.state === "right") {
    fb = `<div class="fb right" role="status">Richtig!${L.typo ? ` <span>Fast perfekt, achte auf die Schreibweise: <span class="sol">${esc(sol)}</span></span>` : ""}

      ${L.typo ? `<span class="spacer"></span><button class="btn small" id="nextBtn" data-act="next">Weiter</button>` : ""}</div>`;
  } else if (L.state === "wrong") {
    fb = `<div class="fb wrong" role="status"><span>Leider falsch. Richtig ist: <span class="sol">${esc(sol)}</span></span><span class="spacer"></span>
      <button class="btn small" data-act="override">Ich hatte recht</button>
      <button class="btn small primary" id="nextBtn" data-act="next">Weiter</button></div>`;
  }
  return `<div class="quiz">
    <div class="row">
      <span class="lang-tag ${s.lang}">${LANGS[s.lang].name}</span>
      <span class="muted" style="font-weight:700;font-size:.9rem">${esc(s.name)} · ${L.retry ? "Fehler wiederholen" : MODES[L.mode].name}</span>
      <span class="spacer"></span>
      <span class="num muted" style="font-weight:800">${L.right} / ${L.n} richtig</span>
    </div>
    <div><p class="eyebrow">Übersetze ins ${esc(target)}</p><div class="quiz-word">${esc(prompt)}</div></div>
    <form data-form="answer" autocomplete="off">
      <input class="input" id="answer" name="a" placeholder="Deine Antwort" autocapitalize="none" spellcheck="false" ${L.state !== "ask" ? `value="${esc(L.given)}" readonly` : ""} aria-label="Antwort">
      ${L.state === "ask" ? `<button class="btn primary big" type="submit">Prüfen</button>` : ""}
    </form>
    ${fb}

  </div>`;
}

/* wiki */
function md(text, images) {
  const used = new Set();
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  const blocks = String(text || "").replace(/\r/g, "").split(/\n{2,}/);
  let html = blocks.map(b => {
    const t = b.trim(); if (!t) return "";
    const im = t.match(/^\[Bild (\d+)\]$/);
    if (im) { const i = +im[1] - 1; if (images && images[i]) { used.add(i); return `<figure><img src="${images[i]}" alt="Bild ${i + 1}"></figure>`; } return ""; }
    if (t.startsWith("## ")) return `<h2>${inline(t.slice(3))}</h2>`;
    const lines = t.split("\n");
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^\s*[-•]\s+/, ""))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
  (images || []).forEach((src, i) => { if (!used.has(i)) html += `<figure><img src="${src}" alt="Bild ${i + 1}"></figure>`; });
  return html;
}

/* admin */
function sparkSvg(days, max) {
  const w = 10, gap = 3, h = 26;
  return `<svg class="spark" width="${days.length * (w + gap) - gap}" height="${h}" viewBox="0 0 ${days.length * (w + gap) - gap} ${h}" role="img" aria-label="Richtige Vokabeln der letzten ${days.length} Tage: ${days.map(d => d.c).join(", ")}">
    ${days.map((d, i) => { const bh = d.c ? Math.max(3, Math.round(d.c / max * (h - 2))) : 2;
      return `<rect class="${d.c ? (i === days.length - 1 ? "today" : "") : "zero"}" x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="2"><title>${d.date.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" })}: ${d.c} richtig</title></rect>`; }).join("")}
  </svg>`;
}
function userChart(acc) {
  const days = histDays(acc, 14);
  const max = Math.max(10, ...days.map(d => d.a));
  const nice = Math.ceil(max / 10) * 10;
  const W = 560, H = 190, pl = 30, pr = 8, pt = 18, pb = 34, bw = (W - pl - pr) / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  const ticks = [0, nice / 2, nice];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gelernte Vokabeln von ${esc(acc.username)} in den letzten 14 Tagen">
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    ${days.map((d, i) => {
      const x = pl + i * bw + bw * .18, w = bw * .64;
      const lab = d.date.toLocaleDateString("de-DE", { weekday: "short" }).slice(0, 2);
      return `${d.a ? `<rect class="b-all" x="${x}" y="${y(d.a)}" width="${w}" height="${y(0) - y(d.a)}" rx="3"><title>${d.a} beantwortet</title></rect>` : ""}
        ${d.c ? `<rect class="b-ok" x="${x}" y="${y(d.c)}" width="${w}" height="${y(0) - y(d.c)}" rx="3"><title>${d.c} richtig</title></rect>
        <text class="v" x="${x + w / 2}" y="${y(d.a || d.c) - 5}" text-anchor="middle">${d.c}</text>` : ""}
        <text x="${x + w / 2}" y="${H - 18}" text-anchor="middle">${lab}</text>
        <text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${d.date.getDate()}.</text>`;
    }).join("")}
  </svg></div>
  <div class="row" style="font-size:.82rem;color:var(--muted);gap:1rem"><span><span class="lang-dot" style="background:var(--check)"></span> richtig</span><span><span class="lang-dot" style="background:var(--surface-2);border:1px solid var(--line)"></span> beantwortet insgesamt</span></div>`;
}

async scanRun() {
    const sc = S.scan, s = S.sections.find(x => x.id === S.openSection);
    if (!sc || !sc.img || !s || sc.busy) return;
    sc.busy = true; sc.err = ""; sc.info = ""; sc.rows = null; sc.progress = "Bereite Foto vor…"; render();
    let worker = null;
    try {
      const canvas = await prepareImage(sc.img);
      sc.progress = "Lade Texterkennung…"; render();
      await loadScript(TESSERACT_URL);
      const langs = [{ en: "eng", la: "lat", fr: "fra" }[s.lang] || "eng", "deu"];
      sc.progress = "Lade Sprachdaten…"; render();
      let lastPct = -1;
      worker = await Tesseract.createWorker(langs, 1, { logger: m => {
        if (m.status === "recognizing text") { const pct = Math.round(m.progress * 100); if (pct !== lastPct && pct % 10 === 0) { lastPct = pct; sc.progress = "Lese Vokabeln… " + pct + " %"; render(); } }
      } });
      const { data } = await worker.recognize(canvas);
      sc.raw = String(data && data.text || "").trim();
      const res = VS.extract(data, s.lang, canvas.width, canvas.height);
      try { await worker.terminate(); } catch {}
      worker = null;
      /* zweite Lesung nur der deutschen Wörter (rein deutsche Erkennung, für richtige Umlaute) */
      const withBox = res.pairs.filter(p => p.dBox);
      if (withBox.length) {
        sc.progress = "Prüfe deutsche Wörter…"; render();
        worker = await Tesseract.createWorker("deu", 1);
        let n = 0;
        for (const p of withBox) {
          if (!S.scan || S.scan !== sc) break;
          const b = p.dBox, pad = Math.round((b.y1 - b.y0) * 0.35);
          const rect = { left: Math.max(0, b.x0 - pad), top: Math.max(0, b.y0 - pad), width: Math.min(canvas.width, b.x1 + pad) - Math.max(0, b.x0 - pad), height: Math.min(canvas.height, b.y1 + pad) - Math.max(0, b.y0 - pad) };
          try { const { data: d2 } = await worker.recognize(canvas, { rectangle: rect }); p.d = VS.refine(p.d, d2.text, true); } catch {}
          n++; if (n % 3 === 0) { sc.progress = `Prüfe deutsche Wörter… ${n}/${withBox.length}`; render(); }
        }
      }
      sc.rows = res.pairs.map(p => ({ f: p.f, d: p.d, on: true }));
      const book = /^pages/.test(res.mode);
      if (sc.rows.length) sc.info = `${sc.rows.length} Vokabel${sc.rows.length === 1 ? "" : "n"} erkannt${book ? " (Doppelseite erkannt, Erklärseite übersprungen)" : ""}. Lautschrift, Beispielsätze und Überschriften wurden ignoriert. Bitte kurz prüfen.`;
      else sc.err = sc.raw ? "Auf dem Foto wurden keine Vokabelpaare gefunden. Fotografiere die Liste möglichst gerade und nah, oder füge die Wörter unten selbst ein." : "Auf dem Foto wurde kein Text erkannt. Versuche ein schärferes Foto mit guter Beleuchtung.";
    } catch (e) {
      sc.err = "Die Texterkennung konnte nicht geladen werden. Prüfe deine Internetverbindung.";
    } finally {
      if (worker) { try { await worker.terminate(); } catch {} }
    }
    sc.busy = false; sc.progress = ""; render();
  },

async function importVocabFile(text, filename) {
  text = String(text).replace(/^﻿/, "");
  let name = "", lang = "";
  const body = [];
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^#\s*(Name|Sprache):\s*(.+)$/i);
    if (m) { if (/name/i.test(m[1])) name = m[2].trim(); else lang = m[2].trim().toLowerCase(); continue; }
    if (line.trim().startsWith("#")) continue;
    body.push(line);

  const rows = parseVocabText(body.join("\n"));
  if (!rows.length) { toast("In der Datei wurden keine Vokabeln gefunden."); return; }
  const now = Date.now();
  const sec = { id: uid(), owner: S.me.username, name: (name || String(filename).replace(/\.(vocab\.)?(txt|csv)$/i, "").replace(/_/g, " ") || "Import").slice(0, 60),
    lang: safeLang(lang), createdAt: now, vocab: rows.map((r, i) => ({ id: uid(), f: r.f, d: r.d, r: 0, w: 0, added: now + i })) };
  S.sections.push(sec); S.openSection = sec.id; S.vocabTab = "sections"; render();

}
/* ---------- Vokabel-Erkennung aus Tesseract-Daten ---------- */
/* Findet Zeilen und Spalten über die Wortpositionen, bestimmt welche Spalte Deutsch ist,
   und ignoriert Überschriften, Seitenzahlen, Lautschrift und Beispielsätze. */
const VS = (() => {
  const IPA = /[ˈˌːəɪʊɜɑɒɔæʌθðŋʃʒɛɐʔ]/;
  const HEAD = /^(unit|lektion|lesson|le[cç]on|unit[ée]|chapter|chapitre|kapitel|vocabulary|vocabulaire|vokabeln?|vokabeltest|vokabelliste|wortschatz|wörter|station|seite|page|name|klasse|datum|date|test|tipp|tip|exemple|example|beispiel|übung|exercise|aufgabe|total|summe|viel erfolg|good luck)\b/i;
  const DE_WORDS = /^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|sich|jdn|jdm|etw|und|oder|nicht|mit|von|zu|zum|zur|im|in|auf|für|aus)$/i;
  const LANG = {
    en: { words: /^(the|to|a|an|of|and|or|be|sb|sth|somebody|something|with|for|on|in|at|up|out|off)$/i, chars: /(th|sh|wh|ck|ea|oo|ow|ay|y\b|qu|ph)/i, end: /(ing|tion|ness|ful|less|ly|ed)$/i },
    fr: { words: /^(le|la|les|l|un|une|des|du|de|d|et|ou|à|au|aux|en|qn|qc|ne|pas|se|s)$/i, chars: /[éèêëàâçùûôîïœ]|(eau|oi|ou|qu|ai)/i, end: /(er|ir|re|eur|euse|ment|tion|té|ée|eux|elle)$/i },
    la: { words: /^(et|est|in|cum|ad|non|sed|-a|-um|-i|-ī|-ae|-is|n\.|m\.|f\.|adv\.|präp\.)$/i, chars: /[āēīōūȳ]|(ae|qu)/i, end: /(us|um|ae|is|ōris|oris|are|āre|ere|ēre|ire|īre|or|ō|o|ī|i|ās|ēs|em|ēs)$/i }
  };
  const words = s => s.split(/\s+/).filter(Boolean);
  const median = a => { if (!a.length) return 0; const b = a.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };

  /* Lautschrift [ˌɪndɪˈpendənt] und Seitenverweise (pp. 12/13) aus einer Zelle entfernen */
  function stripExtras(t) {
    let s = String(t || "");
    s = s.replace(/^\s*p{1,2}[.\-]?\s*\d{1,3}(\s*[\/–-]\s*\d{1,3})?\)?\s*/i, "");

  async article(f) {

function shrinkImage(file, maxW, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------- animated pets ---------- */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Pets = {
  stage: null, el: null, body: null, flipEl: null, id: null, def: null,
  x: 80, y: 0, dir: -1, tx: 0, ty: 0, mode: "idle", wait: 1, anim: null, busy: false, raf: 0, last: 0, visible: false,
  props: [], branches: [], bi: 0, actT: 3,
  setVisible(v) {
    if (!this.stage) this.stage = $("#petStage");
    this.visible = v; this.stage.hidden = !v;
    if (v && this.id && !this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.loop(t)); }
    if (!v && this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
  },
  unmount() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; this.id = null; if (this.stage) this.stage.innerHTML = ""; },
  W() { return innerWidth; }, H() { return innerHeight; },
  ground() { return this.H() - 96; },
  mount(id) {
    this.unmount();
    this.stage = $("#petStage"); this.id = id; this.def = PET_DEFS[id];
    this.stage.innerHTML = "";
    this.el = document.createElement("div"); this.el.className = "pet"; this.el.title = this.def.name + " (antippen!)";
    this.el.innerHTML = `<div class="pet-flip"><div class="pet-body">${this.def.e}</div></div>`;
    this.flipEl = this.el.firstChild; this.body = this.flipEl.firstChild;
    this.el.addEventListener("click", () => this.poke());
    this.buildProps();
    this.stage.append(this.el);
    this.x = Math.min(this.W() - 80, 40 + Math.random() * 200); this.y = this.ground(); this.mode = "idle"; this.wait = 1; this.anim = null; this.busy = false; this.actT = 4 + Math.random() * 4;
    const k = this.def.kind;
    if (k === "swim") { this.y = this.H() * .5; this.pickSwim(); }
    if (k === "climb") { this.x = this.trunkX - 22; this.y = this.trunkBottom - 60; this.ty = this.y; }
    if (k === "branch") { this.bi = 0; const b = this.branches[0]; this.x = b.x + b.w / 2 - 30; this.y = b.y - 54; }
    this.draw();
  },
  buildProps() {
    this.props.forEach(p => p.remove()); this.props = []; this.branches = [];
    const W = this.W(), H = this.H(), k = this.def.kind;
    if (k === "climb") {
      this.trunkX = W - 70; this.trunkTop = Math.max(140, H * .3); this.trunkBottom = H - 24;
      const t = document.createElement("div"); t.className = "prop branch-v";
      Object.assign(t.style, { left: this.trunkX + "px", top: this.trunkTop + "px", height: (this.trunkBottom - this.trunkTop) + "px" });
      for (let i = 0; i < 4; i++) { const l = document.createElement("span"); l.className = "leaf"; Object.assign(l.style, { left: (i % 2 ? 12 : -20) + "px", top: (20 + i * 50) + "px", transform: `rotate(${i % 2 ? -20 : 200}deg)` }); t.append(l); }
      this.stage.append(t); this.props.push(t);
    }
    if (k === "branch") {
      const ys = [H * .42, H * .26, H * .5];
      const xs = [W * .04, W * .4, W * .72];
      for (let i = 0; i < 3; i++) {
        const w = Math.min(170, W * .24), b = { x: Math.min(xs[i], W - w - 8), y: Math.max(130, ys[i]), w };
        const el = document.createElement("div"); el.className = "prop branch-h";
        Object.assign(el.style, { left: b.x + "px", top: b.y + "px", width: w + "px" });
        const l = document.createElement("span"); l.className = "leaf"; Object.assign(l.style, { left: (w - 18) + "px", top: "-8px", transform: "rotate(-25deg)" }); el.append(l);
        this.stage.append(el); this.props.push(el); this.branches.push(b);
      }
    }
  },
  draw() {
    this.el.style.transform = `translate(${this.x}px,${this.y}px)`;
    const flip = !this.def.front && this.dir > 0;
    this.flipEl.style.transform = flip ? "scaleX(-1)" : "";
    this.el.classList.toggle("walking", this.mode === "move" && this.def.kind === "walk" && !this.busy);
  },
  mouth() { return { x: this.def.front ? this.x + 22 : (this.dir > 0 ? this.x + 50 : this.x - 6), y: this.y + 22 }; },
  fx(cls, html, x, y, ms, vars) {
    const el = document.createElement("div"); el.className = "fx " + cls; el.innerHTML = html || "";
    el.style.left = x + "px"; el.style.top = y + "px";
    if (vars) for (const k in vars) el.style.setProperty(k, vars[k]);
    this.stage.append(el); setTimeout(() => el.remove(), ms);
  },
  say(text) { this.fx("say", esc(text), this.x - 6, this.y - 34, 1700); },
  bodyAnim(cls, ms) {
    this.body.classList.remove("roll", "bounce", "munch", "raise", "sleep"); void this.body.offsetWidth;
    this.body.classList.add(cls); setTimeout(() => this.body.classList.remove(cls), ms);
  },
  doAct(a) {
    if (!this.id || this.busy) return;
    const m = this.mouth();
    const hold = ms => { this.busy = true; this.draw(); setTimeout(() => { this.busy = false; }, ms); };
    switch (a) {
      case "bark": this.say("Wuff!"); this.bodyAnim("bounce", 1000); hold(1000); break;
      case "roll": this.bodyAnim("roll", 900); hold(950); break;
      case "meow": this.say("Miau!"); hold(900); break;
      case "yarn": this.fx("yarn", "🧶", m.x + (this.dir > 0 ? 6 : -22), this.y + 30, 1900, { "--dx": (this.dir > 0 ? 110 : -110) + "px" }); setTimeout(() => this.bodyAnim("bounce", 1000), 500); hold(1800); break;
      case "bubbles": for (let i = 0; i < 5; i++) setTimeout(() => { const mm = this.mouth(); this.fx("bubble", "", mm.x, mm.y - 6, 2300, { "--dx": (Math.random() * 30 - 15) + "px" }); }, i * 260); break;
      case "wave": this.say("Hallo!"); this.bodyAnim("bounce", 1000); hold(1200); break;
      case "leaf": this.fx("emo", "🌿", m.x + 18, m.y - 6, 2100); this.bodyAnim("munch", 1800); hold(2000); break;
      case "sleep": this.fx("zzz", "Zzz", this.x + 40, this.y - 8, 2500); this.bodyAnim("sleep", 2600); hold(2700); break;
      case "banana": this.fx("emo", "🍌", m.x + (this.dir > 0 ? 0 : -6), m.y - 4, 2100); this.bodyAnim("munch", 1800); hold(2000); break;
      case "trumpet": this.say("Töröö!"); this.bodyAnim("raise", 900); hold(1100); break;
      case "spray": {
        this.bodyAnim("raise", 900);
        for (let i = 0; i < 10; i++) setTimeout(() => { const mm = this.mouth(); this.fx("drop", "", mm.x, mm.y - 10, 1200, { "--dx": ((this.dir > 0 ? 1 : -1) * (60 + Math.random() * 90)) + "px", "--up": (-40 - Math.random() * 50) + "px" }); }, i * 70);
        hold(1300); break;
      }
      case "bamboo": this.fx("emo", "🎋", m.x + 16, m.y - 2, 2600); this.bodyAnim("munch", 2400); hold(2600); break;
      case "croak": this.say("Quak!"); hold(900); break;
    }
  },
  poke() {
    if (this.id === "turtle") {
      if (this.busy) return;
      this.busy = true; this.mode = "idle";
      this.body.innerHTML = '<div class="shell" aria-hidden="true"></div>';
      this.draw();
      setTimeout(() => { if (this.id === "turtle") { this.body.textContent = this.def.e; this.busy = false; this.wait = 1.2; } }, 2600);
      return;
    }
    if (this.id === "kangaroo") { this.flip(); return; }
    const acts = this.def.acts.length ? this.def.acts : ["croak"];
    this.doAct(acts[Math.floor(Math.random() * acts.length)]);
  },
  onCorrect(n) {
    if (!this.id || !this.visible) return;
    if (this.id === "kangaroo" && n > 0 && n % 10 === 0) { setTimeout(() => this.flip(), 250); return; }
    if (!this.busy && this.def.kind !== "swim") this.bodyAnim("bounce", 1000);
  },
  flip() {
    if (this.busy && !this.anim) return;
    const W = this.W(), x0 = this.x, y0 = this.ground();
    const goRight = x0 < W / 2;
    const x1 = goRight ? W - 90 : 30;
    this.dir = goRight ? 1 : -1; this.busy = true; this.mode = "idle";
    this.say("Hopp!");
    const peak = Math.min(this.H() * .5, 340);
    this.anim = { t: 0, dur: REDUCED ? .01 : 1.5, step: p => {
      this.x = x0 + (x1 - x0) * p;
      this.y = y0 - Math.sin(Math.PI * p) * peak;
      const rot = (goRight ? -360 : 360) * Math.min(1, Math.max(0, (p - .15) / .7));
      this.body.style.transform = `rotate(${rot}deg)`;
    }, done: () => { this.body.style.transform = ""; this.busy = false; this.wait = 1; } };
  },
  pickSwim() { this.tx = 10 + Math.random() * (this.W() - 80); this.ty = 130 + Math.random() * Math.max(60, this.H() - 300); this.dir = this.tx > this.x ? 1 : -1; },
  loop(t) {
    this.raf = requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(.05, (t - this.last) / 1000); this.last = t;
    if (!this.id || !this.visible) return;
    if (this.anim) {
      this.anim.t += dt; const p = Math.min(1, this.anim.t / this.anim.dur);
      this.anim.step(p); this.draw();
      if (p >= 1) { const a = this.anim; this.anim = null; a.done && a.done(); }
      return;
    }
    if (this.busy || REDUCED) { this.draw(); return; }
    const k = this.def.kind, W = this.W();
    this.actT -= dt;
    if (k === "walk" || k === "hop") {
      if (this.mode === "idle") {
        this.y = this.ground();
        this.wait -= dt;
        if (this.actT <= 0 && this.def.acts.length) { this.actT = 5 + Math.random() * 6; this.doAct(this.def.acts[Math.floor(Math.random() * this.def.acts.length)]); }
        else if (this.wait <= 0) {
          this.tx = 10 + Math.random() * (W - 90); this.dir = this.tx > this.x ? 1 : -1; this.mode = "move";
          if (k === "hop") this.hopFrom = this.x, this.hopT = 0;
        }
      } else if (k === "walk") {
        this.x += this.dir * this.def.speed * dt; this.y = this.ground();
        if ((this.dir > 0 && this.x >= this.tx) || (this.dir < 0 && this.x <= this.tx)) { this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; }
      } else {
        const hopLen = Math.min(110, Math.abs(this.tx - this.hopFrom)) || 1;
        const hopDur = this.id === "frog" ? .55 : .5;
        this.hopT += dt;
        if (this.hopT < 0) { this.y = this.ground(); }
        else {
          const p = Math.min(1, this.hopT / hopDur);
          this.x = this.hopFrom + this.dir * hopLen * p;
          this.y = this.ground() - Math.sin(Math.PI * p) * (this.id === "frog" ? 70 : 55);
          if (p >= 1) {
            this.hopFrom = this.x; this.hopT = -(.12 + Math.random() * .25); this.y = this.ground();
            if ((this.dir > 0 && this.x >= this.tx - 2) || (this.dir < 0 && this.x <= this.tx + 2)) { this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; this.hopT = 0; }
          }
        }
      }
    } else if (k === "swim") {
      const dx = this.tx - this.x, dy = this.ty - this.y, dist = Math.hypot(dx, dy);
      if (dist < 6) this.pickSwim();
      else { this.x += dx / dist * this.def.speed * dt; this.y += dy / dist * this.def.speed * dt + Math.sin(t / 300) * .4; }
      if (this.actT <= 0) { this.actT = 3 + Math.random() * 4; this.doAct("bubbles"); }
    } else if (k === "climb") {
      this.x = this.trunkX - 22;
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.actT <= 0) { this.actT = 6 + Math.random() * 6; this.doAct(this.def.acts[Math.floor(Math.random() * this.def.acts.length)]); }
        else if (this.wait <= 0) { this.ty = this.trunkTop - 10 + Math.random() * (this.trunkBottom - this.trunkTop - 50); this.mode = "move"; }
      } else {
        const d = this.ty - this.y; const step = Math.sign(d) * this.def.speed * dt;
        if (Math.abs(d) <= Math.abs(step)) { this.y = this.ty; this.mode = "idle"; this.wait = 1.5 + Math.random() * 3; }
        else { this.y += step; this.body.style.transform = `rotate(${Math.sin(t / 160) * 6}deg)`; }
        if (this.mode === "idle") this.body.style.transform = "";
      }
    } else if (k === "branch") {
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.actT <= 0) { this.actT = 6 + Math.random() * 5; this.doAct("banana"); }
        else if (this.wait <= 0) {
          let nb = this.bi; while (nb === this.bi) nb = Math.floor(Math.random() * this.branches.length);
          const b = this.branches[nb], x0 = this.x, y0 = this.y, x1 = b.x + 10 + Math.random() * (b.w - 70), y1 = b.y - 54;
          this.dir = x1 > x0 ? 1 : -1; this.bi = nb;
          this.anim = { t: 0, dur: .9, step: p => { this.x = x0 + (x1 - x0) * p; this.y = y0 + (y1 - y0) * p - Math.sin(Math.PI * p) * 110; },
            done: () => { this.wait = 1.5 + Math.random() * 3; } };
        }
      }
    }
    this.draw();
  }
};
addEventListener("resize", () => {
  if (!Pets.id || !Pets.stage) return;
  Pets.buildProps();
  const k = Pets.def.kind;
  if (k === "walk" || k === "hop") { Pets.x = Math.min(Pets.x, Pets.W() - 80); Pets.y = Pets.ground(); }
  if (k === "branch") { const b = Pets.branches[Pets.bi]; Pets.x = b.x + 10; Pets.y = b.y - 54; }
  if (k === "climb") { Pets.y = Math.min(Math.max(Pets.y, Pets.trunkTop - 10), Pets.trunkBottom - 60); }
  Pets.draw();
});
