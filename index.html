      : `<div class="empty"><strong>Noch leer</strong><p>Tippe oben deine erste Vokabel ein oder scanne ein Vokabelblatt.</p></div>`}
  </section>`;
}
function scanPanel(s) {
  const sc = S.scan;
  const L = LANGS[s.lang];
  const on = sc.rows ? sc.rows.filter(r => r.on && r.f.trim() && r.d.trim()).length : 0;
  const preview = sc.rows && sc.rows.length ? `
    ${sc.info ? `<p class="fb right" style="font-weight:700">${esc(sc.info)}</p>` : ""}
    <div class="table-wrap"><table class="scan-table"><thead><tr><th></th><th>${L.name}</th><th>Deutsch</th><th></th></tr></thead><tbody>
      ${sc.rows.map((r, i) => `<tr class="${r.on ? "" : "off"}"><td><input type="checkbox" id="sr-c-${i}" data-act="scanToggle" data-i="${i}" ${r.on ? "checked" : ""} aria-label="Zeile übernehmen"></td>
        <td><input class="input${r.uf ? " unsure" : ""}" id="sr-f-${i}" data-scan="${i}" data-k="f" value="${esc(r.f)}"${r.uf ? ' title="Unsicher gelesen, bitte prüfen"' : ""}></td>
        <td><input class="input${r.ud ? " unsure" : ""}" id="sr-d-${i}" data-scan="${i}" data-k="d" value="${esc(r.d)}"${r.ud ? ' title="Unsicher gelesen, bitte prüfen"' : ""}></td>
        <td><button class="btn small ghost" data-act="scanRemove" data-i="${i}" aria-label="Zeile entfernen">✕</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="row"><button class="btn small" data-act="scanAddRow">+ Zeile</button><button class="btn small" data-act="scanSwap">Spalten tauschen</button><span class="spacer"></span>
      <button class="btn primary" data-act="scanSave" ${on ? "" : "disabled"}>${on} Vokabel${on === 1 ? "" : "n"} übernehmen</button></div>` : "";
  return `<div class="panel" style="margin-top:.8rem">
    <h3>Vokabelblatt scannen</h3>
    <div class="row">
        <label class="btn" for="scan-file">${sc.img ? "Anderes Foto" : "Foto aufnehmen oder wählen"}</label>
        <input type="file" id="scan-file" accept="image/*" hidden>
        ${sc.img ? `<button class="btn primary" data-act="scanRun" ${sc.busy ? "disabled" : ""}>${sc.busy ? `<span class="spinner"></span> ${esc(sc.progress || "Lese Vokabeln…")}` : "Vokabeln erkennen"}</button>` : ""}
      </div>
      ${sc.imgUrl ? `<img class="scan-thumb" src="${sc.imgUrl}" alt="Gewähltes Vokabelblatt">` : ""}
      <p class="muted" style="font-size:.85rem">Funktioniert mit Vokabellisten, ganzen Buchseiten (auch gewölbt oder schräg fotografiert) und Screenshots aus der Buch-App. Tipp: Seite möglichst flach und ganz aufs Bild, gutes Licht ohne Blitz-Spiegelung. Die Erkennung läuft kostenlos in deinem Browser und dauert bei einer Buchseite etwa 20 bis 60 Sekunden; beim ersten Scan werden einmalig 10 bis 20 MB Sprachdaten geladen.</p>
    ${sc.err ? `<p class="err">${esc(sc.err)}</p>` : ""}

      <div class="field" style="margin-top:.6rem"><label for="scan-text">Ein Paar pro Zeile</label>
        <textarea class="input" id="scan-text" placeholder="house – Haus&#10;school = Schule&#10;teacher	Lehrer">${esc(sc.text || "")}</textarea></div>
      <div class="row" style="margin-top:.6rem"><button class="btn" data-act="scanParse">Vokabeln erkennen</button></div>
    </details>
    ${sc.raw ? `<details class="paste"><summary>Gelesenen Rohtext anzeigen</summary><pre class="raw">${esc(sc.raw)}</pre></details>` : ""}
  </div>`;
}
function statsView() {
  if (S.statsLang && !S.sections.some(s => s.lang === S.statsLang)) S.statsLang = "";
  const items = allVocab(S.statsFilter === "all" ? effSecs([], S.statsLang) : [S.statsFilter]);
  const rows = items.map(({ s, v }) => ({ s, v, n: (v.r || 0) + (v.w || 0), q: (v.r || 0) + (v.w || 0) ? (v.w || 0) / ((v.r || 0) + (v.w || 0)) : -1 }))
    .sort((a, b) => b.q - a.q || b.n - a.n);
  const totR = items.reduce((a, x) => a + (x.v.r || 0), 0), totW = items.reduce((a, x) => a + (x.v.w || 0), 0);
  const opts = `<option value="all">Alle Abschnitte${S.statsLang ? " (" + LANGS[S.statsLang].name + ")" : ""}</option>` + S.sections.filter(s => !S.statsLang || s.lang === S.statsLang).map(s => `<option value="${s.id}" ${S.statsFilter === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("");
  const lp = langPicker("statsLang", S.statsLang);
  return `${lp ? `<div class="cfg-group"><span class="eyebrow">Sprache</span>${lp}</div>` : ""}
    <section class="stats">
      <div class="stat"><span class="l">Vokabeln</span><span class="v">${items.length}</span></div>
      <div class="stat"><span class="l">Richtig beantwortet</span><span class="v ok">${totR}</span></div>
      <div class="stat"><span class="l">Falsch beantwortet</span><span class="v no">${totW}</span></div>
    </section>
    <section class="card">
      <div class="card-head" style="align-items:center"><h2>Erfolge pro Vokabel</h2><span class="spacer"></span>
        <select class="input" id="stats-filter" data-change="statsFilter" style="width:auto;max-width:100%">${opts}</select></div>
      ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Vokabel</th><th>Deutsch</th><th>Abschnitt</th><th class="n">Richtig</th><th class="n">Falsch</th><th class="n">Fehlerquote</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td>${esc(x.v.f)}</td><td>${esc(x.v.d)}</td><td><span class="lang-dot ${x.s.lang}"></span> ${esc(x.s.name)}</td>
          <td class="n ok">${x.v.r || 0}</td><td class="n no">${x.v.w || 0}</td>
          <td class="n"><span class="rate" style="color:${x.q < 0 ? "var(--muted)" : x.q >= .5 ? "var(--bad)" : x.q >= .25 ? "var(--warn)" : "var(--good)"}">${x.q < 0 ? "–" : Math.round(x.q * 100) + " %"}</span></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><strong>Noch keine Statistik</strong><p>Sobald du lernst, siehst du hier für jede Vokabel, wie oft du richtig und falsch lagst.</p></div>`}
    </section>`;
}

/* wiki */
function md(text, images) {
  const used = new Set();
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  const blocks = String(text || "").replace(/\r/g, "").split(/\n{2,}/);
  let html = blocks.map(b => {
    const t = b.trim(); if (!t) return "";
    const im = t.match(/^\[Bild (\d+)\]$/);
    if (im) { const i = +im[1] - 1; if (images && images[i]) { used.add(i); return `<figure><img src="${images[i]}" alt="Bild ${i + 1}"></figure>`; } return ""; }
    if (t.startsWith("## ")) return `<h2>${inline(t.slice(3))}</h2>`;
    const lines = t.split("\n");
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${inline(l.replace(/^\s*[-•]\s+/, ""))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
  (images || []).forEach((src, i) => { if (!used.has(i)) html += `<figure><img src="${src}" alt="Bild ${i + 1}"></figure>`; });
  return html;
}
const FONTS = { sans: "Standard", serif: "Buch", hand: "Handschrift", round: "Rund" };

}

/* admin */
function sparkSvg(days, max) {
  const w = 10, gap = 3, h = 26;
  return `<svg class="spark" width="${days.length * (w + gap) - gap}" height="${h}" viewBox="0 0 ${days.length * (w + gap) - gap} ${h}" role="img" aria-label="Richtige Vokabeln der letzten ${days.length} Tage: ${days.map(d => d.c).join(", ")}">
    ${days.map((d, i) => { const bh = d.c ? Math.max(3, Math.round(d.c / max * (h - 2))) : 2;
      return `<rect class="${d.c ? (i === days.length - 1 ? "today" : "") : "zero"}" x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="2"><title>${d.date.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" })}: ${d.c} richtig</title></rect>`; }).join("")}
  </svg>`;
}
function userChart(acc) {
  const days = histDays(acc, 14);
  const max = Math.max(10, ...days.map(d => d.a));
  const nice = Math.ceil(max / 10) * 10;
  const W = 560, H = 190, pl = 30, pr = 8, pt = 18, pb = 34, bw = (W - pl - pr) / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  const ticks = [0, nice / 2, nice];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gelernte Vokabeln von ${esc(acc.username)} in den letzten 14 Tagen">
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    ${days.map((d, i) => {
      const x = pl + i * bw + bw * .18, w = bw * .64;
      const lab = d.date.toLocaleDateString("de-DE", { weekday: "short" }).slice(0, 2);
      return `${d.a ? `<rect class="b-all" x="${x}" y="${y(d.a)}" width="${w}" height="${y(0) - y(d.a)}" rx="3"><title>${d.a} beantwortet</title></rect>` : ""}
        ${d.c ? `<rect class="b-ok" x="${x}" y="${y(d.c)}" width="${w}" height="${y(0) - y(d.c)}" rx="3"><title>${d.c} richtig</title></rect>
        <text class="v" x="${x + w / 2}" y="${y(d.a || d.c) - 5}" text-anchor="middle">${d.c}</text>` : ""}
        <text x="${x + w / 2}" y="${H - 18}" text-anchor="middle">${lab}</text>
        <text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${d.date.getDate()}.</text>`;
    }).join("")}
  </svg></div>
  <div class="row" style="font-size:.82rem;color:var(--muted);gap:1rem"><span><span class="lang-dot" style="background:var(--check)"></span> richtig</span><span><span class="lang-dot" style="background:var(--surface-2);border:1px solid var(--line)"></span> beantwortet insgesamt</span></div>`;
}

async scanRun() {
    const sc = S.scan, s = S.sections.find(x => x.id === S.openSection);
    if (!sc || !sc.img || !s || sc.busy) return;
    sc.busy = true; sc.err = ""; sc.info = ""; sc.rows = null; sc.progress = "Bereite Foto vor…"; render();
    const workers = [];
    const step = (txt) => { sc.progress = txt; render(); };
    try {
      await new Promise(r => setTimeout(r, 30));
      const im = await prepareImage(sc.img);
      step("Lade Texterkennung…");
      await loadScript(TESSERACT_URL);
      const T = { en: "eng", fr: "fra", la: "lat" }[s.lang] || "eng";
      step("Lade Sprachdaten…");
      let lastPct = -1, phase = "Finde Aufbau der Seite…";
      const main = await Tesseract.createWorker([T, "deu"], 1, { logger: m => {
        if (m.status === "recognizing text") { const pct = Math.round(m.progress * 100); if (pct !== lastPct && pct % 20 === 0) { lastPct = pct; step(phase + " " + pct + " %"); } }
      } });
      workers.push(main);
      /* 1. Aufbau der Seite (Spalten, Kästen, Doppelseiten) aus dem Schwarz-Weiß-Bild */
      const { data } = await main.recognize(im.bin);
      sc.raw = String(data && data.text || "").trim();
      if (window.VOCABIFY_EMULATOR) window.__vsLast = { w: im.W, h: im.H, lines: (data.lines || []).map(l => ({ baseline: l.baseline, words: l.words.map(w => ({ text: w.text, bbox: w.bbox, confidence: w.confidence })) })) };
      const res = VS.extract(data, s.lang, im.W, im.H);
      let pairs = res.pairs;
      /* 2. jeden Vokabelblock (Fremdsprache + Deutsch) als Ganzes neu lesen */
      const blocks = res.blocks || [];
      for (let bi = 0; bi < blocks.length; bi++) {
        if (S.scan !== sc) break;
        phase = `Lese Vokabelblock ${bi + 1}/${blocks.length}…`; lastPct = -1; step(phase);
        const rect = VS.blockRect(blocks[bi], im.W, im.H);
        if (rect.width < 20 || rect.height < 10) continue;
        try { const { data: bd } = await main.recognize(im.gray, { rectangle: rect }); pairs = VS.mergeBlock(pairs, VS.fromBlock(bd, blocks[bi], s.lang), rect, s.lang); } catch {}
      }
      /* 3. Kontrolllesung jedes Worts in seiner eigenen Sprache */
      const jobs = [];
      for (const p of pairs) {
        if (p.dBox) jobs.push({ p, key: "d", box: p.dBox, german: true });
        if (p.fBox && (p.fConf || 0) < 88) jobs.push({ p, key: "f", box: p.fBox, german: false });
      }
      if (jobs.length && S.scan === sc) {
        phase = "Kontrolliere Wörter…"; step(phase);
        const wd = await Tesseract.createWorker("deu", 1); workers.push(wd);
        const wf = await Tesseract.createWorker(T, 1); workers.push(wf);
        let n = 0;
        const L = x => String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
        for (const j of jobs) {
          if (S.scan !== sc) break;
          const b = j.box, pad = Math.round((b.y1 - b.y0) * 0.3);
          const x0 = Math.max(0, b.x0 - pad), y0 = Math.max(0, b.y0 - pad);
          const rect = { left: x0, top: y0, width: Math.min(im.W, b.x1 + pad) - x0, height: Math.min(im.H, b.y1 + pad) - y0 };
          const oldT = j.p[j.key], oldC = j.key === "d" ? j.p.dConf : j.p.fConf;
          try {
            const { data: d2 } = await (j.german ? wd : wf).recognize(im.gray, { rectangle: rect });
            const nt = VS.refine(oldT, d2.text, j.german, oldC, d2.confidence, s.lang);
            const confirmed = nt !== oldT || (L(oldT).length >= 2 && L(d2.text).includes(L(oldT)));
            if (nt !== oldT) j.p[j.key] = nt;
            if (confirmed) { const c = Math.max(oldC || 0, d2.confidence); if (j.key === "d") j.p.dConf = c; else j.p.fConf = c; }
          } catch {}
          n++; if (n % 5 === 0) step(`Kontrolliere Wörter… ${Math.round(n / jobs.length * 100)} %`);
        }
      }
      sc.rows = pairs.map(p => ({ f: p.f, d: p.d, on: true, uf: (p.fConf || 0) < 60, ud: (p.dConf || 0) < 60 }));
      const book = /^pages/.test(res.mode);
      const unsure = sc.rows.filter(r => r.uf || r.ud).length;
      if (sc.rows.length) sc.info = `${sc.rows.length} Vokabel${sc.rows.length === 1 ? "" : "n"} erkannt und kontrolliert${book ? " (Doppelseite erkannt, Erklärseite übersprungen)" : ""}. Lautschrift, Beispielsätze, Lernhilfen und Überschriften wurden ignoriert.${unsure ? ` ${unsure} unsichere Stelle${unsure === 1 ? " ist" : "n sind"} gelb markiert.` : ""}`;
      else sc.err = sc.raw ? "Auf dem Foto wurden keine Vokabelpaare gefunden. Fotografiere die Liste möglichst gerade und nah, oder füge die Wörter unten selbst ein." : "Auf dem Foto wurde kein Text erkannt. Versuche ein schärferes Foto mit guter Beleuchtung.";
    } catch (e) {
      sc.err = "Die Texterkennung konnte nicht geladen werden. Prüfe deine Internetverbindung.";
    } finally {
      for (const w of workers) { try { await w.terminate(); } catch {} }
    }
    sc.busy = false; sc.progress = ""; render();
  },

   3. dünne, lange Tabellenlinien erkennen und entfernen (sie zerschneiden sonst die Wörter)

function prepareImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const long = Math.max(img.width, img.height);
        const sc = Math.max(0.5, Math.min(2.5, 3000 / long));
        const W = Math.round(img.width * sc), H = Math.round(img.height * sc);
        const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
        const gray = mk(), g = gray.getContext("2d", { willReadFrequently: true });
        g.imageSmoothingQuality = "high";
        g.drawImage(img, 0, 0, W, H);
        URL.revokeObjectURL(url);
        const id = g.getImageData(0, 0, W, H), d = id.data, n = W * H;
        const Y = new Float32Array(n), hist = new Uint32Array(256);
        for (let i = 0, p = 0; p < n; i += 4, p++) { const y = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000; Y[p] = y; hist[y | 0]++; }
        /* Bradley-Schwelle mit Integralbild */
        const win = Math.max(31, Math.floor(W / 16)), r = win >> 1, ii = new Float64Array((W + 1) * (H + 1));
        for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += Y[y * W + x]; ii[(y + 1) * (W + 1) + x + 1] = ii[y * (W + 1) + x + 1] + row; } }
        const B = new Uint8Array(n);
        for (let y = 0; y < H; y++) {
          const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
          for (let x = 0; x < W; x++) {
            const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
            const sum = ii[y1 * (W + 1) + x1] - ii[y0 * (W + 1) + x1] - ii[y1 * (W + 1) + x0] + ii[y0 * (W + 1) + x0];
            B[y * W + x] = Y[y * W + x] < sum / ((y1 - y0) * (x1 - x0)) * 0.75 ? 1 : 0;
          }
        }
        /* dünne waagrechte Linien: schwarze Pixel mit Dicke <= 5, die zu langen waagrechten Läufen gehören */
        const thin = new Uint8Array(n);
        for (let x = 0; x < W; x++) {
          let y = 0;
          while (y < H) {
            if (!B[y * W + x]) { y++; continue; }
            let e = y; while (e < H && B[e * W + x]) e++;
            if (e - y <= 5) for (let k = y; k < e; k++) thin[k * W + x] = 1;
            y = e;
          }
        }
        const L = Math.max(30, Math.floor(W / 70)), line = new Uint8Array(n);
        for (let y = 0; y < H; y++) {
          let x = 0;
          const on = xx => thin[y * W + xx] || (y > 0 && thin[(y - 1) * W + xx]) || (y < H - 1 && thin[(y + 1) * W + xx]);
          while (x < W) {
            if (!on(x)) { x++; continue; }
            let e = x; while (e < W && on(e)) e++;
            if (e - x >= L) for (let k = x; k < e; k++) if (thin[y * W + k]) line[y * W + k] = 1;
            x = e;
          }
        }
        /* Graubild: Kontrast strecken, Linien weiß */
        let lo = 0, hi = 255, acc = 0;
        while (lo < 255 && (acc += hist[lo]) < n * 0.01) lo++;
        acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.01) hi--;
        const span = Math.max(40, hi - lo);
        const bin = mk(), bg = bin.getContext("2d", { willReadFrequently: true }), bd = bg.createImageData(W, H);
        for (let p = 0, i = 0; p < n; p++, i += 4) {
          const v = line[p] ? 255 : Math.max(0, Math.min(255, (Y[p] - lo) * 255 / span));
          d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
          const b = B[p] && !line[p] ? 0 : 255;
          bd.data[i] = bd.data[i + 1] = bd.data[i + 2] = b; bd.data[i + 3] = 255;
        }
        g.putImageData(id, 0, 0); bg.putImageData(bd, 0, 0);
        res({ gray, bin, W, H });
      } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}
/* eingefügter Text: Zeilen mit Trennzeichen, Überschriften und Sätze werden übersprungen */
function smartParseText(text, lang) {
  const pairs = [];
  for (let line of String(text || "").split(/\n/)) {
    line = VS.cleanCell(line);
    if (!line) continue;
    const sp = VS.splitLine(line);
    if (!sp) continue;
    if (VS.kind(sp[0]) !== "word" || VS.kind(sp[1]) !== "word") continue;
    pairs.push(sp);
  }
  let votes = 0;
  for (const p of pairs) votes += (VS.deScore(p[1]) - VS.fScore(p[1], lang)) - (VS.deScore(p[0]) - VS.fScore(p[0], lang));
  return (votes < 0 ? pairs.map(p => [p[1], p[0]]) : pairs).map(p => ({ f: p[0], d: p[1], on: true }));
}
const loadedScripts = {};
function loadScript(src) {
  if (!loadedScripts[src]) loadedScripts[src] = new Promise((res, rej) => {
    const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => { delete loadedScripts[src]; rej(new Error("load")); };
    document.head.append(el);
  });
  return loadedScripts[src];
}
function parseVocabText(text) {
  const out = [];
  for (let line of String(text || "").split(/\n/)) {
    line = line.replace(/^\s*\d+[.)]\s*/, "").trim();
    if (!line) continue;
    let parts = line.split(/\t+|\s+[–—-]\s+|\s*=\s*|\s*:\s+|\s*;\s*|\s{2,}|\s*\|\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) {
      const toks = line.split(/\s+/);
      const art = toks.findIndex((t, i) => i > 0 && /^(der|die|das)$/i.test(t));
      if (art > 0) parts = [toks.slice(0, art).join(" "), toks.slice(art).join(" ")];
      else if (toks.length === 2) parts = toks;
    }
    if (parts.length >= 2) out.push({ f: parts[0], d: parts.slice(1).join(", "), on: true });
  }
  return out;
}

function shrinkImage(file, maxW, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

    }, done: () => { this.body.style.transform = ""; this.busy = false; this.wait = 1; } };
  },
  pickSwim() { this.tx = 10 + Math.random() * (this.W() - 80); this.ty = 130 + Math.random() * Math.max(60, this.H() - 300); this.dir = this.tx > this.x ? 1 : -1; },
  loop(t) {
    this.raf = requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(.05, (t - this.last) / 1000); this.last = t;
    if (!this.id || !this.visible) return;
    if (this.anim) {
      this.anim.t += dt; const p = Math.min(1, this.anim.t / this.anim.dur);
      this.anim.step(p); this.draw();
      if (p >= 1) { const a = this.anim; this.anim = null; a.done && a.done(); }
      return;
    }
    if (this.busy || REDUCED) { this.draw(); return; }
    const k = this.def.kind, W = this.W();
    this.actT -= dt;
    if (k === "walk" || k === "hop") {
      if (this.mode === "idle") {
        this.y = this.ground();
        this.wait -= dt;
        if (this.actT <= 0 && this.def.acts.length) { this.actT = 5 + Math.random() * 6; this.doAct(this.def.acts[Math.floor(Math.random() * this.def.acts.length)]); }
        else if (this.wait <= 0) {
          this.tx = 10 + Math.random() * (W - 90); this.dir = this.tx > this.x ? 1 : -1; this.mode = "move";
          if (k === "hop") this.hopFrom = this.x, this.hopT = 0;
        }
      } else if (k === "walk") {
        this.x += this.dir * this.def.speed * dt; this.y = this.ground();
        if ((this.dir > 0 && this.x >= this.tx) || (this.dir < 0 && this.x <= this.tx)) { this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; }
      } else {
        const hopLen = Math.min(110, Math.abs(this.tx - this.hopFrom)) || 1;
        const hopDur = this.id === "frog" ? .55 : .5;
        this.hopT += dt;
        if (this.hopT < 0) { this.y = this.ground(); }
        else {
          const p = Math.min(1, this.hopT / hopDur);
          this.x = this.hopFrom + this.dir * hopLen * p;
          this.y = this.ground() - Math.sin(Math.PI * p) * (this.id === "frog" ? 70 : 55);
          if (p >= 1) {
            this.hopFrom = this.x; this.hopT = -(.12 + Math.random() * .25); this.y = this.ground();
            if ((this.dir > 0 && this.x >= this.tx - 2) || (this.dir < 0 && this.x <= this.tx + 2)) { this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; this.hopT = 0; }
          }
        }
      }
    } else if (k === "swim") {
      const dx = this.tx - this.x, dy = this.ty - this.y, dist = Math.hypot(dx, dy);
      if (dist < 6) this.pickSwim();
      else { this.x += dx / dist * this.def.speed * dt; this.y += dy / dist * this.def.speed * dt + Math.sin(t / 300) * .4; }
      if (this.actT <= 0) { this.actT = 3 + Math.random() * 4; this.doAct("bubbles"); }
    } else if (k === "climb") {
      this.x = this.trunkX - 22;
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.actT <= 0) { this.actT = 6 + Math.random() * 6; this.doAct(this.def.acts[Math.floor(Math.random() * this.def.acts.length)]); }
        else if (this.wait <= 0) { this.ty = this.trunkTop - 10 + Math.random() * (this.trunkBottom - this.trunkTop - 50); this.mode = "move"; }
      } else {
        const d = this.ty - this.y; const step = Math.sign(d) * this.def.speed * dt;
        if (Math.abs(d) <= Math.abs(step)) { this.y = this.ty; this.mode = "idle"; this.wait = 1.5 + Math.random() * 3; }
        else { this.y += step; this.body.style.transform = `rotate(${Math.sin(t / 160) * 6}deg)`; }
        if (this.mode === "idle") this.body.style.transform = "";
      }
    } else if (k === "dragon") {
      this.dir = 1; this.y = this.ground();
      if (this.mode === "idle") { this.wait -= dt; if (this.wait <= 0) this.mode = "move"; }
      else {
        this.x += this.def.speed * dt;
        if (this.x > W + 10) this.x = -130;
        this.trailT -= dt;
        if (this.trailT <= 0) { this.trailT = .11; const p = this.dpt(32 + Math.random() * 22, 82 + Math.random() * 4); this.fx("gtrail", "✦", p.x, p.y, 1200); }
      }
      this.dustT -= dt;
      if (this.dustT <= 0) { this.dustT = .28; const p = this.dpt(4 + Math.random() * 5, 16 + Math.random() * 6); this.fx("gdust", "", p.x, p.y, 1300, { "--dx": (Math.random() * 16 - 8) + "px" }); }
      this.sparkT -= dt;
      if (this.sparkT <= 0) { this.sparkT = .45 + Math.random() * .4; const p = this.dpt(40 + Math.random() * 28, 14 + Math.random() * 20); this.fx("gspark", "", p.x, p.y, 1400, { "--dx": (Math.random() * 20 - 10) + "px" }); }
      if (this.actT <= 0) { this.actT = 5 + Math.random() * 4; this.mode = "idle"; this.wait = 1.6; Math.random() < .35 ? this.dragonLoop() : this.spread(); }
    } else if (k === "branch") {
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.actT <= 0) { this.actT = 6 + Math.random() * 5; this.doAct("banana"); }
        else if (this.wait <= 0) {
          let nb = this.bi; while (nb === this.bi) nb = Math.floor(Math.random() * this.branches.length);
          const b = this.branches[nb], x0 = this.x, y0 = this.y, x1 = b.x + 10 + Math.random() * (b.w - 70), y1 = b.y - 54;
          this.dir = x1 > x0 ? 1 : -1; this.bi = nb;
          this.anim = { t: 0, dur: .9, step: p => { this.x = x0 + (x1 - x0) * p; this.y = y0 + (y1 - y0) * p - Math.sin(Math.PI * p) * 110; },
            done: () => { this.wait = 1.5 + Math.random() * 3; } };
        }
      }
    }
    this.draw();
  }
};
addEventListener("resize", () => {
  if (!Pets.id || !Pets.stage) return;
  Pets.buildProps();
  const k = Pets.def.kind;
  if (k === "walk" || k === "hop") { Pets.x = Math.min(Pets.x, Pets.W() - 80); Pets.y = Pets.ground(); }
  if (k === "branch") { const b = Pets.branches[Pets.bi]; Pets.x = b.x + 10; Pets.y = b.y - 54; }
  if (k === "climb") { Pets.y = Math.min(Math.max(Pets.y, Pets.trunkTop - 10), Pets.trunkBottom - 60); }
  if (k === "dragon" && !Pets.anim) Pets.y = Pets.ground();
  Pets.draw();
});
addEventListener("pointermove", e => Pets.eyes(e.clientX, e.clientY), { passive: true });

boot();
</script>
