  },
  poke() {
    if (this.id === "turtle" && this.acc.has("tank")) { this.doAct("fire"); return; }
    if (this.id === "turtle") {
      if (this.busy) return;
      this.busy = true; this.mode = "idle";
      this.body.innerHTML = '<div class="shell" aria-hidden="true"></div>';
      this.draw();
      this.later(() => { this.body.innerHTML = this.bodyHTML; this.busy = false; this.wait = 1.2; }, 2600);
      return;
    }
    if (this.id === "kangaroo") { this.flip(); return; }
    if (this.id === "aurelius") { if (this.busy) return; const r = Math.random(); r < .4 ? this.dragonLoop() : r < .75 ? this.spread() : this.roar(); return; }
    const acts = this.actList.length ? this.actList : ["croak"];
    this.doAct(acts[Math.floor(Math.random() * acts.length)]);
  },
  onCorrect(n) {
    if (!this.id || !this.visible) return;
    if (this.id === "kangaroo" && n > 0 && n % 10 === 0) { setTimeout(() => this.flip(), 250); return; }
    if (this.id === "aurelius") { this.roar(); return; }
    if (!this.busy && this.def.kind !== "swim") this.bodyAnim("bounce", 1000);
  },
  flip() {
    if (this.busy && !this.anim) return;
    const W = this.W(), x0 = this.x, y0 = this.ground();
    const goRight = x0 < W / 2;
    const x1 = goRight ? W - 90 : 30;
    this.dir = goRight ? 1 : -1; this.busy = true; this.mode = "idle";
    this.say("Hopp!");
    const peak = Math.min(this.H() * .5, 340);
    this.anim = { t: 0, dur: REDUCED ? .01 : 1.5, step: p => {
      this.x = x0 + (x1 - x0) * p;
      this.y = y0 - Math.sin(Math.PI * p) * peak;
      const rot = (goRight ? -360 : 360) * Math.min(1, Math.max(0, (p - .15) / .7));
      this.body.style.transform = `rotate(${rot}deg)`;
    }, done: () => { this.body.style.transform = ""; this.busy = false; this.wait = 1; } };
  },
  pickSwim() { this.tx = 10 + Math.random() * (this.W() - 80); this.ty = 130 + Math.random() * Math.max(60, this.H() - 300); this.dir = this.tx > this.x ? 1 : -1; },
  loop(t) {
    this.raf = requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(.05, (t - this.last) / 1000); this.last = t;
    if (!this.id || !this.visible) return;
    if (this.bfly && this.bfly.el) {
      const f = this.bfly; f.flee = Math.max(0, f.flee - dt);
      const tx = this.x + 30 + 70 * Math.sin(t / 1100), ty = this.y - 60 + 22 * Math.sin(t / 420) - (f.flee > 0 ? 130 : 0);
      f.x += (tx - f.x) * Math.min(1, dt * (f.flee > 0 ? 4 : 1.6)); f.y += (ty - f.y) * Math.min(1, dt * (f.flee > 0 ? 4 : 1.6));
      f.el.style.transform = `translate(${f.x}px,${f.y}px)`;
    }
    if (this.anim) {
      this.anim.t += dt; const p = Math.min(1, this.anim.t / this.anim.dur);
      this.anim.step(p); this.draw();
      if (p >= 1) { const a = this.anim; this.anim = null; a.done && a.done(); }
      return;
    }
    if (this.busy || REDUCED) { this.draw(); return; }
    const k = this.def.kind, W = this.W();
    this.actT -= dt;
    if (k === "walk" || k === "hop") {
      if (this.mode === "idle") {
        this.y = this.ground();
        this.wait -= dt;
        if (this.goal && !this.goal.go) {
          this.goal.go = true; this.tx = this.goal.x; this.dir = this.tx > this.x ? 1 : -1; this.mode = "move";
          if (Math.abs(this.tx - this.x) < 3) { this.mode = "idle"; this.arrive(); }
          else if (k === "hop") this.hopFrom = this.x, this.hopT = 0;
        }
        else if (this.actT <= 0 && this.actList.length) { this.actT = 5 + Math.random() * 6; this.doAct(this.actList[Math.floor(Math.random() * this.actList.length)]); }
        else if (this.wait <= 0) {
          this.tx = 10 + Math.random() * (W - 90); this.dir = this.tx > this.x ? 1 : -1; this.mode = "move";
          if (k === "hop") this.hopFrom = this.x, this.hopT = 0;
        }
      } else if (k === "walk") {
        this.x += this.dir * this.def.speed * this.boost * dt; this.y = this.ground();
        if ((this.dir > 0 && this.x >= this.tx) || (this.dir < 0 && this.x <= this.tx)) { this.x = this.tx; this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; this.arrive(); }

        const shoes = this.acc.has("shoes"), hopLen = Math.min(shoes ? 160 : 110, Math.abs(this.tx - this.hopFrom)) || 1;

            this.hopFrom = this.x; this.hopT = -(.12 + Math.random() * .25); this.y = this.ground();
            if ((this.dir > 0 && this.x >= this.tx - 2) || (this.dir < 0 && this.x <= this.tx + 2)) { this.mode = "idle"; this.wait = .8 + Math.random() * 2.5; this.hopT = 0; this.arrive(); }
          }
        }

      else { this.x += dx / dist * this.def.speed * dt; this.y += dy / dist * this.def.speed * dt + (this.goal ? 0 : Math.sin(t / 300) * .4); }
      if (this.actT <= 0 && !this.goal) { this.actT = 3 + Math.random() * 4; this.doAct(this.actList[Math.floor(Math.random() * this.actList.length)]); }
    } else if (k === "climb") {
      this.x = this.trunkX - 22 - this.xOff;
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.goal && !this.goal.go) { this.goal.go = true; this.ty = this.goal.y; this.mode = "move"; }
        else if (this.actT <= 0) { this.actT = 6 + Math.random() * 6; this.doAct(this.actList[Math.floor(Math.random() * this.actList.length)]); }

      } else {
        const d = this.ty - this.y; const step = Math.sign(d) * this.def.speed * dt;

        else { this.y += step; this.body.style.transform = `rotate(${Math.sin(t / 160) * 6}deg)`; }
        if (this.mode === "idle") this.body.style.transform = "";

      this.dir = 1; this.y = this.ground();

        this.x += this.def.speed * dt;

        this.trailT -= dt;
        if (this.trailT <= 0) { this.trailT = .11; const p = this.dpt(32 + Math.random() * 22, 82 + Math.random() * 4); this.fx("gtrail", "✦", p.x, p.y, 1200); }
      }
      this.dustT -= dt;
      if (this.dustT <= 0) { this.dustT = .28; const p = this.dpt(4 + Math.random() * 5, 16 + Math.random() * 6); this.fx("gdust", "", p.x, p.y, 1300, { "--dx": (Math.random() * 16 - 8) + "px" }); }
      this.sparkT -= dt;
      if (this.sparkT <= 0) { this.sparkT = .45 + Math.random() * .4; const p = this.dpt(40 + Math.random() * 28, 14 + Math.random() * 20); this.fx("gspark", "", p.x, p.y, 1400, { "--dx": (Math.random() * 20 - 10) + "px" }); }
      if (this.actT <= 0) { this.actT = 5 + Math.random() * 4; this.mode = "idle"; this.wait = 1.6; Math.random() < .35 ? this.dragonLoop() : this.spread(); }
    } else if (k === "branch") {
      if (this.mode === "idle") {
        this.wait -= dt;
        if (this.actT <= 0) { this.actT = 6 + Math.random() * 5; this.doAct(this.actList[Math.floor(Math.random() * this.actList.length)]); }
        else if (this.wait <= 0) {
          let nb = this.bi; while (nb === this.bi) nb = Math.floor(Math.random() * this.branches.length);

          this.anim = { t: 0, dur: .9, step: p => { this.x = x0 + (x1 - x0) * p; this.y = y0 + (y1 - y0) * p - Math.sin(Math.PI * p) * 110; },
            done: () => { this.wait = 1.5 + Math.random() * 3; } };
        }

  }
};
addEventListener("resize", () => {
  if (!Pets.id || !Pets.stage) return;
  Pets.buildProps();
  const k = Pets.def.kind;
  if (k === "walk" || k === "hop") { Pets.x = Math.min(Pets.x, Pets.W() - 80); Pets.y = Pets.ground(); }
  if (k === "branch") { const b = Pets.branches[Pets.bi]; Pets.x = b.x + 10; Pets.y = b.y - 54; }
  if (k === "climb") { Pets.y = Math.min(Math.max(Pets.y, Pets.trunkTop - 10), Pets.trunkBottom - 60); }
