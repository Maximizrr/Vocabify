function quizView() {
  const L = S.learn, it = curItem();
  if (!it) return `<div class="empty"><strong>Diese Vokabel gibt es nicht mehr.</strong><button class="btn" data-act="next">Weiter</button></div>`;
  const { s, v } = it;
  const f2d = L.cur.dir === "f2d";
  const prompt = f2d ? v.f : v.d;
  const sol = f2d ? v.d : v.f;
  const target = f2d ? "Deutsche" : LANGS[s.lang].name.replace(/isch$/, "ische");
  let fb = "";
  if (L.state === "right") {
    fb = `<div class="fb right" role="status">Richtig!${L.typo ? ` <span>Fast perfekt, achte auf die Schreibweise.</span>` : ""}
      ${L.coin ? `<span class="coin-pop${L.coinAmt > 1 ? " rush" : ""}">${COIN}+${L.coinAmt || 1}${L.coinAmt > 1 ? " Goldrausch!" : ""}</span>` : `<span class="muted" style="font-weight:600">Heute schon belohnt</span>`}
      <span class="spacer"></span><button class="btn small" id="nextBtn" data-act="next">Weiter</button></div>
      ${allAnswers(L.given, sol, f2d ? "" : spkBtn(v.f, s.lang))}`;
  } else if (L.state === "wrong") {
    fb = `<div class="fb wrong" role="status"><span>Leider falsch. Richtig ist: <span class="sol">${esc(sol)}</span>${f2d ? "" : spkBtn(v.f, s.lang)}</span><span class="spacer"></span>
      <button class="btn small" data-act="override">Ich hatte recht</button>
      <button class="btn small primary" id="nextBtn" data-act="next">Weiter</button></div>`;
  }
  return `<div class="quiz">
    <div class="row">
      <span class="lang-tag ${s.lang}">${LANGS[s.lang].name}</span>
      <span class="muted" style="font-weight:700;font-size:.9rem">${esc(s.name)} · ${L.retry ? "Fehler wiederholen" : MODES[L.mode].name}</span>
      <span class="spacer"></span>
      <span class="num muted" style="font-weight:700">${L.right} / ${L.n} richtig</span>
    </div>
    <div><p class="eyebrow">Übersetze ins ${esc(target)}</p><div class="quiz-word">${esc(prompt)}${f2d ? spkBtn(v.f, s.lang, "big") : ""}</div></div>
    <form data-form="answer" autocomplete="off">
      <input class="input" id="answer" name="a" placeholder="Deine Antwort" autocapitalize="none" spellcheck="false" ${L.state !== "ask" ? `value="${esc(L.given)}" readonly` : ""} aria-label="Antwort">
      ${L.state === "ask" ? `<button class="btn primary big" type="submit">Prüfen</button>` : ""}
    </form>
    ${fb}
    <p class="muted" style="font-size:.85rem">Bisher bei dieser Vokabel: <span class="ok">${v.r || 0} richtig</span> · <span class="no">${v.w || 0} falsch</span>. Mehrere Lösungen trennst du in der Liste mit Komma.</p>
  </div>`;
}

        ${rows.map(x => `<tr><td>${esc(x.v.f)}</td><td>${esc(x.v.d)}</td><td><span class="lang-dot ${x.s.lang}"></span> ${esc(x.s.name)}</td>

  const rows = [0, 1, 2, 3, 4, 5].map(p => {

function vtRunView() {

/* admin */
function sparkSvg(days, max) {
  const w = 10, gap = 3, h = 26;
  return `<svg class="spark" width="${days.length * (w + gap) - gap}" height="${h}" viewBox="0 0 ${days.length * (w + gap) - gap} ${h}" role="img" aria-label="Richtige Vokabeln der letzten ${days.length} Tage: ${days.map(d => d.c).join(", ")}">
    ${days.map((d, i) => { const bh = d.c ? Math.max(3, Math.round(d.c / max * (h - 2))) : 2;
      return `<rect class="${d.c ? (i === days.length - 1 ? "today" : "") : "zero"}" x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="2"><title>${d.date.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" })}: ${d.c} richtig</title></rect>`; }).join("")}
  </svg>`;
}
function userChart(acc) {
  const days = histDays(acc, 14);
  const max = Math.max(10, ...days.map(d => d.a));
  const nice = Math.ceil(max / 10) * 10;
  const W = 560, H = 190, pl = 30, pr = 8, pt = 18, pb = 34, bw = (W - pl - pr) / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  const ticks = [0, nice / 2, nice];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gelernte Vokabeln von ${esc(acc.username)} in den letzten 14 Tagen">
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    ${days.map((d, i) => {
      const x = pl + i * bw + bw * .18, w = bw * .64;
      const lab = d.date.toLocaleDateString("de-DE", { weekday: "short" }).slice(0, 2);
      return `${d.a ? `<rect class="b-all" x="${x}" y="${y(d.a)}" width="${w}" height="${y(0) - y(d.a)}" rx="3"><title>${d.a} beantwortet</title></rect>` : ""}
        ${d.c ? `<rect class="b-ok" x="${x}" y="${y(d.c)}" width="${w}" height="${y(0) - y(d.c)}" rx="3"><title>${d.c} richtig</title></rect>
        <text class="v" x="${x + w / 2}" y="${y(d.a || d.c) - 5}" text-anchor="middle">${d.c}</text>` : ""}
        <text x="${x + w / 2}" y="${H - 18}" text-anchor="middle">${lab}</text>
        <text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${d.date.getDate()}.</text>`;
    }).join("")}
  </svg></div>
  <div class="row" style="font-size:.82rem;color:var(--muted);gap:1rem"><span><span class="lang-dot" style="background:var(--check)"></span> richtig</span><span><span class="lang-dot" style="background:var(--surface-2);border:1px solid var(--line)"></span> beantwortet insgesamt</span></div>`;
}

  const globalMax = Math.max(5, ...users.flatMap(u => week(u).map(d => d.c)));
  const vocabCount = u => S.allSections.filter(s => s.owner === u).reduce((n, s) => n + s.vocab.length, 0);
  const sel = users.find(u => u.username === S.adminUser);
  let detail = "";

    const days14 = histDays(sel, 14);
    const tA = +sel.totalAnswered || 0, tC = +sel.totalCorrect || 0;

    else act = `${self ? "" : `<button class="btn small" data-act="askConfirm" data-k="pw:${esc(sel.username)}">Passwort ändern</button>`}${self ? "" : ` <button class="btn small danger" data-act="askConfirm" data-k="u:${esc(sel.username)}">Löschen</button>`}`;

    detail = `<section class="card">
      <div class="card-head" style="align-items:center"><h2>${esc(sel.username)}</h2>
        <span class="online ${lastSeenText(sel.lastSeen).now ? "now" : ""}"><i></i>${lastSeenText(sel.lastSeen).t}</span><span class="spacer"></span>

      <div class="stats" style="margin-bottom:1rem">
        <div class="stat"><span class="l">Gelernt (14 Tage)</span><span class="v">${sum(days14, d => d.c)}</span><span class="l">an ${activeDays} von 14 Tagen aktiv</span></div>
        <div class="stat"><span class="l">Gesamt richtig</span><span class="v">${tC}</span><span class="l">${tA ? Math.round(tC / tA * 100) + " % Trefferquote" : "noch keine Antworten"}</span></div>
        <div class="stat"><span class="l">Vokabeln & Abschnitte</span><span class="v">${vocabCount(sel.username)}</span><span class="l">in ${S.allSections.filter(s => s.owner === sel.username).length} Abschnitten</span></div>
      </div>
      <h3 style="margin-bottom:.5rem">Letzte 14 Tage</h3>
      ${userChart(sel)}
      ${adminSessionsView(sel)}
      ${adminSectionsView(sel)}
      <div class="row" style="margin-top:1rem;border-top:1px solid var(--line);padding-top:1rem"><span class="muted" style="font-size:.88rem">Rolle: ${sel.role === "admin" ? "Admin" : "Nutzer"} · angelegt am ${fmtDate(sel.createdAt)}</span><span class="spacer"></span>${act}</div>
    </section>`;
  }
  const rows = users.map(u => {
    const ls = lastSeenText(u.lastSeen), wk = week(u);
    const tA = +u.totalAnswered || 0, tC = +u.totalCorrect || 0;
    const todayN = u.daily && u.daily.date === today ? +u.daily.count || 0 : 0;
    const self = u.username === S.me.username;
    return `<tr class="${S.adminUser === u.username ? "sel" : ""}">
      <td><button class="user-link" data-act="pickAdminUser" data-u="${esc(u.username)}">${esc(u.username)}</button>${self ? ' <span class="muted">(du)</span>' : ""}<br><span class="muted" style="font-size:.8rem">${u.role === "admin" ? "Admin" : "Nutzer"}</span></td>
      <td><span class="online ${ls.now ? "now" : ""}" title="${esc(fmtFull(u.lastSeen))}"><i></i>${ls.t}</span>${u.lastSeen ? `<br><span class="muted" style="font-size:.75rem">${esc(fmtFull(u.lastSeen))}</span>` : ""}</td>
      <td class="n">${todayN}</td>
      <td>${sparkSvg(wk, globalMax)}<span class="muted num" style="font-size:.8rem">${sum(wk, d => d.c)} in 7 Tagen</span></td>
      <td class="n">${tC}</td>
      <td class="n">${tA ? Math.round(tC / tA * 100) + " %" : "–"}</td>
      <td class="n">${vocabCount(u.username)}</td>
      <td class="n">${+u.coins || 0}</td></tr>`;
  }).join("");
  return `<section class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="stat"><span class="l">Nutzer</span><span class="v">${users.length}</span><span class="l">${onlineNow} gerade online</span></div>
      <div class="stat"><span class="l">Heute aktiv</span><span class="v">${activeToday}</span><span class="l">waren heute eingeloggt</span></div>
      <div class="stat"><span class="l">Heute gelernt</span><span class="v">${learnedToday}</span><span class="l">richtige Vokabeln, alle Nutzer</span></div>
      <div class="stat"><span class="l">Letzte 7 Tage</span><span class="v">${learnedWeek}</span><span class="l">richtige Vokabeln, alle Nutzer</span></div>
    </section>
    ${detail}
    <section class="card"><div class="card-head"><h2>Aktivität</h2><span class="muted" style="font-size:.88rem">Tippe auf einen Namen für Verlauf, Passwort und Löschen</span></div>

    ${rows}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Neues Konto anlegen</h2></div>
      <form data-form="newUser" class="add-row four">
        <div class="field"><label for="nu-name">Benutzername</label><input class="input" id="nu-name" name="username" required autocapitalize="none" spellcheck="false" placeholder="z. B. lena"></div>
        <div class="field"><label for="nu-pw">Passwort</label><input class="input" id="nu-pw" name="password" required minlength="6" placeholder="mind. 6 Zeichen"></div>
        <div class="field"><label for="nu-role">Rolle</label><select class="input" id="nu-role" name="role"><option value="user">Nutzer</option><option value="admin">Admin</option></select></div>
        <button class="btn primary" type="submit">Anlegen</button>
      </form>
      <p class="muted" style="font-size:.85rem;margin-top:.8rem">Nutzer können sich nicht selbst registrieren. Gib Benutzername und Passwort an die Person weiter.</p></section>`;
}
function adminView() {
  const pend = S.articles.filter(a => a.status === "pending");
  const tabs = [["users", `Nutzer (${S.accounts.length})`], ["review", `Freigaben (${pend.length})`], ["articles", "Alle Artikel"]]
    .map(([k, l]) => `<button role="tab" data-act="atab" data-k="${k}" aria-selected="${S.adminTab === k}">${l}</button>`).join("");
  let body = "";
  if (S.adminTab === "review") {
    body = pend.length ? `<div class="art-list">${pend.map(a => artCard(a, true)).join("")}</div>`
      : `<div class="empty"><strong>Alles erledigt</strong><p>Keine Artikel warten auf Freigabe.</p></div>`;
  } else if (S.adminTab === "articles") {
    const all = S.articles.slice().sort((a, b) => b.createdAt - a.createdAt);
    body = all.length ? `<div class="table-wrap"><table><thead><tr><th>Titel</th><th>Autor</th><th>Status</th><th class="n">Likes</th><th></th></tr></thead><tbody>
      ${all.map(a => `<tr><td><button class="btn small ghost" data-act="openArt" data-id="${a.id}" style="white-space:normal;text-align:left">${esc(a.title)}</button></td><td>${esc(a.author)}</td>
        <td><span class="status ${a.status}">${{ pending: "offen", approved: "frei", rejected: "abgelehnt" }[a.status]}</span></td><td class="n">${(a.likes || []).length}</td>
        <td class="n">${S.confirm === "a:" + a.id ? `<span class="inline-confirm"><button class="btn small danger solid" data-act="delArt" data-id="${a.id}">Löschen</button><button class="btn small" data-act="cancelConfirm">Nein</button></span>`
          : `<button class="btn small ghost" data-act="askConfirm" data-k="a:${a.id}">Löschen</button>`}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><strong>Noch keine Artikel</strong></div>`;
  } else {
    body = adminUsersView();
  }
  return `<div class="row"><h1>Admin</h1><span class="spacer"></span><button class="btn small" data-act="adminRefresh">Aktualisieren</button></div>
    <div class="tabs" role="tablist">${tabs}</div>${body}`;
}

async function importVocabFile(text, filename, target) {
  text = String(text).replace(/^﻿/, "");
  let name = "", lang = "";
  const body = [];
  for (const line of text.split(/\r?\n/)) {
    const m = line.match(/^#\s*(Name|Sprache):\s*(.+)$/i);
    if (m) { if (/name/i.test(m[1])) name = m[2].trim(); else { const l = m[2].trim().toLowerCase(); lang = /^(en|engl)/.test(l) ? "en" : /^(fr|franz)/.test(l) ? "fr" : /^(la|lat)/.test(l) ? "la" : l; } continue; }
    if (line.trim().startsWith("#")) continue;
    body.push(line);
  }
  /* VoCare-Format: "Fremdsprache ; Deutsch" – nur das erste " ; " trennt, alles danach ist die deutsche Bedeutung */
  const rows = [];
  for (const line of body) {
    const t = line.trim(); if (!t) continue;
    const k = t.search(/\s;\s/);
    if (k > 0) { const f = t.slice(0, k).trim(), d = t.slice(k).replace(/^\s;\s/, "").trim(); if (f && d) rows.push({ f, d, on: true }); }
    else rows.push(...parseVocabText(t));
  }
  if (!rows.length) { toast("In der Datei wurden keine Vokabeln gefunden."); return; }
  const now = Date.now();
  if (target) {
    /* in den geöffneten Abschnitt: doppelte Vokabeln überspringen */
    const key = v => (v.f + "|" + v.d).toLowerCase().replace(/\s+/g, " ").trim();
    const have = new Set((target.vocab || []).map(key));
    const add = rows.filter(r => !have.has(key(r)) && have.add(key(r)));
    add.forEach((r, i) => target.vocab.push({ id: uid(), f: r.f, d: r.d, r: 0, w: 0, added: now + i }));
    markDirty("sec:" + target.id); flush(); render();
    const skip = rows.length - add.length;
    if (lang && safeLang(lang) !== target.lang) toast(`Hinweis: Die Datei ist für ${LANGS[safeLang(lang)].name}, der Abschnitt für ${LANGS[target.lang].name}.`);
    toast(`${add.length} Vokabel${add.length === 1 ? "" : "n"} importiert${skip ? `, ${skip} doppelte übersprungen` : ""}.`);
    return;
  }
  const sec = { id: uid(), owner: S.me.username, name: (name || String(filename).replace(/\.(vocab\.)?(txt|csv)$/i, "").replace(/_/g, " ") || "Import").slice(0, 60),
    lang: safeLang(lang), createdAt: now, vocab: rows.map((r, i) => ({ id: uid(), f: r.f, d: r.d, r: 0, w: 0, added: now + i })) };
  S.sections.push(sec); S.openSection = sec.id; S.vocabTab = "sections"; render();
  try { await Store.set(C.sec, sec.id, sec); toast(`„${sec.name}“ mit ${rows.length} Vokabeln importiert.`); } catch { toast("Speichern fehlgeschlagen."); }
}
function parseVocabText(text) {
  const out = [];
  for (let line of String(text || "").split(/\n/)) {
    line = line.replace(/^\s*\d+[.)]\s*/, "").trim();
    if (!line) continue;
    let parts = line.split(/\t+|\s+[–—-]\s+|\s*=\s*|\s*:\s+|\s*;\s*|\s{2,}|\s*\|\s*/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) {
      const toks = line.split(/\s+/);
      const art = toks.findIndex((t, i) => i > 0 && /^(der|die|das)$/i.test(t));
      if (art > 0) parts = [toks.slice(0, art).join(" "), toks.slice(art).join(" ")];
      else if (toks.length === 2) parts = toks;
    }
    if (parts.length >= 2) out.push({ f: parts[0], d: parts.slice(1).join(", "), on: true });
  }
  return out;
}

      ${gt(["Artikel", "steht vor", "Beispiel"], [["le", "männlichen Nomen", "le sport"], ["la", "weiblichen Nomen", "la pizza"], ["les", "Nomen im Plural", "les chats"]])}
      ${tip("<b>Merke:</b> Bei <i>je n'aime pas</i> bleibt der Artikel stehen: Je n'aime pas <b>le</b> sport.")}`,
    quiz: [["J'aime ___ musique.", ["le", "la", "les"], 1, "musique ist weiblich: la musique."], ["Je n'aime pas ___ tomates.", ["le", "la", "les"], 2, "Plural: les tomates."],
      ["J'aime ___ chocolat.", ["le", "la", "les"], 0, "le chocolat ist männlich."], ["Ich mag keine Katzen.", ["Je n'aime pas les chats.", "Je n'aime pas chats.", "Je aime pas les chats."], 0, "Der Artikel bleibt: je n'aime pas les chats."],
      ["Ich mag Pizza.", ["J'aime pizza.", "J'aime la pizza.", "J'aime une pizza."], 1, "Nach aimer steht der bestimmte Artikel."], ["Moi, j'aime ___ sport.", ["le", "la", "les"], 0, "le sport ist männlich."]] },
  { id: "inton", at: "C'est parti !|Tu aimes les tomates ?", ico: "❓", title: "Die Intonationsfrage", sub: "Fragen nur mit der Stimme",
    body: `<p>Die einfachste Frage im Französischen ist ein ganz normaler Aussagesatz. Nur die <b>Stimme geht am Ende nach oben</b>, und schriftlich steht ein Fragezeichen.</p>
      ${ex([["Tu aimes le sport.", "Du magst Sport. (Aussage)"], ["Tu aimes le sport ?", "Magst du Sport? (Frage)"]])}
      <p>Antworten kannst du mit <b>oui</b> (ja) oder <b>non</b> (nein). Mit <b>ou</b> (oder) fragst du nach einer Wahl.</p>
      ${ex([["Tu aimes le rouge <b>ou</b> le vert ?", "Magst du Rot oder Grün?"]])}
      ${tip("<b>Achtung:</b> Vor dem Fragezeichen steht im Französischen ein Leerzeichen: <i>Ça va ?</i>")}`,
    quiz: [["Wie wird „Tu aimes les chiens“ zur Frage?", ["Die Stimme geht am Ende nach oben.", "Das Verb kommt an den Anfang.", "Man hängt „non“ an."], 0, "Bei der Intonationsfrage ändert sich nur die Satzmelodie."],
      ["Magst du Musik?", ["Tu aimes la musique ?", "Aimes la musique tu ?", "La musique tu aimes ?"], 0, "Gleiche Wortstellung wie im Aussagesatz."], ["Was heißt „ou“?", ["oder", "wo", "und"], 0, "ou = oder, où (mit Akzent) = wo."],
      ["– Tu aimes la pizza ? – ___, j'aime la pizza.", ["Oui", "Non", "Ou"], 0, "Zustimmung: oui."], ["Welche Schreibweise ist richtig?", ["Ça va ?", "Ça va?", "Ça va ¿"], 0, "Im Französischen steht vor ? ein Leerzeichen."]] },

  { id: "cest", at: "Unité 1|Volet 1", ico: "👉", title: "C'est, ce sont und C'est qui ?", sub: "Personen und Dinge vorstellen",
    body: `<p>Mit <b>c'est</b> (das ist) und <b>ce sont</b> (das sind) stellst du Personen oder Dinge vor.</p>
      ${gt(["Singular", "Plural"], [["<b>C'est</b> Léo.", "<b>Ce sont</b> Léo et Marine."], ["<b>C'est</b> le stade.", "<b>Ce sont</b> les chats de Jeanne."]])}
      <p>Nach einer Person fragst du mit <b>C'est qui ?</b> (Wer ist das?). Mit <b>Moi, c'est …</b> stellst du dich selbst vor.</p>
      ${ex([["– C'est qui ? – C'est Idriss.", "Wer ist das? – Das ist Idriss."], ["Salut ! Moi, c'est Noé.", "Hallo! Ich heiße Noé."]])}`,
    quiz: [["___ Noé et Max.", ["C'est", "Ce sont"], 1, "Zwei Personen: ce sont."], ["___ le collège.", ["C'est", "Ce sont"], 0, "Ein Ding: c'est."], ["Wer ist das?", ["C'est qui ?", "Qui c'est sont ?", "Ce sont qui ?"], 0, "C'est qui ?"],
      ["___ les amis de Gabin.", ["C'est", "Ce sont"], 1, "Plural: ce sont."], ["Salut ! Moi, ___ Léa.", ["c'est", "ce sont", "je suis c'est"], 0, "Moi, c'est Léa = Ich heiße Léa."]] },
  { id: "art", at: "Unité 1|Volet 1", ico: "🔤", title: "Der bestimmte Artikel und der Plural", sub: "le, la, l', les",
    body: `<p>Im Französischen gibt es nur zwei Geschlechter: <b>männlich</b> und <b>weiblich</b>. Lerne den Artikel deshalb immer mit.</p>
      ${gt(["", "Singular", "Plural"], [["männlich", "<b>le</b> garçon", "<b>les</b> garçons"], ["weiblich", "<b>la</b> fille", "<b>les</b> filles"], ["vor Vokal oder stummem h", "<b>l'</b>ami, <b>l'</b>hôtel", "<b>les</b> amis, <b>les</b> hôtels"]])}
      <p>Den Plural bildest du meist mit <b>-s</b>. Man hört es aber nicht, nur am Artikel <b>les</b> erkennst du den Plural.</p>
      ${tip("Nomen auf <b>-eau</b> und <b>-al</b> haben oft ein <b>-x</b>: le tableau → les tableau<b>x</b>, un animal → les anima<b>ux</b>.")}`,
    quiz: [["___ ami de Gabin", ["le", "la", "l'"], 2, "Vor Vokal wird le/la zu l'."], ["___ fille", ["le", "la", "l'"], 1, "fille ist weiblich."], ["Plural von „le garçon“", ["les garçons", "les garçon", "le garçons"], 0, "les + -s."],
      ["Plural von „le tableau“", ["les tableaus", "les tableaux", "les tableau"], 1, "-eau → -eaux."], ["___ hôtel", ["le", "la", "l'"], 2, "Stummes h: l'hôtel."], ["Plural von „l'animal“", ["les animals", "les animaux", "les animales"], 1, "-al → -aux."]] },
  { id: "etre", at: "Unité 1|Volet 2", ico: "🧍", title: "Das Verb être und die Personalpronomen", sub: "je suis, tu es, il est …",
    body: `<p><b>être</b> (sein) ist unregelmäßig. Lerne die Formen auswendig:</p>
      ${gt(["Singular", "", "Plural", ""], [["je <b>suis</b>", "ich bin", "nous <b>sommes</b>", "wir sind"], ["tu <b>es</b>", "du bist", "vous <b>êtes</b>", "ihr seid / Sie sind"], ["il / elle / on <b>est</b>", "er / sie / man ist", "ils / elles <b>sont</b>", "sie sind"]])}
      <p><b>on</b> heißt „man“, in der Umgangssprache meist „wir“. Das Verb steht dann wie bei il/elle: <i>On est en retard.</i></p>
      <p><b>vous</b> verwendest du für mehrere Personen (ihr) und als Höflichkeitsform (Sie).</p>
      ${tip("<b>ils</b> steht für eine Gruppe mit mindestens einem Jungen oder Mann, <b>elles</b> nur für Mädchen oder Frauen.")}`,
    quiz: [["Nous ___ en sixième.", ["sommes", "sont", "êtes"], 0, "nous sommes"], ["Tu ___ de Paris ?", ["es", "est", "suis"], 0, "tu es"], ["Vous ___ en retard !", ["êtes", "sommes", "est"], 0, "vous êtes"],
      ["Léa et Gabin ___ ensemble.", ["est", "sont", "sommes"], 1, "Léa et Gabin = ils → sont"], ["On ___ dans la même classe.", ["est", "sont", "sommes"], 0, "on steht wie il/elle: on est"],
      ["Lina et Jeanne sind zwei Mädchen. ___ sont sympa.", ["Ils", "Elles", "On"], 1, "Nur Mädchen: elles."]] },
  { id: "ilya", at: "Unité 1|Volet 3", ico: "📍", title: "il y a und der unbestimmte Artikel", sub: "Es gibt … un, une, des",
    body: `<p>Mit <b>il y a</b> (es gibt) beschreibst du, was es an einem Ort gibt. Mit <b>Qu'est-ce qu'il y a … ?</b> fragst du danach.</p>
      ${ex([["Qu'est-ce qu'il y a dans le quartier ?", "Was gibt es im Viertel?"], ["<b>Il y a</b> un parc et des magasins.", "Es gibt einen Park und Geschäfte."]])}
      ${gt(["", "Singular", "Plural"], [["männlich", "<b>un</b> parc", "<b>des</b> parcs"], ["weiblich", "<b>une</b> gare", "<b>des</b> gares"]])}
      ${tip("<b>des</b> wird im Deutschen nicht übersetzt: <i>Il y a des cafés.</i> = Es gibt Cafés.")}`,
    quiz: [["Il y a ___ gare.", ["un", "une", "des"], 1, "la gare ist weiblich → une."], ["Il y a ___ magasins.", ["un", "une", "des"], 2, "Plural → des."], ["Es gibt einen Park.", ["Il y a un parc.", "Il est un parc.", "C'est un parc il y a."], 0, "il y a = es gibt"],
      ["Was gibt es hier?", ["Qu'est-ce qu'il y a ici ?", "Qui il y a ici ?", "Où il y a ici ?"], 0, "Qu'est-ce qu'il y a … ?"], ["Il y a ___ cinéma.", ["un", "une", "des"], 0, "le cinéma → un cinéma."], ["Wie übersetzt du „des“ in „Il y a des cafés“?", ["gar nicht", "die", "einige von"], 0, "des bleibt im Deutschen meist unübersetzt."]] },
  { id: "accents", at: "Module 1|En classe", ico: "✍️", title: "Alphabet, Akzente und Zeichen", sub: "é, è, ê, ç und Co.",
    body: `<p>Französische Wörter haben oft <b>Akzente</b>. Sie gehören zur Schreibweise dazu.</p>
      ${gt(["Zeichen", "Name", "Beispiel"], [["é", "accent aigu", "le café, le musée"], ["è", "accent grave", "la mère, très"], ["ê", "accent circonflexe", "être, la fenêtre"], ["ç", "cédille (wird wie s gesprochen)", "le français, ça va"], ["ë / ï", "tréma", "Noël, naïf"]])}
      <p>So fragst du nach einem Wort: <b>Comment on dit … en français ?</b> (Wie sagt man …?) und <b>Comment on écrit … ?</b> (Wie schreibt man …?)</p>`,
    quiz: [["Welches Wort ist richtig geschrieben?", ["le francais", "le français", "le françáis"], 1, "français mit cédille."], ["Welcher Akzent steht in „la mère“?", ["accent aigu", "accent grave", "accent circonflexe"], 1, "è = accent grave."],
      ["Wie fragst du „Wie sagt man …?“", ["Comment on dit … ?", "Comment on écrit … ?", "Qu'est-ce que c'est ?"], 0, "dire = sagen."], ["Wie wird ç ausgesprochen?", ["wie s", "wie k", "wie tsch"], 0, "ç klingt immer wie s."], ["Richtig geschrieben:", ["la fenêtre", "la fenetre", "la fenétre"], 0, "fenêtre mit accent circonflexe."]] },

  { id: "avoir", at: "Unité 2|Volet 1", ico: "🎒", title: "Das Verb avoir", sub: "haben und das Alter angeben",
    body: `${gt(["Singular", "", "Plural", ""], [["j'<b>ai</b>", "ich habe", "nous <b>avons</b>", "wir haben"], ["tu <b>as</b>", "du hast", "vous <b>avez</b>", "ihr habt / Sie haben"], ["il / elle / on <b>a</b>", "er / sie / man hat", "ils / elles <b>ont</b>", "sie haben"]])}
      <p>Das Alter gibst du im Französischen mit <b>avoir</b> an: Man „hat“ die Jahre.</p>
      ${ex([["J'<b>ai</b> douze ans.", "Ich bin zwölf Jahre alt."], ["Tu <b>as</b> quel âge ?", "Wie alt bist du?"]])}
      ${tip("Achte auf die Bindung: nous‿avons, vous‿avez, ils‿ont [ilzɔ̃]. Nicht verwechseln: ils <b>ont</b> (haben) und ils <b>sont</b> (sind).")}`,
    quiz: [["Nous ___ un chat.", ["avons", "avez", "ont"], 0, "nous avons"], ["Mes parents ___ une moto.", ["a", "ont", "sont"], 1, "ils ont"], ["Ich bin 12 Jahre alt.", ["Je suis douze ans.", "J'ai douze ans.", "J'ai douze années."], 1, "Alter mit avoir."],
      ["Tu ___ un frère ?", ["as", "a", "es"], 0, "tu as"], ["Vous ___ des animaux ?", ["avez", "avons", "êtes"], 0, "vous avez"], ["Ma sœur ___ quinze ans.", ["a", "as", "est"], 0, "elle a"]] },
  { id: "neg1", at: "Unité 2|Volet 1", ico: "🚫", title: "Die Verneinung ne … pas", sub: "und kein, keine: ne … pas de",
    body: `<p><b>ne … pas</b> umschließt das Verb. Vor Vokal wird <b>ne</b> zu <b>n'</b>.</p>
      ${ex([["Je <b>ne</b> suis <b>pas</b> en retard.", "Ich bin nicht zu spät."], ["Je <b>n'</b>aime <b>pas</b> le sport.", "Ich mag keinen Sport."]])}
      <p>Nach der Verneinung werden <b>un, une, des</b> zu <b>de</b> (vor Vokal <b>d'</b>). Auf Deutsch heißt das „kein, keine“.</p>
      ${ex([["J'ai <b>un</b> frère. → Je n'ai <b>pas de</b> frère.", "Ich habe keinen Bruder."], ["J'ai <b>un</b> animal. → Je n'ai <b>pas d'</b>animal.", "Ich habe kein Haustier."]])}
      ${tip("Der bestimmte Artikel bleibt: Je n'aime pas <b>les</b> chats.")}`,
    quiz: [["Je ___ suis ___ de Paris.", ["ne … pas", "pas … ne", "n' … pas de"], 0, "ne vor dem Verb, pas danach."], ["Ich habe keine Geschwister.", ["Je n'ai pas des frères et sœurs.", "Je n'ai pas de frères et sœurs.", "Je ne pas ai frères et sœurs."], 1, "des → de nach der Verneinung."],
      ["Il ___ habite pas ici.", ["ne", "n'", "pas"], 1, "Vor Vokal: n'."], ["Ich habe kein Haustier.", ["Je n'ai pas d'animal.", "Je n'ai pas un animal.", "Je n'ai pas de animal."], 0, "de wird vor Vokal zu d'."],
      ["Ich mag keine Tomaten.", ["Je n'aime pas de tomates.", "Je n'aime pas les tomates.", "Je n'aime les tomates pas."], 1, "Bei aimer bleibt der bestimmte Artikel."]] },
  { id: "poss1", at: "Unité 2|Volet 2", ico: "👪", title: "Possessivbegleiter mon, ton, son", sub: "mein, dein, sein, ihr",
    body: `${gt(["", "männlich", "weiblich", "Plural"], [["mein", "<b>mon</b> frère", "<b>ma</b> sœur", "<b>mes</b> parents"], ["dein", "<b>ton</b> frère", "<b>ta</b> sœur", "<b>tes</b> parents"], ["sein / ihr", "<b>son</b> frère", "<b>sa</b> sœur", "<b>ses</b> parents"]])}
      <p>Der Begleiter richtet sich nach dem <b>Nomen</b>, nicht nach dem Besitzer. <b>sa</b> mère heißt also „seine Mutter“ <i>oder</i> „ihre Mutter“.</p>
      ${tip("Vor weiblichen Nomen mit Vokal steht <b>mon, ton, son</b>: <b>mon</b> amie, <b>ton</b> école.")}`,
    quiz: [["Voilà ___ mère. (meine)", ["mon", "ma", "mes"], 1, "mère ist weiblich."], ["Ce sont ___ parents ? (deine)", ["ton", "ta", "tes"], 2, "Plural → tes."], ["Max et ___ père (sein Vater)", ["son", "sa", "ses"], 0, "père ist männlich → son."],
      ["Clara et ___ père (ihr Vater)", ["son", "sa", "ses"], 0, "Es zählt das Nomen: le père → son."], ["C'est ___ amie Léa. (meine)", ["ma", "mon", "mes"], 1, "Vor Vokal: mon amie."], ["Noé et ___ grands-parents", ["son", "sa", "ses"], 2, "Plural → ses."]] },
  { id: "er", at: "Unité 2|Volet 3", ico: "⚙️", title: "Die Verben auf -er", sub: "travailler, jouer, aimer …",
    body: `<p>Die meisten französischen Verben enden auf <b>-er</b> und werden gleich konjugiert. Du nimmst den Stamm und hängst die Endungen an:</p>
      ${gt(["", "travailler", "Endung"], [["je", "travaill<b>e</b>", "-e"], ["tu", "travaill<b>es</b>", "-es"], ["il / elle / on", "travaill<b>e</b>", "-e"], ["nous", "travaill<b>ons</b>", "-ons"], ["vous", "travaill<b>ez</b>", "-ez"], ["ils / elles", "travaill<b>ent</b>", "-ent"]])}
      ${tip("Die Endungen -e, -es und -ent hört man nicht: je joue, tu joues, ils jouent klingen gleich. Vor Vokal wird je zu j': j'aime, j'écoute.")}`,
    quiz: [["Nous ___ au foot. (jouer)", ["jouons", "jouez", "jouent"], 0, "nous → -ons"], ["Ils ___ de la musique. (écouter)", ["écoute", "écoutent", "écoutez"], 1, "ils → -ent"], ["Tu ___ souvent ? (dessiner)", ["dessines", "dessine", "dessinez"], 0, "tu → -es"],
      ["Vous ___ français ? (parler)", ["parlons", "parlez", "parlent"], 1, "vous → -ez"], ["___ aime les mangas.", ["Je", "J'", "Jé"], 1, "Vor Vokal: j'aime."], ["Léa ___ sur Internet. (chatter)", ["chatte", "chattes", "chattent"], 0, "elle → -e"]] },
  { id: "quest1", at: "Unité 2|Volet 3", ico: "💬", title: "Fragen mit Qu'est-ce que … ?", sub: "Was …?",
    body: `<p>Mit <b>Qu'est-ce que</b> fragst du nach Dingen oder Tätigkeiten: Was …? Danach kommt ein ganz normaler Aussagesatz.</p>
      ${ex([["<b>Qu'est-ce que</b> tu fais ?", "Was machst du?"], ["<b>Qu'est-ce que</b> tu aimes ?", "Was magst du?"], ["<b>Qu'est-ce qu'</b>il dessine ?", "Was zeichnet er?"]])}
      ${tip("Vor Vokal wird que zu <b>qu'</b>: Qu'est-ce qu'il …, Qu'est-ce qu'elle …")}`,
    quiz: [["Was machst du?", ["Qu'est-ce que tu fais ?", "Qui tu fais ?", "Où tu fais ?"], 0, "Qu'est-ce que = was"], ["___ elle regarde ?", ["Qu'est-ce que", "Qu'est-ce qu'", "Qui est-ce"], 1, "Vor Vokal: qu'."],
      ["Qu'est-ce que tu ___ ? – J'écoute de la musique.", ["fais", "es", "as"], 0, "Was machst du? → fais"], ["Was magst du?", ["Qu'est-ce que tu aimes ?", "Qu'est-ce tu aimes ?", "Que tu aimes ?"], 0, "Qu'est-ce que tu aimes ?"]] },
  { id: "imper", at: "Module 2|En classe", ico: "📣", title: "Der Imperativ im Unterricht", sub: "Écoutez ! Lis ! Répétez !",
    body: `<p>Mit dem Imperativ gibst du Anweisungen. Es gibt eine Form für <b>eine Person</b> (du) und eine für <b>mehrere Personen</b> oder zum Siezen.</p>
      ${gt(["du", "ihr / Sie", "Deutsch"], [["Écoute !", "Écoutez !", "Hör zu! / Hört zu!"], ["Répète !", "Répétez !", "Wiederhole! / Wiederholt!"], ["Lis !", "Lisez !", "Lies! / Lest!"], ["Écris !", "Écrivez !", "Schreib! / Schreibt!"], ["Prends !", "Prenez !", "Nimm! / Nehmt!"], ["Réponds !", "Répondez !", "Antworte! / Antwortet!"]])}
      ${tip("Bei Verben auf -er fällt in der du-Form das -s weg: tu écoutes → <b>Écoute !</b>")}`,
    quiz: [["Die Lehrerin sagt zur Klasse: „Lest den Text!“", ["Lis le texte !", "Lisez le texte !", "Lisons le texte !"], 1, "Mehrere Personen → Lisez."], ["Zu einem Freund: „Hör zu!“", ["Écoute !", "Écoutes !", "Écoutez !"], 0, "-er-Verb ohne -s."],
      ["„Schreibt den Satz!“", ["Écrivez la phrase !", "Écris la phrase !", "Écrire la phrase !"], 0, "Écrivez = schreibt"], ["„Répétez, s'il vous plaît.“ heißt …", ["Wiederholen Sie bitte.", "Antworten Sie bitte.", "Lesen Sie bitte."], 0, "répéter = wiederholen"],
      ["Zu einer Person: „Nimm ein Blatt!“", ["Prends une feuille !", "Prenez une feuille !", "Prendre une feuille !"], 0, "du-Form: Prends"]] },

  { id: "prep", at: "Unité 3|Vocabulaire thématique", ico: "🛏️", title: "Präpositionen des Ortes", sub: "sur, sous, devant, à côté de …",
    body: `${gt(["Präposition", "Deutsch", "Beispiel"], [["sur", "auf", "Le livre est <b>sur</b> la table."], ["sous", "unter", "Le chat est <b>sous</b> le lit."], ["devant / derrière", "vor / hinter", "<b>devant</b> la porte"], ["dans", "in", "<b>dans</b> l'armoire"], ["entre", "zwischen", "<b>entre</b> le lit et le bureau"], ["à côté de", "neben", "<b>à côté de</b> la fenêtre"], ["en face de", "gegenüber von", "<b>en face de</b> la gare"], ["à gauche de / à droite de", "links / rechts von", "<b>à droite de</b> l'étagère"]])}
      <p>Bei Präpositionen mit <b>de</b> verschmilzt de mit le und les:</p>
      ${gt(["de + Artikel", "Ergebnis", "Beispiel"], [["de + le", "<b>du</b>", "à côté <b>du</b> lit"], ["de + la", "de la", "en face <b>de la</b> porte"], ["de + l'", "de l'", "à gauche <b>de l'</b>armoire"], ["de + les", "<b>des</b>", "à côté <b>des</b> livres"]])}`,
    quiz: [["Le chat est ___ le lit. (unter)", ["sur", "sous", "dans"], 1, "sous = unter"], ["La lampe est à côté ___ lit.", ["de le", "du", "de la"], 1, "de + le → du"], ["Le poster est en face ___ fenêtre.", ["du", "de la", "des"], 1, "de + la bleibt."],
      ["Le sac est à droite ___ livres.", ["de les", "des", "du"], 1, "de + les → des"], ["Les livres sont ___ l'étagère. (auf)", ["sur", "sous", "derrière"], 0, "sur = auf"], ["Le stade est ___ la gare et le parc. (zwischen)", ["entre", "devant", "dans"], 0, "entre = zwischen"]] },
  { id: "faire", at: "Unité 3|Volet 2", ico: "🎨", title: "Das Verb faire und Hobbys", sub: "je fais du sport, de la danse …",
    body: `${gt(["Singular", "Plural"], [["je <b>fais</b>", "nous <b>faisons</b>"], ["tu <b>fais</b>", "vous <b>faites</b>"], ["il / elle / on <b>fait</b>", "ils / elles <b>font</b>"]])}
      <p>Für Hobbys sagst du <b>faire de</b> + Artikel. Dabei verschmilzt de mit le und les:</p>
      ${gt(["", "Beispiel"], [["de + le = <b>du</b>", "Je fais <b>du</b> piano."], ["de + la", "Elle fait <b>de la</b> danse."], ["de + l'", "Noé fait <b>de l'</b>escalade."], ["de + les = <b>des</b>", "Ils font <b>des</b> arts martiaux."]])}
      ${tip("Achtung bei <b>vous faites</b>: Es heißt nie „vous faisez“.")}`,
    quiz: [["Vous ___ du sport ?", ["faisez", "faites", "font"], 1, "vous faites"], ["Ils ___ leurs devoirs.", ["font", "fait", "faisons"], 0, "ils font"], ["Je fais ___ piano.", ["de le", "du", "de la"], 1, "le piano → du piano"],
      ["Elle fait ___ danse.", ["du", "de la", "des"], 1, "la danse → de la danse"], ["Noé fait ___ escalade.", ["de l'", "du", "de la"], 0, "Vor Vokal: de l'"], ["Nous ___ du basket.", ["faisons", "faites", "font"], 0, "nous faisons"]] },
  { id: "aimerinf", at: "Unité 3|Volet 2", ico: "👍", title: "Vorlieben ausdrücken", sub: "aimer, adorer, détester + Nomen oder Infinitiv",
    body: `<p>Nach <b>aimer, aimer bien, adorer, préférer, détester</b> kann ein Nomen mit bestimmtem Artikel oder ein <b>Infinitiv</b> stehen.</p>
      ${ex([["J'adore <b>le</b> foot.", "Ich liebe Fußball."], ["Je déteste <b>faire</b> du sport.", "Ich hasse es, Sport zu machen."], ["J'aime bien <b>dessiner</b>.", "Ich zeichne gern."]])}
      <p>So reagierst du auf andere:</p>
      ${gt(["Aussage", "Reaktion", "Bedeutung"], [["J'aime le rap.", "Moi aussi.", "Ich auch."], ["Je n'aime pas le sport.", "Moi non plus.", "Ich auch nicht."], ["Je n'aime pas Pomme.", "Moi si !", "Ich schon!"], ["J'ai une sœur.", "Moi non.", "Ich nicht."]])}`,
    quiz: [["– Je n'aime pas les maths. – ___ (Ich auch nicht.)", ["Moi aussi.", "Moi non plus.", "Moi si."], 1, "Zustimmung zu einer Verneinung: moi non plus."], ["– J'adore les BD. – ___ (Ich auch.)", ["Moi aussi.", "Moi non plus.", "Moi non."], 0, "moi aussi"],
      ["Ich spiele gern Gitarre.", ["J'aime bien jouer de la guitare.", "J'aime bien joue la guitare.", "J'aime bien de jouer guitare."], 0, "aimer bien + Infinitiv"], ["Je déteste ___ chats.", ["les", "des", "de"], 0, "Nach détester steht der bestimmte Artikel."],
      ["– Je n'aime pas le rap. – ___ (Ich schon!)", ["Moi si !", "Moi aussi !", "Moi non plus !"], 0, "Widerspruch zu einer Verneinung: moi si."]] },
  { id: "adj", at: "Unité 3|Volet 3", ico: "🎨", title: "Die Adjektive", sub: "Angleichung und Stellung",
    body: `<p>Adjektive richten sich in Geschlecht und Zahl nach ihrem Nomen. Meist hängst du für weiblich ein <b>-e</b> und für Plural ein <b>-s</b> an.</p>
      ${gt(["", "männlich", "weiblich"], [["Singular", "un lit bleu", "une chaise bleu<b>e</b>"], ["Plural", "des lits bleu<b>s</b>", "des chaises bleu<b>es</b>"]])}
      <p>Endet ein Adjektiv schon auf -e, bleibt es gleich: un poster <b>rouge</b>, une plante <b>rouge</b>. Sonderformen: blanc → <b>blanche</b>, préféré → <b>préférée</b>.</p>
      <p><b>Stellung:</b> Die meisten Adjektive stehen <b>hinter</b> dem Nomen (une chambre <b>moche</b>). Kurze Adjektive wie <b>petit, grand, joli</b> stehen <b>davor</b>: une <b>petite</b> chambre.</p>`,
    quiz: [["une armoire ___ (weiß)", ["blanc", "blanche", "blancs"], 1, "blanc → blanche"], ["des posters ___ (blau)", ["bleu", "bleus", "bleues"], 1, "männlich Plural: -s"], ["Welche Stellung ist richtig?", ["une chambre petite", "une petite chambre"], 1, "petit steht vor dem Nomen."],
      ["ma chanteuse ___", ["préféré", "préférée", "préférés"], 1, "weiblich: -e"], ["Welche Stellung ist richtig?", ["un moche lit", "un lit moche"], 1, "moche steht hinter dem Nomen."], ["des chaises ___ (grün)", ["vert", "verts", "vertes"], 2, "weiblich Plural: -es"]] },
  { id: "neg2", at: "Unité 3|Volet 3", ico: "⛔", title: "ne … pas und ne … plus", sub: "nicht und nicht mehr",
    body: `<p>Wie <b>ne … pas</b> umschließt auch <b>ne … plus</b> (nicht mehr) das Verb.</p>
      ${ex([["Je <b>ne</b> joue <b>pas</b> au foot.", "Ich spiele nicht Fußball."], ["Je <b>ne</b> joue <b>plus</b> au foot.", "Ich spiele nicht mehr Fußball."], ["Je <b>n'</b>ai <b>plus</b> mon livre.", "Ich habe mein Buch nicht mehr."]])}
      ${tip("Nach ne … plus wird un/une/des ebenfalls zu <b>de</b>: Je n'ai plus <b>de</b> devoirs.")}`,
    quiz: [["Ich spiele nicht mehr Gitarre.", ["Je ne joue plus de la guitare.", "Je ne plus joue de la guitare.", "Je joue ne plus de la guitare."], 0, "ne vor, plus nach dem Verb."], ["Il ___ est pas là.", ["ne", "n'", "pas"], 1, "Vor Vokal: n'"],
      ["Ich habe keine Hausaufgaben mehr.", ["Je n'ai plus de devoirs.", "Je n'ai plus des devoirs.", "Je n'ai pas plus devoirs."], 0, "ne … plus de"], ["„ne … plus“ heißt …", ["nicht mehr", "nicht", "mehr"], 0, "ne … plus = nicht mehr"]] },
  { id: "heure", at: "Module 3|L'heure", ico: "🕒", title: "Die Uhrzeit", sub: "Il est quelle heure ?",
    body: `${gt(["Uhrzeit", "Französisch"], [["2:05", "Il est deux heures cinq."], ["3:15", "Il est trois heures <b>et quart</b>."], ["4:30", "Il est quatre heures <b>et demie</b>."], ["5:45", "Il est six heures <b>moins le quart</b>."], ["6:50", "Il est sept heures <b>moins dix</b>."], ["12:00 / 0:00", "Il est <b>midi</b>. / Il est <b>minuit</b>."]])}
      <p>Nach der Uhrzeit fragst du mit <b>Il est quelle heure ?</b> Nach einem Zeitpunkt mit <b>À quelle heure … ?</b> – Antwort: <b>à</b> 16 heures.</p>
      ${tip("Nach midi und minuit heißt es <b>et demi</b> ohne -e: Il est midi et demi.")}`,
    quiz: [["3:15", ["trois heures et quart", "trois heures moins le quart", "trois heures et demie"], 0, "et quart = Viertel nach"], ["7:45", ["sept heures moins le quart", "huit heures moins le quart", "huit heures et quart"], 1, "Viertel vor acht."],
      ["4:30", ["quatre heures et demie", "quatre heures et demi", "quatre heures moins demie"], 0, "Nach heures: et demie."], ["Um 16 Uhr", ["à seize heures", "en seize heures", "dans seize heures"], 0, "Zeitpunkt mit à."], ["12:30 mittags", ["midi et demi", "midi et demie", "minuit et demi"], 0, "midi et demi"]] },

  { id: "aller", at: "Unité 4|Volet 1", ico: "🚶", title: "aller und à + Artikel", sub: "je vais au collège",
    body: `${gt(["Singular", "Plural"], [["je <b>vais</b>", "nous <b>allons</b>"], ["tu <b>vas</b>", "vous <b>allez</b>"], ["il / elle / on <b>va</b>", "ils / elles <b>vont</b>"]])}
      <p>Wohin du gehst, sagst du mit <b>à</b>. Dabei verschmilzt à mit le und les:</p>
      ${gt(["à + Artikel", "Ergebnis", "Beispiel"], [["à + le", "<b>au</b>", "Je vais <b>au</b> collège."], ["à + la", "à la", "Je vais <b>à la</b> cantine."], ["à + l'", "à l'", "Je vais <b>à l'</b>école."], ["à + les", "<b>aux</b>", "Je vais <b>aux</b> toilettes."]])}`,
    quiz: [["Nous ___ au CDI.", ["allons", "allez", "vont"], 0, "nous allons"], ["Ils ___ à la cantine.", ["va", "vont", "allons"], 1, "ils vont"], ["Je vais ___ collège.", ["à le", "au", "à la"], 1, "à + le → au"],
      ["Tu vas ___ toilettes ?", ["aux", "à les", "au"], 0, "à + les → aux"], ["Elle va ___ salle de musique.", ["au", "à la", "à l'"], 1, "à + la bleibt"], ["Vous ___ où ?", ["allez", "allons", "vas"], 0, "vous allez"]] },
  { id: "ger", at: "Unité 4|Volet 1", ico: "🍽️", title: "manger und ranger", sub: "nous mangeons, nous rangeons",
    body: `<p><b>manger</b> und <b>ranger</b> sind -er-Verben. Nur bei <b>nous</b> gibt es eine Besonderheit: Damit das g weich wie in „Garage“ bleibt, steht ein <b>e</b> vor -ons.</p>
      ${gt(["manger", "ranger"], [["je mange", "je range"], ["tu manges", "tu ranges"], ["il mange", "il range"], ["nous mang<b>e</b>ons", "nous rang<b>e</b>ons"], ["vous mangez", "vous rangez"], ["ils mangent", "ils rangent"]])}`,
    quiz: [["Nous ___ à la cantine.", ["mangons", "mangeons", "mangeont"], 1, "nous mangeons mit e"], ["Vous ___ vos affaires ?", ["rangez", "rangeez", "rangeons"], 0, "Nur bei nous kommt das e dazu."], ["Ils ___ des pizzas.", ["mangent", "mangeent", "mangeons"], 0, "ils mangent"],
      ["Nous ___ la chambre.", ["rangons", "rangeons", "rangez"], 1, "nous rangeons"]] },
  { id: "poss2", at: "Unité 4|Volet 2", ico: "🏫", title: "notre, votre, leur", sub: "unser, euer, ihr",
    body: `${gt(["", "Singular", "Plural"], [["unser", "<b>notre</b> collège", "<b>nos</b> profs"], ["euer / Ihr", "<b>votre</b> salle", "<b>vos</b> livres"], ["ihr (mehrere Besitzer)", "<b>leur</b> salle", "<b>leurs</b> profs"]])}
      <p>Bei diesen Begleitern gibt es keinen Unterschied zwischen männlich und weiblich, nur zwischen Singular und Plural.</p>
      ${tip("<b>leur</b> (ihr) ≠ <b>son/sa</b> (sein/ihr): Léa et Max → <b>leur</b> prof. Léa → <b>sa</b> prof.")}`,
    quiz: [["Voilà ___ collège. (unsere Schule)", ["notre", "nos", "votre"], 0, "Singular: notre"], ["Ce sont ___ livres ? (eure)", ["votre", "vos", "leurs"], 1, "Plural: vos"], ["Léa et Max cherchent ___ prof.", ["leur", "leurs", "son"], 0, "Mehrere Besitzer, ein Lehrer: leur"],
      ["Les élèves rangent ___ affaires.", ["leur", "leurs", "ses"], 1, "Mehrere Besitzer, mehrere Dinge: leurs"], ["C'est ___ salle, Madame ? (Ihr)", ["votre", "vos", "notre"], 0, "Höflichkeit, Singular: votre"]] },
  { id: "estceque", at: "Unité 4|Volet 2", ico: "🔎", title: "Fragen mit est-ce que", sub: "und mit Fragewort",
    body: `<p><b>Est-ce que</b> macht aus einem Aussagesatz eine Ja/Nein-Frage. Es wird nicht übersetzt.</p>
      ${ex([["<b>Est-ce que</b> tu as un animal ?", "Hast du ein Haustier?"]])}
      <p>Mit einem Fragewort davor fragst du genauer nach:</p>
      ${gt(["Fragewort", "Beispiel", "Deutsch"], [["Où", "Où <b>est-ce que</b> tu habites ?", "Wo wohnst du?"], ["Quand", "Quand <b>est-ce que</b> tu as EPS ?", "Wann hast du Sport?"], ["Pourquoi", "Pourquoi <b>est-ce que</b> tu es en retard ?", "Warum bist du zu spät?"], ["Comment", "Comment <b>est-ce que</b> tu vas au collège ?", "Wie kommst du zur Schule?"], ["Qu'", "Qu'<b>est-ce que</b> tu fais ?", "Was machst du?"]])}
      ${tip("Auf <b>Pourquoi ?</b> antwortest du mit <b>parce que</b> (weil). Vor Vokal: est-ce qu'il …, parce qu'il …")}`,
    quiz: [["Hast du Hausaufgaben?", ["Est-ce que tu as des devoirs ?", "Est-ce tu as des devoirs ?", "Qu'est-ce que tu as des devoirs ?"], 0, "Ja/Nein-Frage: est-ce que"], ["___ est-ce que tu es triste ? – Parce que …", ["Où", "Pourquoi", "Quand"], 1, "Antwort mit parce que → Pourquoi"],
      ["Wann hast du Mathe?", ["Quand est-ce que tu as maths ?", "Où est-ce que tu as maths ?", "Comment est-ce que tu as maths ?"], 0, "Quand = wann"], ["Est-ce ___ il a cours ?", ["que", "qu'", "qui"], 1, "Vor Vokal: qu'"], ["Je suis en retard ___ le métro est en retard.", ["parce que", "pourquoi", "est-ce que"], 0, "parce que = weil"]] },
  { id: "cer", at: "Unité 4|Volet 2", ico: "🔔", title: "commencer", sub: "nous commençons",
    body: `<p>Bei <b>commencer</b> bekommt das c vor -ons eine <b>cédille</b>, damit es weiter wie „s“ klingt.</p>
      ${gt(["Singular", "Plural"], [["je commence", "nous commen<b>ç</b>ons"], ["tu commences", "vous commencez"], ["il commence", "ils commencent"]])}`,
    quiz: [["Nous ___ à huit heures.", ["commencons", "commençons", "commenceons"], 1, "ç vor -ons"], ["Le cours ___ à dix heures.", ["commence", "commençe", "commences"], 0, "il commence ohne ç"], ["Vous ___ quand ?", ["commencez", "commençez", "commencons"], 0, "Vor e und i kein ç"]] },
  { id: "quant1", at: "Unité 4|Volet 3", ico: "⚖️", title: "Mengenangaben mit de", sub: "beaucoup de, trop de, assez de",
    body: `<p>Nach Mengenwörtern steht nur <b>de</b>, ohne Artikel. Vor Vokal wird es zu <b>d'</b>.</p>
      ${gt(["Mengenwort", "Beispiel", "Deutsch"], [["beaucoup de", "beaucoup <b>de</b> devoirs", "viele Hausaufgaben"], ["trop de", "trop <b>de</b> bruit", "zu viel Lärm"], ["assez de", "assez <b>de</b> pain", "genug Brot"], ["ne … pas assez de", "pas assez <b>de</b> vacances", "nicht genug Ferien"], ["ne … pas de", "pas <b>de</b> problème", "kein Problem"]])}
      ${tip("Nie „beaucoup des“: Es heißt immer beaucoup <b>de</b> élèves → beaucoup <b>d'</b>élèves.")}`,
    quiz: [["Il y a beaucoup ___ élèves.", ["des", "de", "d'"], 2, "Vor Vokal: d'"], ["Les profs donnent trop ___ devoirs.", ["de", "des", "les"], 0, "trop de"], ["Il n'y a pas assez ___ pain.", ["de", "du", "le"], 0, "pas assez de"],
      ["Es gibt kein Problem.", ["Il n'y a pas de problème.", "Il n'y a pas un problème.", "Il n'y a pas des problèmes."], 0, "ne … pas de"], ["zu viel Lärm", ["trop de bruit", "trop du bruit", "beaucoup bruit"], 0, "trop de"]] },
  { id: "bonnul", at: "Unité 4|Volet 3", ico: "⭐", title: "Meinungen und Noten", sub: "être bon/nul en, je trouve que",
    body: `<p>Mit <b>être bon/bonne en</b> und <b>être nul/nulle en</b> sagst du, worin jemand gut oder schlecht ist. Das Adjektiv passt sich an.</p>
      ${ex([["Marc est <b>bon en</b> français.", "Marc ist gut in Französisch."], ["Léa est <b>nulle en</b> maths.", "Léa ist schlecht in Mathe."]])}
      <p>Deine Meinung leitest du mit <b>je trouve que</b> (ich finde, dass) ein.</p>
      ${ex([["Je trouve que la cantine est super.", "Ich finde, dass die Kantine super ist."]])}`,
    quiz: [["Léa est ___ en anglais. (gut)", ["bon", "bonne", "bons"], 1, "Léa → bonne"], ["Max est ___ en sport. (schlecht)", ["nul", "nulle", "nuls"], 0, "Max → nul"], ["Ich finde, dass …", ["je trouve que", "je trouve qui", "je pense de"], 0, "je trouve que"],
      ["Elles sont ___ en latin. (gut)", ["bons", "bonnes", "bonne"], 1, "weiblich Plural: bonnes"]] },
  { id: "prendre", at: "Module 4|À la cantine", ico: "🍰", title: "prendre und avoir faim", sub: "Was nimmst du?",
    body: `${gt(["Singular", "Plural"], [["je <b>prends</b>", "nous <b>prenons</b>"], ["tu <b>prends</b>", "vous <b>prenez</b>"], ["il / elle / on <b>prend</b>", "ils / elles <b>prennent</b>"]])}
      <p>Hunger und Durst „hat“ man im Französischen: <b>avoir faim</b> (Hunger haben), <b>avoir soif</b> (Durst haben).</p>
      ${ex([["J'<b>ai faim</b>. Je <b>prends</b> le menu.", "Ich habe Hunger. Ich nehme das Menü."]])}
      ${tip("Achte auf das doppelte n bei <b>ils prennent</b>.")}`,
    quiz: [["Ils ___ un dessert.", ["prenent", "prennent", "prendent"], 1, "ils prennent mit nn"], ["Tu ___ quoi ?", ["prends", "prend", "prenez"], 0, "tu prends"], ["Ich habe Durst.", ["Je suis soif.", "J'ai soif.", "J'ai faim."], 1, "avoir soif"],
      ["Nous ___ le menu sans entrée.", ["prenons", "prennons", "prenez"], 0, "nous prenons mit einem n"], ["Hunger haben", ["avoir faim", "être faim", "avoir soif"], 0, "avoir faim"]] },

  { id: "partitif", at: "Unité 5|Vocabulaire thématique", ico: "🧈", title: "Der Teilungsartikel", sub: "du lait, de la farine, de l'eau",
    body: `<p>Wenn du von einer <b>unbestimmten Menge</b> sprichst, die man nicht zählt, benutzt du den Teilungsartikel. Im Deutschen steht oft gar nichts.</p>
      ${gt(["", "Teilungsartikel", "Beispiel"], [["männlich", "<b>du</b>", "Il faut <b>du</b> sucre."], ["weiblich", "<b>de la</b>", "Il faut <b>de la</b> farine."], ["vor Vokal", "<b>de l'</b>", "Je bois <b>de l'</b>eau."], ["Plural", "<b>des</b>", "On achète <b>des</b> fraises."]])}
      ${tip("Nach der Verneinung steht wieder nur <b>de</b>: Il n'y a pas <b>de</b> lait.")}`,
    quiz: [["Il faut ___ beurre.", ["du", "de la", "des"], 0, "le beurre → du"], ["Il faut ___ farine.", ["du", "de la", "de l'"], 1, "la farine → de la"], ["Tu veux ___ eau ?", ["de la", "du", "de l'"], 2, "Vor Vokal: de l'"],
      ["Il n'y a pas ___ lait.", ["du", "de", "des"], 1, "Nach Verneinung: de"], ["On a ___ miel ?", ["du", "de la", "des"], 0, "le miel → du"]] },
  { id: "vouloir", at: "Unité 5|Volet 1", ico: "🙋", title: "vouloir und pouvoir", sub: "wollen und können + Infinitiv",
    body: `${gt(["vouloir", "pouvoir"], [["je <b>veux</b>", "je <b>peux</b>"], ["tu <b>veux</b>", "tu <b>peux</b>"], ["il / elle / on <b>veut</b>", "il / elle / on <b>peut</b>"], ["nous <b>voulons</b>", "nous <b>pouvons</b>"], ["vous <b>voulez</b>", "vous <b>pouvez</b>"], ["ils / elles <b>veulent</b>", "ils / elles <b>peuvent</b>"]])}
      <p>Nach vouloir und pouvoir steht oft ein Verb im <b>Infinitiv</b>:</p>
      ${ex([["Tu <b>veux jouer</b> avec moi ?", "Willst du mit mir spielen?"], ["On <b>peut aller</b> au parc.", "Wir können in den Park gehen."]])}
      ${tip("Höflicher als je veux ist <b>je voudrais</b> (ich möchte).")}`,
    quiz: [["Nous ___ regarder un film.", ["voulons", "voulez", "veulent"], 0, "nous voulons"], ["Ils ___ venir ?", ["peuvent", "pouvent", "peut"], 0, "ils peuvent"], ["Tu ___ apporter des boissons ?", ["peux", "peut", "pouvez"], 0, "tu peux"],
      ["Willst du mit mir spielen?", ["Tu veux jouer avec moi ?", "Tu veux joues avec moi ?", "Tu veut jouer avec moi ?"], 0, "vouloir + Infinitiv"], ["Vous ___ répéter ?", ["pouvez", "pouvons", "peuvez"], 0, "vous pouvez"], ["Höflich: Ich möchte einen Saft.", ["Je voudrais un jus.", "Je veux un jus.", "Je peux un jus."], 0, "je voudrais"]] },
  { id: "preferer", at: "Unité 5|Volet 1", ico: "📞", title: "préférer und appeler", sub: "Verben mit Änderungen im Stamm",
    body: `<p>Bei diesen -er-Verben ändert sich der Stamm in den betonten Formen (je, tu, il, ils). Bei <b>nous</b> und <b>vous</b> bleibt er wie im Infinitiv.</p>
      ${gt(["préférer", "appeler"], [["je préf<b>è</b>re", "j'appe<b>ll</b>e"], ["tu préf<b>è</b>res", "tu appe<b>ll</b>es"], ["il préf<b>è</b>re", "il appe<b>ll</b>e"], ["nous préférons", "nous appelons"], ["vous préférez", "vous appelez"], ["ils préf<b>è</b>rent", "ils appe<b>ll</b>ent"]])}`,
    quiz: [["Je ___ le théâtre.", ["préfère", "préfére", "préfèrons"], 0, "je préfère mit è"], ["Nous ___ le cinéma.", ["préfèrons", "préférons", "préferons"], 1, "nous: é bleibt"], ["Tu ___ ta mère ?", ["appelles", "appeles", "appellez"], 0, "tu appelles mit ll"],
      ["Vous ___ qui ?", ["appelez", "appellez", "appelles"], 0, "vous: ein l"], ["Ils ___ la pizza.", ["préfèrent", "préférent", "préfèrons"], 0, "ils préfèrent"]] },
  { id: "acheter", at: "Unité 5|Volet 2", ico: "🛒", title: "acheter und Mengen", sub: "un kilo de, une bouteille de",
    body: `${gt(["Singular", "Plural"], [["j'ach<b>è</b>te", "nous achetons"], ["tu ach<b>è</b>tes", "vous achetez"], ["il ach<b>è</b>te", "ils ach<b>è</b>tent"]])}
      <p>Nach Maßangaben steht nur <b>de</b>:</p>
      ${gt(["Menge", "Beispiel"], [["un kilo de", "un kilo <b>de</b> fraises"], ["une bouteille de", "une bouteille <b>d'</b>eau"], ["un paquet de", "un paquet <b>de</b> sucre"], ["250 grammes de", "250 grammes <b>de</b> beurre"]])}
      <p>Nach dem Preis fragst du: <b>Ça coûte combien ?</b> oder <b>Combien est-ce que ça fait ?</b> Nach einer Menge: <b>Combien de</b> pommes ?</p>`,
    quiz: [["Nous ___ des madeleines.", ["achetons", "achètons", "achettons"], 0, "nous: kein accent"], ["Elle ___ une baguette.", ["achète", "achete", "achètent"], 0, "elle achète"], ["eine Flasche Wasser", ["une bouteille d'eau", "une bouteille de l'eau", "une bouteille du eau"], 0, "Maßangabe + d'"],
      ["ein Kilo Erdbeeren", ["un kilo de fraises", "un kilo des fraises", "un kilo fraises"], 0, "un kilo de"], ["Wie viele Äpfel?", ["Combien de pommes ?", "Combien des pommes ?", "Combien pommes ?"], 0, "Combien de"]] },
  { id: "agout", at: "Unité 5|Volet 2", ico: "🥪", title: "à + Artikel bei Gerichten", sub: "un sandwich au jambon",
    body: `<p>Die Zutat oder Geschmacksrichtung nennst du mit <b>à</b> + bestimmtem Artikel. Wie bei aller verschmelzen à + le und à + les:</p>

  { id: "f20", lang: "fr", title: "Au café", t: "Au [café|Café], je prends un [jus|Saft] d'orange et un croissant. Ma mère prend un [café|Kaffee]. Ça [coûte|kostet] combien ? Ça fait sept [euros|Euro]." },
  { id: "f21", lang: "fr", title: "Paris", t: "Paris est une grande [ville|Stadt]. Il y a la [tour|Turm] Eiffel, le [musée|Museum] du Louvre et beaucoup de [restaurants|Restaurants]. Pour visiter Paris, on prend le [métro|U-Bahn]." },
  { id: "f22", lang: "fr", title: "Un jour nul", t: "Aujourd'hui, c'est vraiment un jour [nul|doof] ! J'ai [oublié|vergessen] mes devoirs. En maths, je ne [comprends|verstehe] rien. Et à la cantine, il n'y a plus de [dessert|Nachspeise]. C'est l'[horreur|Horror] !" },
  { id: "f23", lang: "fr", title: "Le cours de français", t: "En cours, la prof dit : « [Ouvrez|Öffnet] vos [livres|Bücher], s'il vous plaît ! » Puis elle [écrit|schreibt] une phrase au [tableau|Tafel]. Nous [répétons|wiederholen] la phrase." },
  { id: "f24", lang: "fr", title: "Une recette", t: "Pour faire des crêpes, il faut de la [farine|Mehl], du [lait|Milch] et des œufs. D'[abord|zuerst], on prépare la [pâte|Teig]. Ensuite, on cuit les crêpes. Avec du [sucre|Zucker], c'est super bon !" },
  { id: "f25", lang: "fr", title: "Mon rêve", t: "Mon [rêve|Traum], c'est de visiter la [montagne|Gebirge] en hiver. Je voudrais faire du ski avec mes [parents|Eltern]. Le soir, on [mange|isst] une fondue et on [joue|spielt] aux cartes." },
  { id: "e01", lang: "en", title: "Hi, I'm Tom!", t: "Hi, my [name|Name] is Tom. I'm twelve years [old|alt]. I live in Bristol with my [parents|Eltern] and my [sister|Schwester]. I've got a [dog|Hund] called Max." },
  { id: "e02", lang: "en", title: "My school", t: "My [school|Schule] is big. There are thirty [pupils|Schüler] in my class. My favourite [subject|Schulfach] is English because the [teacher|Lehrer] is funny. I don't like [maths|Mathe]." },
  { id: "e03", lang: "en", title: "A day at home", t: "On Saturday I [get up|aufstehen] at nine. I have [breakfast|Frühstück] with my family. Then I [help|helfe] my mum in the [garden|Garten]. In the evening we [watch|schauen] a film." },
  { id: "e04", lang: "en", title: "My bedroom", t: "My [bedroom|Schlafzimmer] is small but nice. My [bed|Bett] is next to the [window|Fenster]. There's a [desk|Schreibtisch] with my computer on it. My clothes are in the [wardrobe|Kleiderschrank]." },
  { id: "e05", lang: "en", title: "Shopping", t: "Let's go [shopping|einkaufen]! We need some [bread|Brot], [milk|Milch] and apples. How [much|viel] is the cheese? It's three [pounds|Pfund]." },
  { id: "e06", lang: "en", title: "Hobbies", t: "In my free [time|Zeit] I play [football|Fußball] with my friends. My sister [reads|liest] books and she can [play|spielen] the guitar. We both like [swimming|Schwimmen]." },
  { id: "e07", lang: "en", title: "The weather", t: "Today the [weather|Wetter] is terrible. It's [raining|regnen] and it's very [cold|kalt]. I'm wearing my [jacket|Jacke] and a hat. I hope it's [sunny|sonnig] tomorrow." },
  { id: "e08", lang: "en", title: "A birthday party", t: "It's my [birthday|Geburtstag] today! My friends are coming to my [party|Party]. Mum is making a big chocolate [cake|Kuchen]. I'm very [happy|glücklich] about all the [presents|Geschenke]." },
  { id: "e09", lang: "en", title: "In London", t: "London is the [capital|Hauptstadt] of England. You can [visit|besuchen] Big Ben and the Tower. Many tourists take the [underground|U-Bahn] or a red [bus|Bus]. It's an [exciting|aufregend] city." },
  { id: "e10", lang: "en", title: "My pet", t: "I've got a [rabbit|Kaninchen]. Her name is Snowy and she's [white|weiß]. She likes [carrots|Karotten]. Every day I [feed|füttere] her and [clean|sauber machen] her cage." },
  { id: "e11", lang: "en", title: "Breakfast", t: "For [breakfast|Frühstück] I usually have [cereal|Müsli] with milk. My dad drinks [coffee|Kaffee] and eats [toast|Toast] with jam. On Sundays we have [eggs|Eier]." },
  { id: "e12", lang: "en", title: "A school trip", t: "Last week our class went on a [trip|Ausflug] to the zoo. We [saw|sahen] lions and monkeys. The [weather|Wetter] was great. We had a [picnic|Picknick] in the park. It was a [great|toll] day!" },
  { id: "e13", lang: "en", title: "My best friend", t: "My best [friend|Freund] is called Sam. He's [tall|groß] and he has got brown [hair|Haare]. He's very [funny|lustig] and always [helps|hilft] me with my homework." },
  { id: "e14", lang: "en", title: "In the kitchen", t: "Let's make [pancakes|Pfannkuchen]! First, put the [flour|Mehl] in a bowl. Then add two eggs and some [milk|Milch]. Mix it all. Now [cook|braten] the pancakes in a [pan|Pfanne]." },
  { id: "e15", lang: "en", title: "The holidays", t: "In the summer [holidays|Ferien] we go to the [seaside|Meer]. I love [swimming|Schwimmen] in the sea. My little brother [builds|baut] sandcastles on the [beach|Strand]." },
  { id: "e16", lang: "en", title: "Time to get up!", t: "My [alarm clock|Wecker] rings at seven [o'clock|Uhr]. I get up and [brush|putze] my teeth. Then I get [dressed|angezogen] and go to [school|Schule] by bike." },
  { id: "e17", lang: "en", title: "At the station", t: "Excuse me, when does the next [train|Zug] to Oxford [leave|abfahren]? – At half past ten. – Which [platform|Gleis]? – Platform three. – Thank you. How much is a [ticket|Fahrkarte]? – Twelve [pounds|Pfund]." },
  { id: "e18", lang: "en", title: "My town", t: "My [town|Stadt] isn't very big. There's a [library|Bücherei], a sports centre and some [shops|Geschäfte]. On Saturdays there's a [market|Markt] in the town [square|Platz]." },
  { id: "e19", lang: "en", title: "A rainy afternoon", t: "It's a rainy [afternoon|Nachmittag]. Lisa is [bored|gelangweilt]. She [calls|ruft an] her friend Emma. They [decide|entscheiden] to bake [cookies|Kekse] together." },
  { id: "e20", lang: "en", title: "Sports day", t: "Today is sports [day|Tag] at our school. I'm in the [race|Rennen]. I [run|renne] as fast as I can and I [win|gewinne]! My friends [cheer|jubeln] for me." },
  { id: "e21", lang: "en", title: "A new pupil", t: "There's a new [girl|Mädchen] in our class. She [comes|kommt] from Spain. She can [speak|sprechen] three languages. She's a bit [shy|schüchtern], so I [show|zeige] her the school." },
  { id: "e22", lang: "en", title: "At the doctor's", t: "I don't feel [well|gut]. I've got a [headache|Kopfschmerzen] and a sore [throat|Hals]. The [doctor|Arzt] says I must stay in [bed|Bett] for two days." },
  { id: "e23", lang: "en", title: "Christmas", t: "At [Christmas|Weihnachten] we put up a [tree|Baum] in the living room. On the 25th of December we open our [presents|Geschenke]. We eat [turkey|Truthahn] and Christmas pudding. I [love|liebe] Christmas!" },
  { id: "e24", lang: "en", title: "My favourite food", t: "My [favourite|Lieblings-] food is pizza. I like it with [cheese|Käse] and [tomatoes|Tomaten]. I don't like [fish|Fisch]. My mum says I should eat more [vegetables|Gemüse]." },
  { id: "e25", lang: "en", title: "Saturday plans", t: "What are you [doing|machen] on Saturday? – I'm [going|gehen] to the cinema. Do you want to [come|kommen]? – Yes, great! What [time|Zeit] does the film [start|anfangen]?" },
  { id: "f26", lang: "fr", title: "À la bibliothèque", t: "Le mercredi, je vais à la [bibliothèque|Bücherei] de mon quartier. Il faut parler tout [bas|leise]. J'[emprunte|leihe aus] deux romans et une BD. La bibliothécaire m'aide à [trouver|finden] un livre sur l'espace. Je dois rendre les livres dans trois [semaines|Wochen]." },
  { id: "f27", lang: "fr", title: "Chez le médecin", t: "Aujourd'hui, je ne vais pas au collège. J'ai [mal|Schmerzen] à la tête et j'ai de la [fièvre|Fieber]. Le [médecin|Arzt] dit : « Tu dois rester au [lit|Bett] deux jours et boire beaucoup d'[eau|Wasser]. »" },
  { id: "f28", lang: "fr", title: "À la piscine", t: "Le mardi, en EPS, nous allons à la [piscine|Schwimmbad]. J'adore [nager|schwimmen] ! Mon copain Théo a peur de l'eau, alors il reste au [bord|Rand] du bassin. Après le cours, nous avons très [froid|kalt] et très [faim|Hunger]." },
  { id: "f29", lang: "fr", title: "Mon portable", t: "Pour mon anniversaire, j'ai eu un nouveau [portable|Handy]. Je l'utilise pour [écrire|schreiben] des messages à mes copains et pour prendre des [photos|Fotos]. Mais mes parents disent : « Pas de portable à [table|Tisch] et pas après neuf [heures|Uhr] ! »" },
  { id: "f30", lang: "fr", title: "Une lettre à ma corres", t: "Chère Julie, merci pour ta [lettre|Brief] ! Moi, j'habite dans un petit [village|Dorf] près de Munich. J'ai un frère et deux [chats|Katzen]. Au collège, ma [matière|Schulfach] préférée, c'est le français, bien sûr ! Écris-moi [bientôt|bald] ! Bises, Anna" },
  { id: "f31", lang: "fr", title: "La fête de la musique", t: "Le 21 [juin|Juni], c'est la fête de la musique en France. Dans toutes les [rues|Straßen], il y a des concerts [gratuits|kostenlos]. Mon frère [joue|spielt] de la guitare avec son groupe devant la [mairie|Rathaus]. Tout le monde danse !" },
  { id: "f32", lang: "fr", title: "Noël en France", t: "En France, on fête [Noël|Weihnachten] le 25 décembre. Le soir du 24, toute la famille mange ensemble. Il y a de la dinde et une [bûche|Baumstammkuchen] au chocolat. Les enfants mettent leurs [chaussures|Schuhe] devant le [sapin|Tannenbaum] et le matin, ils trouvent leurs [cadeaux|Geschenke]." },
  { id: "f33", lang: "fr", title: "Au zoo", t: "Pendant les vacances, nous visitons le [zoo|Zoo] de Vincennes. Les [lions|Löwen] dorment au soleil et les singes sont très [drôles|lustig]. Ma petite sœur adore les [girafes|Giraffen] parce qu'elles sont très [grandes|groß]." },
  { id: "f34", lang: "fr", title: "Le train pour Lyon", t: "Nous partons à Lyon en [train|Zug]. À la [gare|Bahnhof], mon père achète les [billets|Fahrkarten]. Le train part à dix heures et [quart|Viertel]. Le voyage dure deux heures. Pendant le voyage, je [lis|lese] une BD." },
  { id: "f35", lang: "fr", title: "À la boulangerie", t: "– [Bonjour|Guten Tag], madame ! Je voudrais une [baguette|Baguette] et deux croissants, s'il vous plaît. – Voilà ! Et avec ça ? – C'est [tout|alles], merci. Ça fait [combien|wie viel] ? – Trois euros [cinquante|fünfzig]." },
  { id: "f36", lang: "fr", title: "Ma ville idéale", t: "Dans ma ville idéale, il n'y a pas de [voitures|Autos]. Tout le monde va à [vélo|Fahrrad] ou à pied. Il y a beaucoup d'[arbres|Bäume] et un grand [parc|Park] avec un lac. Et le collège commence à dix [heures|Uhr] !" },
  { id: "f37", lang: "fr", title: "Mon petit frère", t: "Mon petit [frère|Bruder] s'appelle Léo. Il a cinq [ans|Jahre]. Il est mignon, mais il [crie|schreit] souvent et il prend mes [affaires|Sachen]. Le soir, je lui [lis|lese] une histoire et il s'endort tout de suite." },
  { id: "f38", lang: "fr", title: "Un match de foot", t: "Dimanche, notre [équipe|Mannschaft] joue contre le club du village voisin. Il fait [froid|kalt], mais les parents sont là pour nous [encourager|anfeuern]. À la dernière minute, Karim marque un [but|Tor] ! Nous [gagnons|gewinnen] deux à un." },
  { id: "f39", lang: "fr", title: "La rentrée", t: "C'est la [rentrée|Schulanfang] ! J'ai un nouveau [sac|Tasche] et des cahiers de toutes les couleurs. Dans ma [classe|Klasse], il y a trois nouveaux élèves. Notre prof principal est [jeune|jung] et très sympa. Je suis un peu [stressé|gestresst], mais content." },
  { id: "f40", lang: "fr", title: "Au cinéma", t: "Ce soir, je vais au [cinéma|Kino] avec Emma. Nous regardons un [film|Film] d'aventure. Avant le film, nous achetons du [pop-corn|Popcorn] et une boisson. Le film est super, mais un peu [long|lang]. Après, nous [rentrons|nach Hause gehen] en bus." },
  { id: "f41", lang: "fr", title: "Au camping", t: "Cet été, nous faisons du [camping|Camping] en Provence. Le soir, nous dormons sous la [tente|Zelt]. Le matin, j'entends les [oiseaux|Vögel]. Le seul problème : il y a beaucoup de [moustiques|Mücken] ! Mais j'adore manger [dehors|draußen]." },
  { id: "f42", lang: "fr", title: "Mon métier de rêve", t: "Plus tard, je voudrais être [vétérinaire|Tierarzt]. J'aime beaucoup les [animaux|Tiere] et je veux les [aider|helfen]. Pour ça, je dois bien [travailler|lernen] à l'école, surtout en biologie. Ma tante est vétérinaire, elle a un [cabinet|Praxis] à Lille." },
  { id: "f43", lang: "fr", title: "Au restaurant", t: "Ce soir, nous mangeons au [restaurant|Restaurant] pour l'anniversaire de papa. Le serveur nous donne la [carte|Speisekarte]. Comme [entrée|Vorspeise], je prends une soupe à l'oignon, et comme plat, un [poulet|Hähnchen] avec des frites. À la fin, papa paie l'[addition|Rechnung]." },
  { id: "f44", lang: "fr", title: "Les vêtements", t: "Je cherche un [pull|Pullover] pour l'hiver. Dans le magasin, il y a un pull [rouge|rot] et un pull bleu. Je prends le bleu, il est plus [joli|hübsch]. Ma mère m'achète aussi un [pantalon|Hose] noir. Ça [coûte|kostet] soixante euros." },
  { id: "f45", lang: "fr", title: "Le petit-déjeuner", t: "En France, le [petit-déjeuner|Frühstück] est souvent sucré. On mange une tartine avec du [beurre|Butter] et de la [confiture|Marmelade]. Les enfants boivent un [chocolat|Kakao] chaud et les parents un café. Le dimanche, il y a des [croissants|Croissants] !" },
  { id: "f46", lang: "fr", title: "Un concert", t: "Samedi, je vais à mon premier [concert|Konzert] ! Ma [chanteuse|Sängerin] préférée chante à Paris. Les [billets|Karten] sont chers, mais c'est mon cadeau d'anniversaire. Pendant le concert, tout le monde [chante|singt] et [danse|tanzt]. C'est magique !" },
  { id: "f47", lang: "fr", title: "La météo de la semaine", t: "[Lundi|Montag], il pleut. Mardi, il y a du [vent|Wind]. Mercredi, il fait beau et [chaud|warm]. Jeudi, il y a des [nuages|Wolken]. Et le week-end ? Il va [neiger|schneien] dans les montagnes !" },
  { id: "f48", lang: "fr", title: "Une journée en famille", t: "Le dimanche, toute la [famille|Familie] se retrouve chez mes grands-parents. Ma grand-mère prépare un [repas|Essen] délicieux. Après le déjeuner, les adultes [parlent|reden] et les enfants [jouent|spielen] dans le [jardin|Garten]." },
  { id: "f49", lang: "fr", title: "Les saisons", t: "Il y a quatre [saisons|Jahreszeiten]. Au [printemps|Frühling], les fleurs sont belles. En été, il fait chaud et on va à la [plage|Strand]. En [automne|Herbst], les feuilles tombent. Et en hiver, il [neige|schneit] parfois." },
  { id: "f50", lang: "fr", title: "Le chat perdu", t: "Ce matin, Minou n'est pas à la maison ! Je le [cherche|suche] partout : dans le jardin, dans la [rue|Straße] et chez les voisins. Je fais une [affiche|Plakat] avec sa photo. Le soir, la voisine [sonne|klingelt] à la porte : Minou dort dans son [garage|Garage] !" },
  { id: "e26", lang: "en", title: "At the hairdresser's", t: "My hair was too [long|lang], so I went to the [hairdresser's|Friseur]. I said: “Just a little bit [shorter|kürzer], please.” But the hairdresser was talking on the [phone|Telefon] the whole time. Now my hair is very short. I need a [hat|Mütze]!" },
  { id: "e27", lang: "en", title: "Bonfire Night", t: "On the 5th of [November|November] people in Britain celebrate Bonfire Night. They light a big [fire|Feuer] in the park and watch the [fireworks|Feuerwerk]. Children hold [sparklers|Wunderkerzen] and eat toffee apples. It's cold, so we wear [gloves|Handschuhe] and hats." },
  { id: "e28", lang: "en", title: "Computer problems", t: "Oh no! My [laptop|Laptop] doesn't work. The [screen|Bildschirm] stays black and I can't [save|speichern] my homework. My brother [checks|überprüft] the cable and laughs: “It isn't [plugged in|eingesteckt]!”" },
  { id: "e29", lang: "en", title: "An email from New York", t: "Hi Lisa! I'm in New York with my parents. The [buildings|Gebäude] are so tall! Yesterday we went to the top of the Empire State [Building|Gebäude] and walked through Central [Park|Park]. The yellow [taxis|Taxis] are everywhere. See you [soon|bald]! Ben" },
  { id: "e30", lang: "en", title: "Halloween", t: "On the 31st of October it's [Halloween|Halloween]. Children wear scary [costumes|Kostüme] and go from [door|Tür] to door. They say “Trick or treat!” and get [sweets|Süßigkeiten]. We put a [pumpkin|Kürbis] with a candle in the window." },
  { id: "e31", lang: "en", title: "At the aquarium", t: "Today we visited the [aquarium|Aquarium] in Plymouth. We walked through a glass [tunnel|Tunnel] under the water. Big [sharks|Haie] swam over our heads! My favourite animals were the [turtles|Schildkröten]. They move very [slowly|langsam]." },
  { id: "e32", lang: "en", title: "A camping trip", t: "Last summer we went [camping|zelten] in Wales. We slept in a [tent|Zelt] next to a lake. In the evening we made a [fire|Feuer] and cooked sausages. At night it was very [dark|dunkel] and we could see lots of [stars|Sterne]." },
  { id: "e33", lang: "en", title: "Games night", t: "Every Friday is games [night|Abend] at our house. We play [board|Brett-] games and card games at the kitchen [table|Tisch]. My little brother always wants to [win|gewinnen]. When he loses, he gets [angry|wütend], but we all laugh in the end." },
  { id: "e34", lang: "en", title: "Clothes shopping", t: "I need a new [jumper|Pullover] for the winter. In the shop there's a red one and a blue one. I [try|probiere] on the blue one. It [fits|passt] perfectly! Mum also buys me some [trousers|Hose]. It all [costs|kostet] fifty pounds." },
  { id: "e35", lang: "en", title: "My dream job", t: "When I grow up, I want to be an [astronaut|Astronautin]. I want to fly to the [moon|Mond] and look at the Earth from [space|Weltall]. For that I have to be very [fit|fit] and good at maths and [physics|Physik]." },
  { id: "e36", lang: "en", title: "Thanksgiving", t: "My cousins live in the USA. In November they celebrate [Thanksgiving|Erntedankfest]. The whole family [meets|trifft sich] for a big dinner. They eat [turkey|Truthahn], potatoes and pumpkin [pie|Kuchen]. Everybody says what they are [thankful|dankbar] for." },
  { id: "e37", lang: "en", title: "Learning to ride a bike", t: "My little sister is [learning|lernen] to ride a [bike|Fahrrad]. Dad holds the back of the [seat|Sattel] and runs next to her. Suddenly he lets go, but she doesn't [notice|bemerken]. She rides all the way to the end of the street on her [own|eigen]!" },
  { id: "e38", lang: "en", title: "The missing cake", t: "Mum made a chocolate [cake|Kuchen] for the party. But when we came home, half of the cake was [gone|weg]! There were [crumbs|Krümel] on the floor and chocolate on the dog's [nose|Nase]. Now we know who the [thief|Dieb] was!" },
  { id: "e39", lang: "en", title: "At the dentist's", t: "Today I had an [appointment|Termin] at the dentist's. I was a bit [scared|ängstlich]. The dentist looked at my [teeth|Zähne] and said: “Everything is fine, but you should [brush|putzen] your teeth twice a day and eat fewer [sweets|Süßigkeiten].”" },
  { id: "e40", lang: "en", title: "On the farm", t: "My grandparents live on a [farm|Bauernhof]. They have [cows|Kühe], sheep and lots of chickens. In the morning I help Grandpa [collect|sammeln] the eggs. In the afternoon we [ride|reiten] the horses across the [fields|Felder]." },
  { id: "e41", lang: "en", title: "A science lesson", t: "In our [science|Naturwissenschaften] lesson we did an [experiment|Experiment] today. We mixed water and [salt|Salz] and then heated it. Our teacher said: “Be [careful|vorsichtig], it's hot!” At the end we wrote down the [results|Ergebnisse]." },
  { id: "e42", lang: "en", title: "Healthy living", t: "To stay [healthy|gesund], you should eat lots of fruit and [vegetables|Gemüse]. Drink enough [water|Wasser] and don't eat too many sweets. It's also important to do [sport|Sport] and to [sleep|schlafen] about nine hours every night." },
  { id: "e43", lang: "en", title: "On the bus", t: "Every morning I take the [bus|Bus] to school. The bus [stop|Haltestelle] is right in front of our house. The [journey|Fahrt] takes twenty minutes. I usually sit next to my friend Leo and we [listen|hören] to music. Sometimes the bus is [late|verspätet]." },
  { id: "e44", lang: "en", title: "The talent show", t: "Our school has a [talent|Talent] show every year. This year I'm [nervous|nervös] because I'm going to [sing|singen] on stage. My friend Amy is doing magic [tricks|Tricks]. The winner gets a big [prize|Preis]!" },
  { id: "e45", lang: "en", title: "At the museum", t: "Today our class visited the Natural History [Museum|Museum]. We saw the [skeleton|Skelett] of a huge dinosaur. Our guide [explained|erklärte] how old the bones are. I bought a [postcard|Postkarte] in the museum [shop|Laden]." },
  { id: "e46", lang: "en", title: "Pocket money", t: "I get five pounds [pocket|Taschen-] money every week. I usually [save|spare] most of it, because I want to [buy|kaufen] a new bike. Sometimes I spend some [money|Geld] on comics or [sweets|Süßigkeiten]." },
  { id: "e47", lang: "en", title: "Tidy your room!", t: "“Your [room|Zimmer] is a mess!” says Mum. So I [tidy|räume auf] it on Saturday. I put my clothes in the [wardrobe|Kleiderschrank] and my books on the [shelf|Regal]. Under the bed I find my old [skateboard|Skateboard]!" },
  { id: "e48", lang: "en", title: "A trip to Scotland", t: "In the holidays we [travelled|reisten] to Scotland. We visited an old [castle|Burg] in Edinburgh. Then we drove to the [Highlands|Highlands]. The [mountains|Berge] were beautiful, but it [rained|regnete] every day!" },
  { id: "e49", lang: "en", title: "Making a video", t: "My friends and I want to make a [video|Video] for our school project. First we write the [story|Geschichte]. Then we [film|filmen] the scenes in the park. Sam is the [actor|Schauspieler] and I'm the [director|Regisseurin]." },

/* ---------- Lernserie ---------- */
function dayNum(key) { const [y, m, d] = key.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
function histStreak() {
  const days = histDays(S.me, 60);
  let i = days.length - 1;
  if (!days[i].c) i--;
  let n = 0;
  while (i >= 0 && days[i].c > 0) { n++; i--; }
  return n;
}
function migrateStreak() {
  const st = S.me.settings && S.me.settings.streak;
  if (st && st.last) return;
  const n = histStreak(); if (!n) return;
  const todayDone = histDays(S.me, 1)[0].c > 0;
  const last = todayKey(new Date(Date.now() - (todayDone ? 0 : 86400000)));
  setSetting("streak", { count: n, last, paid: Math.floor(n / 100) * 100 });
  setSetting("bestStreak", Math.max(n, +(S.me.settings.bestStreak) || 0));
}
function streakInfo() {
  const st = (S.me && S.me.settings && S.me.settings.streak) || null;
  const best = +(S.me && S.me.settings && S.me.settings.bestStreak) || 0;
  if (!st || !st.last) return { count: 0, today: false, risk: false, best };
  const gap = dayNum(todayKey()) - dayNum(st.last);
  if (gap <= 0) return { count: st.count, today: true, risk: false, best };
  if (gap === 1) return { count: st.count, today: false, risk: true, best };
  return { count: 0, today: false, risk: false, best };
}
function streakDays() { return streakInfo().count; }
/* erste richtige Vokabel des Tages: Serie weiterzählen */
function bumpStreak() {
  const t = todayKey(), st = (S.me.settings && S.me.settings.streak) || {};
  if (st.last === t) return;
  const cont = st.last && dayNum(t) - dayNum(st.last) === 1;
  const count = cont ? (+st.count || 0) + 1 : 1;
  let paid = cont ? (+st.paid || 0) : 0, reward = 0;
  if (count % 100 === 0 && count > paid) { reward = STREAK_REWARD; paid = count; S.me.coins = (S.me.coins || 0) + reward; }
  setSetting("streak", { count, last: t, paid });
  if (count > (+S.me.settings.bestStreak || 0)) setSetting("bestStreak", count);
  Pets.refreshGlow();
  setTimeout(() => Celebrate.show(count, reward), 450);
}
function nextStreakGoal(n) { return n < 7 ? 7 : n < 100 ? Math.min(100, (Math.floor(n / 7) + 1) * 7) : (Math.floor(n / 100) + 1) * 100; }

      case "catch": {
